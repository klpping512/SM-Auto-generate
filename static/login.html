<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg?v=5"/>
<link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico?v=5"/>
<link rel="apple-touch-icon" href="/static/icons/icon-180.png?v=5"/>
<link rel="manifest" href="/static/manifest.json?v=5"/>
<meta name="theme-color" content="#B98A4C"/>
<title>登录 - SA-LogiFlow</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="/static/design-system.css?v=5"/>
<style>
.login-bg {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: linear-gradient(112deg, #171717 0 42%, var(--bg-page) 42% 100%);
}
.login-shell {
    width: min(980px, 100%);
    display:grid;
    grid-template-columns:1fr 420px;
    gap:96px;
    align-items:center;
}
.login-logo {
    width: 270px;
    height: 64px;
    background: #fff;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    margin: 0 0 20px;
    box-shadow: none;
    padding: 12px 14px;
}
.login-logo img{display:block;width:100%;height:auto;object-fit:contain;}
.login-brand { color:#fff; padding:24px 0; }
.login-brand h1 { font-size:42px;line-height:1;font-weight:900;letter-spacing:1px; }
.login-brand p { color:#D3C4AF;font-size:14px;margin-top:14px;letter-spacing:1px; }
.login-brand-line { width:72px;height:4px;background:var(--primary);margin-top:28px; }
.login-card { padding:36px !important;border-top:5px solid var(--primary) !important; }
@media(max-width:760px){
    .login-bg{background:var(--bg-page);padding:20px;}
    .login-shell{display:block;}
    .login-brand{color:var(--text-primary);text-align:center;padding:0 0 22px;}
    .login-logo{margin:0 auto 14px;}
    .login-brand h1{font-size:28px;}
    .login-brand p{color:var(--text-muted);}
    .login-brand-line{margin:18px auto 0;}
}
</style>
</head>
<body class="login-bg">
<div class="login-shell">
    <div class="login-brand">
        <div class="login-logo">
            <img src="/static/icons/buffalo_logo_header.png?v=1" alt="Buffalo Logo"/>
        </div>
        <h1>SA-LOGIFLOW</h1>
        <p>南非物流 · 社媒内容运营中枢</p>
        <div class="login-brand-line"></div>
    </div>
    <div class="card login-card">
        <div style="display:flex;gap:8px;margin-bottom:24px;" role="tablist" aria-label="登录与注册">
            <button id="loginTab" class="btn btn-primary" style="flex:1;justify-content:center;" onclick="setMode('login')">登录</button>
            <button id="signupTab" class="btn btn-secondary" style="flex:1;justify-content:center;" onclick="setMode('signup')">注册账号</button>
        </div>
        <div id="errorMsg" style="display:none;background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;font-size:13px;padding:10px 12px;border-radius:var(--radius-md);margin-bottom:16px;"></div>
        <div style="display:flex;flex-direction:column;gap:16px;">
            <div>
                <label style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:block;">用户名</label>
                <input id="username" class="input" placeholder="输入用户名" autofocus/>
            </div>
            <div id="displayNameField" hidden>
                <label style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:block;">姓名</label>
                <input id="displayName" class="input" maxlength="40" placeholder="用于区分团队成员"/>
            </div>
            <div>
                <label style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:block;">密码</label>
                <input id="password" type="password" class="input" placeholder="输入密码"/>
            </div>
            <button id="loginBtn" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;" onclick="submitForm()">登录</button>
        </div>
        <p id="formHint" style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:16px;">使用自己的账号进入独立运营空间</p>
    </div>
</div>
<script>
if (localStorage.getItem('token')) window.location.href = '/home.html';
let mode = 'login';

function setMode(nextMode) {
    mode = nextMode;
    const signup = mode === 'signup';
    document.getElementById('displayNameField').hidden = !signup;
    document.getElementById('loginTab').className = signup ? 'btn btn-secondary' : 'btn btn-primary';
    document.getElementById('signupTab').className = signup ? 'btn btn-primary' : 'btn btn-secondary';
    document.getElementById('loginTab').style.cssText = 'flex:1;justify-content:center;';
    document.getElementById('signupTab').style.cssText = 'flex:1;justify-content:center;';
    document.getElementById('loginBtn').textContent = signup ? '创建个人账号' : '登录';
    document.getElementById('formHint').textContent = signup ? '注册后可建立属于自己的多平台账号矩阵' : '使用自己的账号进入独立运营空间';
    document.getElementById('errorMsg').style.display = 'none';
}

async function submitForm() {
    if (mode === 'signup') return doSignup();
    return doLogin();
}

async function doSignup() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const displayName = document.getElementById('displayName').value.trim();
    const errDiv = document.getElementById('errorMsg');
    const btn = document.getElementById('loginBtn');
    if (!username || !password || !displayName) { errDiv.textContent = '请填写姓名、用户名和密码'; errDiv.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = '创建中...'; errDiv.style.display = 'none';
    try {
        const resp = await fetch('/api/auth/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password, display_name: displayName }) });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || '注册失败');
        setMode('login');
        errDiv.style.display = 'block'; errDiv.style.background = '#F0FDF4'; errDiv.style.borderColor = '#BBF7D0'; errDiv.style.color = '#166534'; errDiv.textContent = '注册成功，请登录';
    } catch (e) { errDiv.textContent = e.message; errDiv.style.display = 'block'; }
    finally { btn.disabled = false; if (mode === 'signup') btn.textContent = '创建个人账号'; }
}

async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errDiv = document.getElementById('errorMsg');
    const btn = document.getElementById('loginBtn');
    if (!username || !password) { errDiv.textContent = '请输入用户名和密码'; errDiv.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = '登录中...'; errDiv.style.display = 'none';
    try {
        const resp = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail || '登录失败'); }
        const data = await resp.json();
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('user', JSON.stringify({ username: data.username, role: data.role, display_name: data.display_name }));
        window.location.href = '/home.html';
    } catch (e) { errDiv.textContent = e.message; errDiv.style.display = 'block'; }
    finally { btn.disabled = false; btn.textContent = '登录'; }
}

document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') submitForm(); });
</script>
</body>
</html>

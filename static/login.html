<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg?v=2"/>
<link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico?v=2"/>
<link rel="apple-touch-icon" href="/static/icons/icon-180.png?v=2"/>
<link rel="manifest" href="/static/manifest.json?v=2"/>
<meta name="theme-color" content="#6366f1"/>
<title>登录 - SA-LogiFlow</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="/static/design-system.css"/>
<style>
.login-bg {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
        radial-gradient(circle at 18% 18%, rgba(123,97,255,0.14), transparent 28%),
        radial-gradient(circle at 82% 16%, rgba(84,160,255,0.13), transparent 24%),
        var(--bg-page);
}
.login-shell {
    width: min(420px, 100%);
}
.login-logo {
    width: 60px;
    height: 60px;
    background: var(--main-gradient);
    border-radius: var(--radius-lg);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    box-shadow: 0 14px 30px rgba(123,97,255,0.22);
}
</style>
</head>
<body class="login-bg">
<div class="login-shell">
    <div style="text-align:center;margin-bottom:32px;">
        <div class="login-logo">
            <iconify-icon icon="mdi:truck-fast" width="30" style="color:white;"></iconify-icon>
        </div>
        <h1 style="font-size:26px;font-weight:800;color:var(--text-primary);letter-spacing:0;">SA-LogiFlow</h1>
        <p style="font-size:13px;color:var(--text-muted);margin-top:4px;">南非物流社媒营销平台</p>
    </div>
    <div class="card" style="padding:32px;">
        <h2 style="font-size:18px;font-weight:800;margin-bottom:24px;">登录工作台</h2>
        <div id="errorMsg" style="display:none;background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;font-size:13px;padding:10px 12px;border-radius:var(--radius-md);margin-bottom:16px;"></div>
        <div style="display:flex;flex-direction:column;gap:16px;">
            <div>
                <label style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:block;">用户名</label>
                <input id="username" class="input" placeholder="输入用户名" autofocus/>
            </div>
            <div>
                <label style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:block;">密码</label>
                <input id="password" type="password" class="input" placeholder="输入密码"/>
            </div>
            <button id="loginBtn" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;" onclick="doLogin()">登录</button>
        </div>
        <p style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:16px;">默认管理员: admin / admin123</p>
    </div>
</div>
<script>
if (localStorage.getItem('token')) window.location.href = '/home.html';

async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errDiv = document.getElementById('errorMsg');
    const btn = document.getElementById('loginBtn');
    if (!username || !password) { errDiv.textContent = '请输入用户名和密码'; errDiv.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = '登录中...'; errDiv.style.display = 'none';
    try {
        const resp = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail || '登录失败'); }
        const data = await resp.json();
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('user', JSON.stringify({ username: data.username, role: data.role, display_name: data.display_name }));
        window.location.href = '/home.html';
    } catch (e) { errDiv.textContent = e.message; errDiv.style.display = 'block'; }
    finally { btn.disabled = false; btn.textContent = '登录'; }
}

document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>

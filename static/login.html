<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>登录 - SA-LogiFlow</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body class="bg-gray-50 text-gray-800 flex items-center justify-center min-h-screen">
<div class="w-full max-w-sm">
    <!-- Logo -->
    <div class="text-center mb-8">
        <div class="w-16 h-16 bg-blue-900 rounded-2xl flex items-center justify-center text-white mx-auto mb-4">
            <iconify-icon icon="mdi:truck-fast" width="36"></iconify-icon>
        </div>
        <h1 class="text-2xl font-bold text-blue-900">SA-LogiFlow</h1>
        <p class="text-sm text-gray-500 mt-1">南非物流社媒营销平台</p>
    </div>

    <!-- Login Form -->
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-8">
        <h2 class="text-lg font-bold text-gray-800 mb-6">登录</h2>
        <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4"></div>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                <input id="username" type="text" class="w-full border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="输入用户名" autofocus />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                <input id="password" type="password" class="w-full border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="输入密码" />
            </div>
            <button onclick="doLogin()" id="loginBtn" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700 transition-colors disabled:opacity-50">
                登录
            </button>
        </div>
        <p class="text-xs text-gray-400 mt-4 text-center">默认管理员: admin / admin123</p>
    </div>
</div>

<script>
// 如果已登录，跳转首页
if (localStorage.getItem('token')) {
    window.location.href = '/home.html';
}

async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errDiv = document.getElementById('errorMsg');
    const btn = document.getElementById('loginBtn');

    if (!username || !password) {
        errDiv.textContent = '请输入用户名和密码';
        errDiv.classList.remove('hidden');
        return;
    }

    btn.disabled = true;
    btn.textContent = '登录中...';
    errDiv.classList.add('hidden');

    try {
        const resp = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password}),
        });
        if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.detail || '登录失败');
        }
        const data = await resp.json();
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('user', JSON.stringify({
            username: data.username,
            role: data.role,
            display_name: data.display_name,
        }));
        window.location.href = '/home.html';
    } catch (e) {
        errDiv.textContent = e.message;
        errDiv.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.textContent = '登录';
    }
}

// Enter 键登录
document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>

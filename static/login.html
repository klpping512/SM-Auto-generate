<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg?v=4"/>
<link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico?v=4"/>
<link rel="apple-touch-icon" href="/static/icons/icon-180.png?v=4"/>
<link rel="manifest" href="/static/manifest.json?v=4"/>
<meta name="theme-color" content="#B98A4C"/>
<title>登录 - SA-LogiFlow</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="/static/design-system.css?v=4"/>
<style>
.login-bg {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: linear-gradient(112deg, #171717 0 42%, var(--bg-page) 42% 100%);
}
.login-shell {
    width: min(980px, 100%);
    display:grid;
    grid-template-columns:1fr 420px;
    gap:96px;
    align-items:center;
}
.login-logo {
    width: 64px;
    height: 64px;
    background: var(--main-gradient);
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 0 20px;
    box-shadow: none;
}
.login-brand { color:#fff; padding:24px 0; }
.login-brand h1 { font-size:42px;line-height:1;font-weight:900;letter-spacing:1px; }
.login-brand p { color:#D3C4AF;font-size:14px;margin-top:14px;letter-spacing:1px; }
.login-brand-line { width:72px;height:4px;background:var(--primary);margin-top:28px; }
.login-card { padding:36px !important;border-top:5px solid var(--primary) !important; }
@media(max-width:760px){
    .login-bg{background:var(--bg-page);padding:20px;}
    .login-shell{display:block;}
    .login-brand{color:var(--text-primary);text-align:center;padding:0 0 22px;}
    .login-logo{margin:0 auto 14px;}
    .login-brand h1{font-size:28px;}
    .login-brand p{color:var(--text-muted);}
    .login-brand-line{margin:18px auto 0;}
}
</style>
</head>
<body class="login-bg">
<div class="login-shell">
    <div class="login-brand">
        <div class="login-logo">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none" aria-label="SA-LogiFlow Logo">
                <path d="M3 6h11v9H3zM14 9h3.5l3 3v3H14z" fill="white"/><circle cx="7" cy="17" r="2" fill="white"/><circle cx="17" cy="17" r="2" fill="white"/><path d="M1 9h7M1 12h5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </div>
        <h1>SA-LOGIFLOW</h1>
        <p>南非物流 · 社媒内容运营中枢</p>
        <div class="login-brand-line"></div>
    </div>
    <div class="card login-card">
        <h2 style="font-size:18px;font-weight:800;margin-bottom:24px;">登录工作台</h2>
        <div id="errorMsg" style="display:none;background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;font-size:13px;padding:10px 12px;border-radius:var(--radius-md);margin-bottom:16px;"></div>
        <div style="display:flex;flex-direction:column;gap:16px;">
            <div>
                <label style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:block;">用户名</label>
                <input id="username" class="input" placeholder="输入用户名" autofocus/>
            </div>
            <div>
                <label style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:block;">密码</label>
                <input id="password" type="password" class="input" placeholder="输入密码"/>
            </div>
            <button id="loginBtn" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;" onclick="doLogin()">登录</button>
        </div>
        <p style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:16px;">默认管理员: admin / admin123</p>
    </div>
</div>
<script>
if (localStorage.getItem('token')) window.location.href = '/home.html';

async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errDiv = document.getElementById('errorMsg');
    const btn = document.getElementById('loginBtn');
    if (!username || !password) { errDiv.textContent = '请输入用户名和密码'; errDiv.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = '登录中...'; errDiv.style.display = 'none';
    try {
        const resp = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail || '登录失败'); }
        const data = await resp.json();
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('user', JSON.stringify({ username: data.username, role: data.role, display_name: data.display_name }));
        window.location.href = '/home.html';
    } catch (e) { errDiv.textContent = e.message; errDiv.style.display = 'block'; }
    finally { btn.disabled = false; btn.textContent = '登录'; }
}

document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>

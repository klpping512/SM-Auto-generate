<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SA-LogiFlow - Content Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<script>
tailwind.config = {
    theme: { extend: { colors: {
        dark: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a', 950: '#020617' },
        accent: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5' },
    }}}
}
</script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background: #0a0a0f; }
    .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(99, 102, 241, 0.1); }
    .preview-tab-active { color: #818cf8; border-bottom: 2px solid #6366f1; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>
</head>
<body class="text-gray-100 min-h-screen">
<div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 glass flex flex-col flex-none border-r border-dark-700/50">
        <div class="p-6 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-accent-500 to-accent-600 flex items-center justify-center">
                <iconify-icon icon="mdi:truck-fast" width="20" class="text-white"></iconify-icon>
            </div>
            <div>
                <span class="font-bold text-lg tracking-tight text-white">LogiFlow</span>
                <p class="text-[10px] text-dark-400 -mt-0.5">Social Media Automation</p>
            </div>
        </div>
        <nav class="flex-1 px-3 py-4 space-y-1">
            <a class="flex items-center px-4 py-3 rounded-xl text-dark-300 hover:text-white hover:bg-dark-800/50 transition-all" href="/home.html">
                <iconify-icon class="mr-3" icon="mdi:view-dashboard" width="18"></iconify-icon>
                <span class="text-sm font-medium">Dashboard</span>
            </a>
            <a class="flex items-center px-4 py-3 rounded-xl text-dark-300 hover:text-white hover:bg-dark-800/50 transition-all" href="/accounts.html">
                <iconify-icon class="mr-3" icon="mdi:account-group" width="18"></iconify-icon>
                <span class="text-sm font-medium">Accounts</span>
            </a>
            <a class="flex items-center px-4 py-3 rounded-xl bg-accent-500/10 text-accent-400 border border-accent-500/20 transition-all" href="/editor.html">
                <iconify-icon class="mr-3" icon="mdi:square-edit-outline" width="18"></iconify-icon>
                <span class="text-sm font-medium">Content Studio</span>
            </a>
            <a class="flex items-center px-4 py-3 rounded-xl text-dark-300 hover:text-white hover:bg-dark-800/50 transition-all" href="/queue.html">
                <iconify-icon class="mr-3" icon="mdi:clock-list" width="18"></iconify-icon>
                <span class="text-sm font-medium">Publish Queue</span>
            </a>
            <a class="flex items-center px-4 py-3 rounded-xl text-dark-300 hover:text-white hover:bg-dark-800/50 transition-all" href="/config.html">
                <iconify-icon class="mr-3" icon="mdi:cog" width="18"></iconify-icon>
                <span class="text-sm font-medium">Settings</span>
            </a>
        </nav>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-14 glass border-b border-dark-700/50 flex items-center justify-between px-6 flex-none">
            <h1 class="text-base font-semibold text-white">Content Studio</h1>
            <div class="flex items-center gap-3">
                <span id="autoSave" class="text-xs text-dark-400"></span>
                <button onclick="saveDraft()" class="px-3 py-1.5 rounded-lg border border-dark-600 text-xs text-dark-300 hover:text-white hover:border-accent-500/50 transition-all">Save Draft</button>
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden">
            <!-- Left: Editor -->
            <div class="w-1/2 border-r border-dark-700/50 flex flex-col overflow-y-auto p-5 space-y-4">
                <!-- Topic Selection -->
                <div class="glass rounded-xl p-4 border border-dark-700/50">
                    <label class="text-xs font-medium text-dark-300 uppercase tracking-wider mb-2 block">Topic Selection</label>
                    <div class="flex gap-2">
                        <select id="topicCategory" onchange="loadTopics()" class="flex-1 bg-dark-800 border border-dark-600 rounded-lg px-3 py-2 text-sm text-white focus:border-accent-500 focus:outline-none">
                            <option value="">Select category...</option>
                        </select>
                        <select id="topicSelect" class="flex-1 bg-dark-800 border border-dark-600 rounded-lg px-3 py-2 text-sm text-white focus:border-accent-500 focus:outline-none">
                            <option value="">Select topic...</option>
                        </select>
                    </div>
                    <input id="customTopic" type="text" placeholder="Or enter custom topic..." class="w-full mt-2 bg-dark-800 border border-dark-600 rounded-lg px-3 py-2 text-sm text-white placeholder:text-dark-500 focus:border-accent-500 focus:outline-none"/>
                </div>

                <!-- AI Generator -->
                <div class="glass rounded-xl p-4 border border-accent-500/20 bg-gradient-to-br from-accent-500/5 to-transparent">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <div class="p-1.5 rounded-lg bg-accent-500/10">
                                <iconify-icon icon="mdi:sparkles" width="16" class="text-accent-400"></iconify-icon>
                            </div>
                            <span class="text-sm font-semibold text-white">AI Generator</span>
                        </div>
                        <button id="generateBtn" onclick="generateContent()" class="px-4 py-2 bg-gradient-to-r from-accent-500 to-accent-600 text-white text-xs font-semibold rounded-lg hover:from-accent-600 hover:to-accent-700 transition-all shadow-lg shadow-accent-500/25">
                            Generate
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] text-dark-400 uppercase font-medium mb-1 block">Tone</label>
                            <select id="toneSelect" class="w-full bg-dark-800 border border-dark-600 rounded-lg px-2 py-1.5 text-xs text-white focus:border-accent-500 focus:outline-none">
                                <option value="professional">Professional</option>
                                <option value="friendly">Friendly</option>
                                <option value="urgent">Urgent</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] text-dark-400 uppercase font-medium mb-1 block">Length</label>
                            <select id="lengthSelect" class="w-full bg-dark-800 border border-dark-600 rounded-lg px-2 py-1.5 text-xs text-white focus:border-accent-500 focus:outline-none">
                                <option value="short">Short</option>
                                <option value="medium" selected>Medium</option>
                                <option value="long">Long</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-3">
                        <label class="text-[10px] text-dark-400 uppercase font-medium mb-1.5 block">Platforms</label>
                        <div class="flex gap-2 flex-wrap">
                            <label class="flex items-center gap-1.5 text-xs cursor-pointer px-2 py-1 rounded-lg bg-dark-800/50 border border-dark-600 hover:border-accent-500/30 transition-colors">
                                <input type="checkbox" class="platform-cb accent-accent-500" value="xiaohongshu" checked> <iconify-icon icon="ri:xiaohongshu-fill" class="text-red-400"></iconify-icon> XHS
                            </label>
                            <label class="flex items-center gap-1.5 text-xs cursor-pointer px-2 py-1 rounded-lg bg-dark-800/50 border border-dark-600 hover:border-accent-500/30 transition-colors">
                                <input type="checkbox" class="platform-cb accent-accent-500" value="douyin"> <iconify-icon icon="ri:tiktok-fill" class="text-white"></iconify-icon> Douyin
                            </label>
                            <label class="flex items-center gap-1.5 text-xs cursor-pointer px-2 py-1 rounded-lg bg-dark-800/50 border border-dark-600 hover:border-accent-500/30 transition-colors">
                                <input type="checkbox" class="platform-cb accent-accent-500" value="facebook" checked> <iconify-icon icon="ri:facebook-box-fill" class="text-blue-400"></iconify-icon> Facebook
                            </label>
                            <label class="flex items-center gap-1.5 text-xs cursor-pointer px-2 py-1 rounded-lg bg-dark-800/50 border border-dark-600 hover:border-accent-500/30 transition-colors">
                                <input type="checkbox" class="platform-cb accent-accent-500" value="twitter" checked> <iconify-icon icon="ri:twitter-x-fill" class="text-white"></iconify-icon> Twitter
                            </label>
                            <label class="flex items-center gap-1.5 text-xs cursor-pointer px-2 py-1 rounded-lg bg-dark-800/50 border border-dark-600 hover:border-accent-500/30 transition-colors">
                                <input type="checkbox" class="platform-cb accent-accent-500" value="reddit"> <iconify-icon icon="ri:reddit-fill" class="text-orange-400"></iconify-icon> Reddit
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Status -->
                <div id="genStatus" class="hidden glass rounded-lg p-3 border border-amber-500/20 bg-amber-500/5 text-sm text-amber-300 flex items-center gap-2">
                    <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                    <span id="genStatusText">Generating...</span>
                </div>

                <!-- Editor -->
                <div class="flex-1 flex flex-col">
                    <div class="flex items-center justify-between mb-2">
                        <label class="text-xs font-medium text-dark-300 uppercase tracking-wider">Content Editor</label>
                        <button onclick="addToQueue()" class="px-3 py-1.5 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold rounded-lg hover:bg-emerald-500/20 transition-all flex items-center gap-1">
                            <iconify-icon icon="mdi:send" width="14"></iconify-icon> Add to Queue
                        </button>
                    </div>
                    <div class="flex-1 glass rounded-xl border border-dark-700/50 flex flex-col overflow-hidden">
                        <div class="p-3 border-b border-dark-700/30 flex gap-1">
                            <button class="p-1.5 rounded hover:bg-dark-700/50 text-dark-400 hover:text-white"><iconify-icon icon="mdi:format-bold" width="16"></iconify-icon></button>
                            <button class="p-1.5 rounded hover:bg-dark-700/50 text-dark-400 hover:text-white"><iconify-icon icon="mdi:format-italic" width="16"></iconify-icon></button>
                            <button class="p-1.5 rounded hover:bg-dark-700/50 text-dark-400 hover:text-white"><iconify-icon icon="mdi:format-list-bulleted" width="16"></iconify-icon></button>
                        </div>
                        <textarea id="editorContent" class="flex-1 p-4 bg-transparent text-sm text-white placeholder:text-dark-500 focus:outline-none resize-none" placeholder="Select a topic and click 'Generate', or type directly..."></textarea>
                    </div>
                    <div class="mt-2 flex gap-2">
                        <input id="editorTitle" type="text" placeholder="Title" class="flex-1 bg-dark-800 border border-dark-600 rounded-lg px-3 py-2 text-sm text-white placeholder:text-dark-500 focus:border-accent-500 focus:outline-none font-medium"/>
                        <input id="editorHashtags" type="text" placeholder="Tags (comma separated)" class="w-48 bg-dark-800 border border-dark-600 rounded-lg px-3 py-2 text-sm text-white placeholder:text-dark-500 focus:border-accent-500 focus:outline-none"/>
                    </div>
                </div>
            </div>

            <!-- Right: Preview -->
            <div class="w-1/2 bg-dark-950/50 flex flex-col">
                <div class="border-b border-dark-700/50 px-5 flex items-center h-10 flex-none">
                    <div id="previewTabs" class="flex gap-4 h-full">
                        <button class="h-full px-2 text-xs font-medium preview-tab-active flex items-center gap-1.5" onclick="switchPreview('xiaohongshu', this)">
                            <iconify-icon icon="ri:xiaohongshu-fill" class="text-red-400"></iconify-icon> XHS
                        </button>
                        <button class="h-full px-2 text-xs font-medium text-dark-400 flex items-center gap-1.5 hover:text-white" onclick="switchPreview('facebook', this)">
                            <iconify-icon icon="ri:facebook-box-fill" class="text-blue-400"></iconify-icon> Facebook
                        </button>
                        <button class="h-full px-2 text-xs font-medium text-dark-400 flex items-center gap-1.5 hover:text-white" onclick="switchPreview('twitter', this)">
                            <iconify-icon icon="ri:twitter-x-fill"></iconify-icon> Twitter
                        </button>
                        <button class="h-full px-2 text-xs font-medium text-dark-400 flex items-center gap-1.5 hover:text-white" onclick="switchPreview('reddit', this)">
                            <iconify-icon icon="ri:reddit-fill" class="text-orange-400"></iconify-icon> Reddit
                        </button>
                        <button class="h-full px-2 text-xs font-medium text-dark-400 flex items-center gap-1.5 hover:text-white" onclick="switchPreview('douyin', this)">
                            <iconify-icon icon="ri:tiktok-fill"></iconify-icon> Douyin
                        </button>
                    </div>
                </div>
                <div id="previewArea" class="flex-1 p-6 flex justify-center items-start overflow-y-auto">
                    <div id="previewContent" class="text-dark-500 text-center mt-20">
                        <div class="w-16 h-16 rounded-2xl bg-dark-800/50 flex items-center justify-center mx-auto mb-4">
                            <iconify-icon icon="mdi:sparkles" width="28" class="text-dark-600"></iconify-icon>
                        </div>
                        <p class="text-base font-medium text-dark-400">Click "Generate"</p>
                        <p class="text-sm mt-1">AI will create platform-specific content</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
const API = '';

async function loadCategories() {
    try {
        const resp = await fetch(`${API}/api/topics`);
        const cats = await resp.json();
        const sel = document.getElementById('topicCategory');
        cats.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat.id;
            opt.textContent = cat.name_zh;
            sel.appendChild(opt);
        });
    } catch (e) { console.error('Failed to load categories:', e); }
}

async function loadTopics() {
    const catId = document.getElementById('topicCategory').value;
    const sel = document.getElementById('topicSelect');
    sel.innerHTML = '<option value="">Select topic...</option>';
    if (!catId) return;
    try {
        const resp = await fetch(`${API}/api/topics/${catId}`);
        const data = await resp.json();
        data.topics.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t;
            opt.textContent = t;
            sel.appendChild(opt);
        });
    } catch (e) { console.error('Failed to load topics:', e); }
}

function getSelectedPlatforms() {
    return Array.from(document.querySelectorAll('.platform-cb:checked')).map(cb => cb.value);
}

let generatedContents = {};
let currentPreviewPlatform = 'xiaohongshu';

async function generateContent() {
    const topic = document.getElementById('topicSelect').value || document.getElementById('customTopic').value;
    if (!topic) { alert('Please select a topic'); return; }
    const platforms = getSelectedPlatforms();
    if (platforms.length === 0) { alert('Select at least one platform'); return; }

    const btn = document.getElementById('generateBtn');
    const status = document.getElementById('genStatus');
    btn.disabled = true;
    btn.innerHTML = '<svg class="animate-spin h-3 w-3 inline mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Generating...';
    status.classList.remove('hidden');

    try {
        const resp = await fetch(`${API}/api/generate`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                topic, category: document.getElementById('topicCategory').value || 'custom',
                platforms, tone: document.getElementById('toneSelect').value, length: document.getElementById('lengthSelect').value,
            })
        });
        const data = await resp.json();
        generatedContents = {};
        data.contents.forEach(c => { generatedContents[c.platform] = c; });
        const first = data.contents[0];
        if (first) {
            document.getElementById('editorTitle').value = first.title;
            document.getElementById('editorContent').value = first.body;
            document.getElementById('editorHashtags').value = (first.hashtags || []).join(', ');
        }
        currentPreviewPlatform = platforms[0];
        renderPreview(currentPreviewPlatform);
    } catch (e) {
        console.error('Generation failed:', e);
        alert('Generation failed: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<iconify-icon icon="mdi:sparkles" width="14"></iconify-icon> Generate';
        status.classList.add('hidden');
    }
}

function renderPreview(platform) {
    const content = generatedContents[platform];
    const area = document.getElementById('previewContent');
    if (!content) {
        area.innerHTML = '<div class="text-dark-500 text-center mt-20"><p>No content for this platform</p></div>';
        return;
    }
    area.innerHTML = `
        <div class="max-w-lg w-full fade-in">
            <div class="glass rounded-xl border border-dark-700/50 overflow-hidden">
                <div class="p-5">
                    <h3 class="font-bold text-base mb-3 text-white">${content.title}</h3>
                    <p class="text-sm leading-relaxed whitespace-pre-wrap text-dark-200">${content.body}</p>
                    ${(content.hashtags && content.hashtags.length) ? `<div class="mt-4 flex flex-wrap gap-1.5">${content.hashtags.map(h => `<span class="px-2 py-0.5 bg-accent-500/10 text-accent-400 text-xs rounded-full">#${h}</span>`).join('')}</div>` : ''}
                </div>
            </div>
            <div class="mt-3 flex justify-end">
                <button onclick="editPlatformContent('${platform}')" class="px-3 py-1.5 text-xs border border-dark-600 rounded-lg text-dark-300 hover:text-white hover:border-accent-500/50 transition-all">Edit this version</button>
            </div>
        </div>`;
}

function switchPreview(platform, btn) {
    currentPreviewPlatform = platform;
    document.querySelectorAll('#previewTabs button').forEach(b => {
        b.classList.remove('preview-tab-active');
        b.classList.add('text-dark-400');
    });
    btn.classList.add('preview-tab-active');
    btn.classList.remove('text-dark-400');
    renderPreview(platform);
}

function editPlatformContent(platform) {
    const c = generatedContents[platform];
    if (c) {
        document.getElementById('editorTitle').value = c.title;
        document.getElementById('editorContent').value = c.body;
        document.getElementById('editorHashtags').value = (c.hashtags || []).join(', ');
    }
}

async function addToQueue() {
    const title = document.getElementById('editorTitle').value;
    const body = document.getElementById('editorContent').value;
    if (!title || !body) { alert('Generate or enter content first'); return; }
    const platforms = Object.keys(generatedContents).length > 0 ? Object.keys(generatedContents) : getSelectedPlatforms();
    if (platforms.length === 0) { alert('Select at least one platform'); return; }
    try {
        const resp = await fetch(`${API}/api/queue`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                title, body, platforms,
                hashtags: document.getElementById('editorHashtags').value.split(',').map(s => s.trim()).filter(Boolean),
            })
        });
        const data = await resp.json();
        alert(`Added ${data.added} items to queue`);
    } catch (e) { alert('Failed: ' + e.message); }
}

function saveDraft() {
    localStorage.setItem('draft', JSON.stringify({
        title: document.getElementById('editorTitle').value,
        body: document.getElementById('editorContent').value,
        hashtags: document.getElementById('editorHashtags').value,
    }));
    document.getElementById('autoSave').textContent = 'Saved';
    setTimeout(() => document.getElementById('autoSave').textContent = '', 2000);
}

loadCategories();
</script>
</body>
</html>

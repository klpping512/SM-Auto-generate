<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg?v=5"/>
<link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico?v=5"/>
<link rel="apple-touch-icon" href="/static/icons/icon-180.png?v=5"/>
<link rel="manifest" href="/static/manifest.json?v=5"/>
<meta name="theme-color" content="#B98A4C"/>
<title>内容编辑器 - SA-LogiFlow</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="/static/design-system.css?v=5"/>
<style>
.workspace-grid { flex: 1; display: grid; grid-template-columns: minmax(440px, 1fr) minmax(300px, 380px); gap: 14px; overflow: hidden; min-height: 0; padding-top:18px; }
.col-knowledge,
.col-editor,
.col-preview {
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: rgba(255,255,255,0.92);
    border: 1px solid rgba(229,230,235,0.86);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    overflow: hidden;
}
.col-knowledge { display:none; }
#tplSelect,#toneSelect,#lengthSelect,#genBtnMain { display:none; }
.toolbar { padding: 8px 12px; border-bottom: 1px solid var(--border-light); display: flex; gap: 4px; background:var(--bg-subcard); }
.toolbar button { padding: 6px 8px; border-radius: var(--radius-sm); border: none; background: none; color: var(--text-secondary); cursor: pointer; font-size: 16px; }
.toolbar button:hover { background: var(--bg-secondary); color: var(--text-primary); }
.preview-card { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: white; box-shadow:var(--shadow-sm); }
.preview-card.dark { background: #1a1a1a; border-color: #333; }
.xhs-carousel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.xhs-image{display:block;width:100%;height:auto;object-fit:contain;border:0;border-radius:0;background:transparent;cursor:zoom-in}.xhs-image:hover{box-shadow:var(--shadow-card)}
.lightbox{position:fixed;inset:0;background:#000d;z-index:10000;display:flex;align-items:center;justify-content:center}.lightbox[hidden]{display:none}.lightbox img{max-width:82vw;max-height:86vh;border-radius:10px}.lightbox button{position:absolute;border:0;background:#ffffff22;color:white;border-radius:50%;width:44px;height:44px;font-size:26px;cursor:pointer}.lightbox-close{right:28px;top:22px}.lightbox-prev{left:24px}.lightbox-next{right:24px}.lightbox-count{position:absolute;bottom:20px;color:white;font-size:13px}
.scene-card{border:1px solid #3b3b3b;border-radius:12px;padding:12px;margin-bottom:10px}.scene-card input,.scene-card textarea,.scene-card select{width:100%;background:#242424;border:1px solid #444;color:white;border-radius:7px;padding:7px;font-size:11px;margin-top:6px}.scene-meta{display:flex;justify-content:space-between;color:#aaa;font-size:10px}.render-panel{margin-top:14px;padding:12px;border-radius:12px;background:#262626;color:white}.render-progress{height:7px;background:#444;border-radius:9px;overflow:hidden;margin:8px 0}.render-progress i{display:block;height:100%;background:#B98A4C}
.kb-category {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    user-select: none;
}
.kb-category:hover { background: var(--bg-secondary); }
.kb-topic {
    padding: 5px 8px;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: var(--radius-sm);
}
.kb-topic:hover { background: var(--bg-secondary); color: var(--text-primary); }
.spin { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 900px) {
    .workspace-grid { grid-template-columns: 1fr; overflow: visible; }
    .col-knowledge, .col-editor, .col-preview { min-height: 360px; }
}

/* 历史记录弹窗样式 */
.history-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
}
.history-modal[hidden] { display: none; }
.history-panel {
    background: white;
    border-radius: 16px;
    width: 90%;
    max-width: 700px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.history-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.history-header h3 {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
}
.history-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
}
.history-item {
    padding: 12px 16px;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
}
.history-item:hover {
    background: var(--bg-secondary);
    border-color: var(--primary);
}
.history-item .history-time {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
}
.history-item .history-source {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    display: inline-block;
    margin-bottom: 6px;
}
.history-item .history-source.ai { background: #EDE9FE; color: #7C3AED; }
.history-item .history-source.manual { background: #DBEAFE; color: #2563EB; }
.history-item .history-source.import { background: #FEF3C7; color: #D97706; }
.history-item .history-preview {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.history-item .history-platforms {
    display: flex;
    gap: 4px;
    margin-top: 6px;
}
.history-item .history-platform-tag {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--bg-secondary);
    color: var(--text-secondary);
}
.history-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
}
.history-empty iconify-icon {
    font-size: 48px;
    margin-bottom: 12px;
    display: block;
}
.history-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border-light);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--text-muted);
}
</style>
</head>
<body>
<div class="app-layout" id="app"></div>
<div id="toastContainer" class="toast-container"></div>
<div id="xhsLightbox" class="lightbox" hidden aria-modal="true" role="dialog"><button class="lightbox-close" aria-label="关闭">×</button><button class="lightbox-prev" aria-label="上一张">‹</button><img alt="小红书大图预览"/><button class="lightbox-next" aria-label="下一张">›</button><span class="lightbox-count"></span></div>

<!-- 历史记录弹窗 -->
<div id="historyModal" class="history-modal" hidden>
    <div class="history-panel">
        <div class="history-header">
            <h3><iconify-icon icon="mdi:history" style="color:var(--primary);"></iconify-icon> 历史记录</h3>
            <button class="btn btn-ghost btn-sm" onclick="closeHistoryModal()">
                <iconify-icon icon="mdi:close" width="18"></iconify-icon>
            </button>
        </div>
        <div id="historyList" class="history-list"></div>
        <div class="history-footer">
            <span>最多保存 20 条历史记录</span>
            <button class="btn btn-secondary btn-sm" onclick="clearAllHistory()">
                <iconify-icon icon="mdi:delete-outline" width="14"></iconify-icon> 清空历史
            </button>
        </div>
    </div>
</div>

<script src="/static/common.js?v=9"></script>
<script src="/static/editor-transfer.js?v=3"></script>
<script>
const PAGE_ID = 'editor';
const platformInfo = {
    xiaohongshu: { icon: 'simple-icons:xiaohongshu', color: '#FF2442', name: '小红书' },
    douyin: { icon: 'ri:tiktok-fill', color: '#000', name: '抖音' },
    facebook: { icon: 'ri:facebook-box-fill', color: '#1877F2', name: 'Facebook' },
    twitter: { icon: 'ri:twitter-x-fill', color: '#1DA1F2', name: 'Twitter' },
    reddit: { icon: 'ri:reddit-fill', color: '#FF4500', name: 'Reddit' },
    wechat_mp: { icon: 'ri:wechat-fill', color: '#07C160', name: '微信公众号' },
};

let generatedContents = {};
let currentPreview = 'xiaohongshu';
let categories = [];
let selectedTopic = '';
let selectedCategory = 'custom';
let kbCategories = [];           // 企业知识库分类
let selectedKbCats = new Set();  // 已勾选引用的知识库分类 id
let promptTemplates = [];        // Prompt 模板
let attachments = [];            // 上传的图片/视频附件
let importedFromChat = false;     // AI 对话导入时，仅展示实际带入的平台
let draftVideoWorkflow = null;    // AI 对话传入的正式双素材生产上下文
let mediaAssets = [];
let mediaCapabilities = {};
let publishingAccounts = [];
let lightboxImages = [], lightboxIndex = 0, renderPoller = null;
let activeVideoProject = null;

function parseSourceEvidence() {
    return (document.getElementById('sourceEvidence')?.value || '').split('\n').map(line => line.trim()).filter(Boolean).map(line => {
        const parts = line.split('|').map(value => value.trim());
        return { claim:parts[0]||'', url:parts[1]||'', source_title:parts[2]||'', publisher:parts[3]||'', excerpt:parts.slice(4).join('|').trim() };
    });
}

async function init() {
    try { const r = await apiFetch('/api/topics'); categories = await r.json(); } catch(e) { categories = []; }
    try { const r = await apiFetch('/api/kb/categories'); kbCategories = await r.json(); } catch(e) { kbCategories = []; }
    try { const r = await apiFetch('/api/prompt-templates'); promptTemplates = await r.json(); } catch(e) { promptTemplates = []; }
    try { const r = await apiFetch('/api/assets'); mediaAssets = await r.json(); } catch(e) { mediaAssets = []; }
    try { const r = await apiFetch('/api/media/capabilities'); mediaCapabilities = await r.json(); } catch(e) { mediaCapabilities = {}; }
    try { const r = await apiFetch('/api/accounts'); publishingAccounts = await r.json(); } catch(e) { publishingAccounts = []; }

    document.getElementById('app').innerHTML = `
    ${renderSidebar(PAGE_ID)}
    <div class="main-content">
        <div class="page-header">
            <div><div style="font-size:9px;color:var(--primary);font-weight:900;letter-spacing:1.8px;margin-bottom:3px;">CONTENT PRODUCTION</div><h1 class="page-title">内容编辑器</h1></div>
            <div style="display:flex;gap:8px;align-items:center;">
                <span id="saveStatus" style="font-size:11px;color:var(--text-muted);display:inline-flex;align-items:center;gap:3px;"></span>
                <button class="btn btn-secondary btn-sm" onclick="openHistoryModal()"><iconify-icon icon="mdi:history" width="16"></iconify-icon> 历史记录</button>
                <button class="btn btn-secondary btn-sm" onclick="saveDraft()"><iconify-icon icon="mdi:content-save" width="16"></iconify-icon> 保存草稿</button>
                <button class="btn btn-primary btn-sm" onclick="submitToQueue()"><iconify-icon icon="mdi:send" width="16"></iconify-icon> 提交发布</button>
            </div>
        </div>
        <div id="evidenceGateBanner" hidden style="margin:0 0 12px;padding:10px 12px;border-radius:8px;background:#fff3dc;color:#9a5b00;font-size:12px;">当前内容证据不足（对比框架）。可继续编辑，但在资料确认前不能提交发布。</div>
        <div class="workspace-grid">
            <!-- 左栏：知识库 -->
            <div class="col-knowledge">
                <div style="padding:16px;border-bottom:1px solid var(--border-light);">
                    <div style="font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;">
                        <iconify-icon icon="mdi:book-open-outline" style="color:var(--primary);"></iconify-icon> 知识库
                    </div>
                    <input id="kbSearch" class="input" placeholder="搜索知识库..." style="font-size:12px;padding:6px 10px;"/>
                </div>
                <div id="kbList" style="flex:1;overflow-y:auto;padding:8px;"></div>
                <div style="padding:10px 12px;border-top:1px solid var(--border-light);">
                    <div style="font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:6px;display:flex;align-items:center;gap:4px;">
                        <iconify-icon icon="mdi:bookshelf" width="12"></iconify-icon> 引用企业知识库
                    </div>
                    <div id="kbRefChips" style="display:flex;flex-wrap:wrap;gap:4px;"></div>
                </div>
                <div style="padding:10px 12px;border-top:1px solid var(--border-light);">
                    <div style="font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:6px;">AI 指令（补充要求）</div>
                    <div style="display:flex;gap:6px;">
                        <input id="aiInput" class="input" placeholder="输入需求..." style="font-size:12px;padding:6px 10px;"/>
                        <button class="btn btn-primary btn-sm" onclick="generateContent()" id="genBtn"><iconify-icon icon="mdi:sparkles" width="14"></iconify-icon></button>
                    </div>
                </div>
                <div style="padding:10px 12px;border-top:1px solid var(--border-light);">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
                        <span style="font-size:11px;font-weight:600;color:var(--text-muted);display:flex;align-items:center;gap:4px;"><iconify-icon icon="mdi:robot-outline" width="12"></iconify-icon> AI 对话</span>
                        <button class="btn btn-ghost" onclick="toggleChat()" style="font-size:11px;padding:2px 6px;" id="chatToggleBtn"><iconify-icon icon="mdi:chevron-down" width="14"></iconify-icon></button>
                    </div>
                </div>
                <div id="chatPanel" style="display:none;flex:1;min-height:0;border-top:1px solid var(--border-light);display:flex;flex-direction:column;">
                    <div style="padding:6px 12px;display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border-light);">
                        <button class="btn btn-secondary btn-sm" onclick="sendCommand('/optimize')" style="font-size:10px;padding:3px 8px;">✨ 优化</button>
                        <button class="btn btn-secondary btn-sm" onclick="sendCommand('/shorten')" style="font-size:10px;padding:3px 8px;">📝 缩写</button>
                        <button class="btn btn-secondary btn-sm" onclick="sendCommand('/expand')" style="font-size:10px;padding:3px 8px;">📖 扩写</button>
                        <button class="btn btn-secondary btn-sm" onclick="sendCommand('/translate')" style="font-size:10px;padding:3px 8px;">🌐 翻译</button>
                        <button class="btn btn-secondary btn-sm" onclick="sendCommand('/hashtags')" style="font-size:10px;padding:3px 8px;"># 标签</button>
                    </div>
                    <div id="chatMessages" style="flex:1;overflow-y:auto;padding:8px;min-height:80px;max-height:200px;">
                        <div style="font-size:12px;color:var(--text-muted);padding:8px;text-align:center;">试试输入需求，或点击上方快捷指令</div>
                    </div>
                    <div style="padding:8px;border-top:1px solid var(--border-light);display:flex;gap:6px;">
                        <textarea id="aiChatInput" placeholder="输入需求或指令..." rows="1" style="flex:1;font-size:12px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-md);resize:none;outline:none;font-family:inherit;" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMessage();}"></textarea>
                        <button class="btn btn-primary btn-sm" onclick="sendChatMessage()" style="padding:6px 10px;"><iconify-icon icon="mdi:send" width="14"></iconify-icon></button>
                    </div>
                </div>
            </div>
            <!-- 中栏：编辑器 -->
            <div class="col-editor">
                <div style="display:none;" aria-hidden="true">
                    <select id="tplSelect" class="select" style="font-size:12px;min-width:120px;" onchange="applyTemplate(this.value)" title="套用 Prompt 模板">
                        <option value="">Prompt 模板…</option>
                    </select>
                    <select id="toneSelect" class="select" style="font-size:12px;min-width:100px;"><option value="professional">专业严谨</option><option value="friendly">亲切友好</option><option value="urgent">紧急通知</option></select>
                    <select id="lengthSelect" class="select" style="font-size:12px;min-width:80px;"><option value="short">短文案</option><option value="medium" selected>中文案</option><option value="long">长文案</option></select>
                    <button class="btn btn-primary btn-sm" onclick="generateContent()" id="genBtnMain"><iconify-icon icon="mdi:sparkles" width="14"></iconify-icon> AI 生成</button>
                </div>
                <div class="toolbar">
                    <div style="flex:1;"></div>
                    <span id="charCount" style="font-size:11px;color:var(--text-muted);padding:6px 0;">0 字</span>
                </div>
                <div style="flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;">
                    <input id="editorTitle" class="input" placeholder="标题" style="font-size:18px;font-weight:700;border:none;padding:0;margin-bottom:12px;"/>
                    <textarea id="editorContent" style="flex:1;width:100%;border:none;outline:none;resize:none;font-size:14px;line-height:1.8;color:var(--text-primary);" placeholder="从 AI 对话导入内容，或直接输入文案..."></textarea>
                </div>
                <div style="padding:8px 16px;border-top:1px solid var(--border-light);">
                    <input id="editorHashtags" class="input" placeholder="标签（逗号分隔）" style="font-size:12px;padding:6px 10px;"/>
                </div>
                <details style="padding:10px 16px;border-top:1px solid var(--border-light);background:#FFFBEB;">
                    <summary style="font-size:12px;font-weight:700;color:#92400E;cursor:pointer;">事实来源证据（热点、数字和事件必填）</summary>
                    <p style="font-size:10px;color:#92400E;margin:7px 0;">每行：文案中的事实句 | 来源网址 | 来源标题 | 发布机构 | 支撑原文摘录</p>
                    <textarea id="sourceEvidence" class="input" rows="3" placeholder="德班港今日出现延误 | https://... | Port update | Transnet | 原文摘录" style="font-size:11px;resize:vertical;"></textarea>
                </details>
                <div style="padding:12px 16px;border-top:1px solid var(--border-light);">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                        <span style="font-size:12px;font-weight:600;color:var(--text-secondary);display:flex;align-items:center;gap:4px;"><iconify-icon icon="mdi:paperclip" width="14"></iconify-icon> 附件</span>
                        <label class="btn btn-secondary btn-sm" style="font-size:11px;cursor:pointer;margin:0;">
                            <iconify-icon icon="mdi:plus" width="14"></iconify-icon> 添加文件
                            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/quicktime,video/webm" multiple style="display:none;" onchange="handleFileUpload(this.files)"/>
                        </label>
                    </div>
                    <div id="attachmentList" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
                    <div id="uploadZone" style="border:2px dashed var(--border);border-radius:8px;padding:16px;text-align:center;color:var(--text-muted);font-size:12px;cursor:pointer;margin-top:8px;"
                        ondragover="event.preventDefault();this.style.borderColor='var(--primary)';"
                        ondragleave="this.style.borderColor='var(--border)';"
                        ondrop="event.preventDefault();this.style.borderColor='var(--border)';if(event.dataTransfer.files.length)handleFileUpload(event.dataTransfer.files);">
                        拖拽图片/视频到此处上传（图片≤10MB，视频≤50MB）
                    </div>
                </div>
            </div>
            <!-- 右栏：预览 -->
            <div class="col-preview">
                <div style="padding:0 12px;border-bottom:1px solid var(--border-light);display:flex;">
                    ${Object.entries(platformInfo).map(([k,v])=>`<button class="preview-tab" data-platform="${k}" onclick="switchPreview('${k}')" style="padding:10px 12px;font-size:11px;font-weight:600;border:none;background:none;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;">${v.name}</button>`).join('')}
                </div>
                <div id="previewArea" style="flex:1;overflow-y:auto;padding:20px;">
                    <div class="empty-state" style="padding-top:80px;"><iconify-icon icon="mdi:file-eye-outline" width="48"></iconify-icon><p style="margin-top:8px;">输入或导入内容后即可预览</p></div>
                </div>
            </div>
        </div>
    </div>`;

    const firstTab = document.querySelector('.preview-tab');
    if (firstTab) { firstTab.style.color='var(--primary)'; firstTab.style.borderBottomColor='var(--primary)'; }

    // 编辑器任意字段变化 → 同步写回当前平台内容 + 刷新预览
    ['editorTitle','editorContent','editorHashtags'].forEach(id => {
        document.getElementById(id).addEventListener('input', syncEditorToContent);
    });

    // 知识库搜索框 → 过滤分类/主题
    document.getElementById('kbSearch').addEventListener('input', e => filterKnowledgeBase(e.target.value));

    // 渲染知识库（DOM 操作，避免模板拼接问题）
    renderKnowledgeBase();

    // 渲染企业知识库引用 chips + Prompt 模板下拉
    renderKbRefs();
    renderTemplateOptions();

    // 加载本地草稿
    const selectedAssets = JSON.parse(localStorage.getItem('selectedMediaAssets') || '[]');
    const linkedProjectId = new URLSearchParams(location.search).get('project_id');
    if (linkedProjectId) {
        location.replace(`/video-project.html?id=${encodeURIComponent(linkedProjectId)}&stage=brief`);
        return;
    }
    loadDraft();
    try {
        const hotspotEvidence = JSON.parse(localStorage.getItem('hotspotSourceEvidence') || '[]');
        if (Array.isArray(hotspotEvidence) && hotspotEvidence.length) {
            document.getElementById('sourceEvidence').value = hotspotEvidence.map(item => [item.claim,item.url,item.source_title,item.publisher,item.excerpt].join(' | ')).join('\n');
            localStorage.removeItem('hotspotSourceEvidence');
        }
    } catch (e) { localStorage.removeItem('hotspotSourceEvidence'); }
    // 没有从 AI 对话导入内容时，尝试恢复上次编辑的自动保存草稿
    if (!Object.keys(generatedContents).length) {
        try {
            const autoSaved = JSON.parse(localStorage.getItem('editorAutoSave') || 'null');
            if (autoSaved && Array.isArray(autoSaved.contents) && autoSaved.contents.length) {
                const normalized = EditorTransfer.normalizeDraft(autoSaved, Object.keys(platformInfo), currentPreview);
                if (normalized.valid) {
                    normalized.contents.forEach(item => { generatedContents[item.platform] = item; });
                    currentPreview = normalized.activePlatform;
                    refreshPreviewTabs();
                    loadPlatformToEditor(currentPreview);
                    renderPreview(currentPreview);
                    showToast('已恢复上次编辑内容', 'info');
                }
            }
        } catch (e) { /* 忽略解析错误 */ }
    }
    if (selectedAssets.length) {
        const d = generatedContents.douyin || {platform:'douyin',title:'抖音视频',body:'请编辑抖音脚本',hashtags:[],scenes:[]};
        d.selected_asset_ids = Array.from(new Set([...(d.selected_asset_ids||[]), ...selectedAssets])); generatedContents.douyin=d;
        localStorage.removeItem('selectedMediaAssets');
    }
}

// ==================== 历史记录功能 ====================

const HISTORY_STORAGE_KEY = 'editorHistory';
const HISTORY_MAX_COUNT = 20;

// 获取历史记录列表
function getHistoryList() {
    try {
        const list = JSON.parse(localStorage.getItem(HISTORY_STORAGE_KEY) || '[]');
        return Array.isArray(list) ? list : [];
    } catch (e) {
        return [];
    }
}

// 保存历史记录
function saveToHistory(source = 'manual') {
    const contents = Object.values(generatedContents).filter(c => c && (c.title || c.body));
    if (!contents.length) return;

    const historyItem = {
        id: Date.now().toString(),
        timestamp: Date.now(),
        source: source, // 'ai_generate' | 'manual_save' | 'import'
        activePlatform: currentPreview,
        importedFromChat,
        video_workflow: draftVideoWorkflow,
        contents: contents.map(c => ({
            platform: c.platform,
            title: c.title || '',
            body: c.body || '',
            hashtags: Array.isArray(c.hashtags) ? c.hashtags : [],
            image_pages: Array.isArray(c.image_pages) ? c.image_pages : [],
            attachments: Array.isArray(c.attachments) ? c.attachments : [],
            scenes: Array.isArray(c.scenes) ? c.scenes : [],
            voice: c.voice || null,
            rendered_video: c.rendered_video || null,
            source: c.source || null,
            duration_target: c.duration_target || null,
            video_project_id: c.video_project_id || null,
            video_generation_job_id: c.video_generation_job_id || null,
        }))
    };

    let history = getHistoryList();
    // 避免连续重复保存相同内容（5秒内）
    if (history.length > 0) {
        const last = history[0];
        if (last.timestamp > Date.now() - 5000 && JSON.stringify(last.contents) === JSON.stringify(historyItem.contents)) {
            return;
        }
    }

    history.unshift(historyItem);

    // 限制最大数量
    if (history.length > HISTORY_MAX_COUNT) {
        history = history.slice(0, HISTORY_MAX_COUNT);
    }

    localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history));
}

// 渲染历史记录列表
function renderHistoryList() {
    const container = document.getElementById('historyList');
    if (!container) return;

    const history = getHistoryList();

    if (!history.length) {
        container.innerHTML = `
            <div class="history-empty">
                <iconify-icon icon="mdi:history" style="color:var(--text-muted);"></iconify-icon>
                <p>暂无历史记录</p>
                <p style="font-size:11px;margin-top:4px;">AI 生成或手动保存时会自动记录</p>
            </div>`;
        return;
    }

    const sourceLabels = {
        ai_generate: { text: 'AI 生成', class: 'ai' },
        manual_save: { text: '手动保存', class: 'manual' },
        import: { text: 'AI 对话导入', class: 'import' }
    };

    container.innerHTML = history.map(item => {
        const date = new Date(item.timestamp);
        const timeStr = `${date.getMonth()+1}/${date.getDate()} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
        const sourceInfo = sourceLabels[item.source] || { text: '保存', class: 'manual' };
        const firstContent = item.contents[0] || {};
        const previewText = firstContent.body || firstContent.title || '无内容';
        const platforms = item.contents.map(c => platformInfo[c.platform]?.name || c.platform);

        return `
        <div class="history-item" onclick="restoreFromHistory('${item.id}')">
            <div class="history-time">
                <iconify-icon icon="mdi:clock-outline" width="12"></iconify-icon> ${timeStr}
            </div>
            <span class="history-source ${sourceInfo.class}">${sourceInfo.text}</span>
            <div class="history-preview">${escapeHtml(previewText)}</div>
            <div class="history-platforms">
                ${platforms.map(p => `<span class="history-platform-tag">${p}</span>`).join('')}
            </div>
        </div>`;
    }).join('');
}

// 打开历史记录弹窗
function openHistoryModal() {
    renderHistoryList();
    document.getElementById('historyModal').hidden = false;
}

// 关闭历史记录弹窗
function closeHistoryModal() {
    document.getElementById('historyModal').hidden = true;
}

// 从历史记录恢复
function restoreFromHistory(historyId) {
    const history = getHistoryList();
    const item = history.find(h => h.id === historyId);
    if (!item) {
        showToast('历史记录不存在', 'error');
        return;
    }

    // 确认恢复
    if (!confirm('恢复此历史记录将覆盖当前内容，确定继续？')) {
        return;
    }

    // 恢复内容
    generatedContents = {};
    item.contents.forEach(c => {
        generatedContents[c.platform] = c;
    });
    importedFromChat = Boolean(item.importedFromChat);
    draftVideoWorkflow = item.video_workflow || null;
    currentPreview = item.activePlatform || 'xiaohongshu';

    // 更新 UI
    loadPlatformToEditor(currentPreview);
    renderPreview(currentPreview);
    refreshPreviewTabs();
    autoSaveDraft();

    closeHistoryModal();
    showToast('已恢复历史记录', 'success');
}

// 清空所有历史记录
function clearAllHistory() {
    if (!confirm('确定清空所有历史记录？此操作不可撤销。')) {
        return;
    }
    localStorage.removeItem(HISTORY_STORAGE_KEY);
    renderHistoryList();
    showToast('历史记录已清空', 'info');
}

// 自动保存草稿（防抖 500ms，避免频繁写入）
let _autoSaveTimer = null;
function autoSaveDraft() {
    clearTimeout(_autoSaveTimer);
    const status = document.getElementById('saveStatus');
    if (status) status.innerHTML = '<iconify-icon icon="mdi:loading" class="spin" width="12"></iconify-icon> 保存中…';
    _autoSaveTimer = setTimeout(() => {

        if (contents.length) {
            localStorage.setItem('editorAutoSave', JSON.stringify({
                version: 3, source: importedFromChat ? 'chat' : 'editor', activePlatform: currentPreview, contents,
                video_workflow: draftVideoWorkflow,
            }));
        }
        if (status) status.innerHTML = '<iconify-icon icon="mdi:check-circle" width="12" style="color:#22c55e;"></iconify-icon> 已自动保存';
    }, 500);
}

// 知识库过滤：按关键词显示/隐藏分类与主题
function filterKnowledgeBase(keyword) {
    const kw = (keyword || '').trim().toLowerCase();
    const container = document.getElementById('kbList');
    if (!container) return;
    // kbList 子节点是 [分类行, 主题容器] 交替排列
    const children = Array.from(container.children);
    for (let i = 0; i < children.length; i += 2) {
        const catDiv = children[i];
        const topicsDiv = children[i + 1];
        if (!topicsDiv) continue;
        const catName = (catDiv.textContent || '').toLowerCase();
        let anyTopicMatch = false;
        topicsDiv.querySelectorAll('.kb-topic-item').forEach(item => {
            const match = !kw || item.textContent.toLowerCase().includes(kw);
            item.style.display = match ? '' : 'none';
            if (match) anyTopicMatch = true;
        });
        const catMatch = !kw || catName.includes(kw) || anyTopicMatch;
        catDiv.style.display = catMatch ? '' : 'none';
        // 有关键词且命中主题时自动展开
        if (kw && anyTopicMatch) {
            topicsDiv.style.display = 'block';
        } else if (!kw) {
            topicsDiv.style.display = 'none';
        }
    }
}

// 加载本地草稿到编辑器
let draftEvidenceInsufficient = false;
function loadDraft() {
    let draft;
    try { draft = JSON.parse(localStorage.getItem('draft')); } catch(e) { draft = null; }
    if (!draft) return;
    const normalized = EditorTransfer.normalizeDraft(draft,Object.keys(platformInfo),currentPreview);
    importedFromChat = normalized.importedFromChat && normalized.valid;
    draftVideoWorkflow = normalized.video_workflow;
    draftEvidenceInsufficient = normalized.evidence_status === 'insufficient';
    normalized.contents.forEach(item => { generatedContents[item.platform] = item; });
    currentPreview = normalized.activePlatform;
    refreshPreviewTabs();
    if (normalized.valid) {
        loadPlatformToEditor(currentPreview); renderPreview(currentPreview);
        if (generatedContents.xiaohongshu) ensureXhsAssets('xiaohongshu');
    }
    if (draft.source === 'chat' && normalized.valid) {
        localStorage.removeItem('draft');
        autoSaveDraft();   // 导入内容同步进自动保存，防再次跳转丢失
        // 保存到历史记录
        saveToHistory('import');
        if (draftEvidenceInsufficient) {
            showToast('已导入对比框架：证据不足，确认资料前不可发布', 'info');
            const banner = document.getElementById('evidenceGateBanner');
            if (banner) banner.hidden = false;
        } else {
            showToast('已从 AI 对话导入内容', 'info');
        }
    } else if (draft.source === 'chat') {
        showToast('AI 内容导入失败，草稿已保留，可刷新后重试', 'error');
    }
}

async function loadVideoProjectDraft(projectId) {
    try {
        const response = await apiFetch(`/api/video-projects/${projectId}`);
        activeVideoProject = await response.json();
        const payload = activeVideoProject.current_revision?.payload || {};
        generatedContents.douyin = {platform:'douyin', hashtags:[], scenes:[], ...payload};
        const linkedJob = activeVideoProject.active_job;
        const previewUrl = linkedJob?.preview_url || linkedJob?.output_url;
        if (previewUrl) {
            const previewVideo = {
                type:'video', url:previewUrl,
                path:linkedJob.preview_path || linkedJob.output_path || previewUrl,
                filename:(activeVideoProject.title || 'douyin') + '-preview.mp4',
                preview_only: linkedJob.status !== 'succeeded' || linkedJob.quality_report?.publication?.publish_allowed === false,
                quality_status: linkedJob.status === 'succeeded' ? (linkedJob.quality_report?.final_quality?.status || 'passed') : 'preview',
                quality_report: linkedJob.quality_report?.preview_quality || linkedJob.quality_report?.final_quality || {},
            };
            generatedContents.douyin.rendered_video = previewVideo;
            generatedContents.douyin.attachments = [...(generatedContents.douyin.attachments || []).filter(item => item.type !== 'video'), previewVideo];
        }
        importedFromChat = true;
        currentPreview = 'douyin';
        refreshPreviewTabs();
        loadPlatformToEditor('douyin');
        renderPreview('douyin');
        showToast(previewUrl ? '已载入视频项目与预览' : '已载入视频项目内容', 'info');
    } catch (error) {
        showToast(error.message, 'error');
    }
}

function switchPreview(platform) {
    if (importedFromChat && !generatedContents[platform]) {
        showToast('该平台未从 AI 对话导入，当前内容已保留', 'info');
        return;
    }
    if (!platform || platform === currentPreview) {
        // 即便同平台也要确保预览最新
        if (platform) renderPreview(platform);
        return;
    }
    // 先把编辑器当前内容写回旧平台，避免切换丢失
    syncEditorToContent();
    currentPreview = platform;
    document.querySelectorAll('.preview-tab').forEach(b => {
        const active = b.dataset.platform === platform;
        b.style.color = active ? 'var(--primary)' : 'var(--text-muted)';
        b.style.borderBottomColor = active ? 'var(--primary)' : 'transparent';
    });
    loadPlatformToEditor(platform);
    renderPreview(platform);
}

function refreshPreviewTabs() {
    document.querySelectorAll('.preview-tab').forEach(b => {
        const platform = b.dataset.platform;
        const available = !!generatedContents[platform];
        b.style.display = importedFromChat && !available ? 'none' : '';
        const active = platform === currentPreview;
        b.style.color = active ? 'var(--primary)' : 'var(--text-muted)';
        b.style.borderBottomColor = active ? 'var(--primary)' : 'transparent';
    });
}

// 把指定平台内容装载进编辑器（程序赋值不触发 input，不会污染数据）
function loadPlatformToEditor(platform) {
    const c = generatedContents[platform] || { title:'', body:'', hashtags:[] };
    document.getElementById('editorTitle').value = c.title || '';
    document.getElementById('editorContent').value = c.body || '';
    document.getElementById('editorHashtags').value = (c.hashtags || []).join(', ');
    document.getElementById('charCount').textContent = (c.body || '').length + ' 字';
}

const XHS_TEMPLATE_VERSION = 'buffalo-reference-v3';
async function ensureXhsAssets(platform='xiaohongshu') {
    const content = generatedContents[platform];
    if (content?.title === '生成失败') return content;
    if (!content) return content;
    const imageAssets = Array.isArray(content.attachments) ? content.attachments.filter(a=>a.type==='image') : [];
    const hasCurrentTemplate = imageAssets.length && imageAssets.every(a=>a.template_version===XHS_TEMPLATE_VERSION);
    if (hasCurrentTemplate) return content;
    try {
        const response = await apiFetch('/api/xhs/render', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({title:content.title, body:content.body, image_pages:content.image_pages||[]})
        });
        const data = await response.json();
        content.image_pages = Array.isArray(data.image_pages) ? data.image_pages : [];
        content.attachments = Array.isArray(data.attachments) ? data.attachments : [];
        generatedContents[platform] = content;
        if (currentPreview === platform) renderPreview(platform);
        if (content.attachments.length) showToast(imageAssets.length
            ? `旧版轮播图已升级为 BUFFALO 品牌版（${content.attachments.length} 张）`
            : `已自动生成 ${content.attachments.length} 张 BUFFALO 品牌轮播图`, 'info');
        return content;
    } catch (error) {
        showToast(`小红书图片生成失败：${error.message}`, 'error');
        return content;
    }
}

function renderPreview(platform) {
    const c = generatedContents[platform];
    const area = document.getElementById('previewArea');
    const p = platformInfo[platform];
    if (!c) { area.innerHTML='<div class="empty-state" style="padding-top:60px;"><iconify-icon icon="mdi:file-outline" width="40"></iconify-icon><p style="margin-top:8px;">该平台暂无内容</p></div>'; return; }
    const isDark = platform==='douyin';
    const carousel = platform === 'xiaohongshu' && Array.isArray(c.attachments) && c.attachments.length
        ? `<div style="margin-bottom:16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                <span style="font-size:12px;font-weight:700;color:var(--text-primary);">可发布轮播图</span>
                <span style="font-size:11px;color:var(--text-muted);">已自动生成 ${c.attachments.length} 张</span>
            </div>
            <div class="xhs-carousel">
                ${c.attachments.map((asset,index)=>`<div>
                    <img class="xhs-image" src="${escapeHtml(asset.url)}" data-xhs-index="${index}" alt="小红书轮播图第 ${index+1} 页"/>
                    <div style="font-size:10px;color:var(--text-muted);text-align:center;margin-top:4px;">第 ${index+1} 页</div>
                </div>`).join('')}
            </div>
            <div style="font-size:11px;line-height:1.5;color:var(--text-muted);background:var(--bg-secondary);border-radius:8px;padding:8px 10px;">这些图片会自动随小红书内容进入审核队列，无需再次上传。</div>

    panel.style.display = isOpen ? 'none' : 'flex';

function appendChatMessage(role, text) {
    const container = document.getElementById('chatMessages');
    if (!container) return;
    // 清除 "试试输入" 提示
    if (container.querySelector('[style*="text-align:center"]')) container.innerHTML = '';
    const isUser = role === 'user';
    const div = document.createElement('div');
    div.style.cssText = `margin-bottom:8px;display:flex;gap:6px;justify-content:${isUser ? 'flex-end' : 'flex-start'};`;
    div.innerHTML = isUser
        ? `<div style="background:var(--primary);color:white;padding:6px 10px;border-radius:12px 12px 4px 12px;font-size:12px;max-width:85%;white-space:pre-wrap;">${escapeHtml(text)}</div>`
        : `<div style="background:var(--bg-secondary);padding:6px 10px;border-radius:12px 12px 12px 4px;font-size:12px;max-width:85%;white-space:pre-wrap;">${escapeHtml(text)}</div>`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

let chatHistory = [];

async function sendChatMessage() {
    const input = document.getElementById('aiChatInput');
    if (!input) return;
    const msg = input.value.trim();
    if (!msg) return;
    input.value = '';
    appendChatMessage('user', msg);
    chatHistory.push({role: 'user', content: msg});
    const context = (document.getElementById('editorContent') || {}).value || '';
    try {
        const resp = await apiFetch('/api/ai/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({messages: chatHistory, context: context, command: null})
        });
        const data = await resp.json();
        appendChatMessage('assistant', data.content);
        chatHistory.push({role: 'assistant', content: data.content});
    } catch (e) {
        appendChatMessage('assistant', '请求失败：' + e.message);
    }
}

async function sendCommand(command) {
    // 展开聊天面板
    const panel = document.getElementById('chatPanel');
    if (panel && panel.style.display === 'none') toggleChat();
    const context = (document.getElementById('editorContent') || {}).value || '';
    if (!context && ['/optimize', '/shorten', '/expand', '/translate'].includes(command)) {
        showToast('请先在编辑器输入内容', 'error');
        return;
    }
    appendChatMessage('user', command);
    try {
        const resp = await apiFetch('/api/ai/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({messages: [], context: context, command: command})
        });
        const data = await resp.json();
        appendChatMessage('assistant', data.content);
        // 快捷指令结果自动更新编辑器
        if (document.getElementById('editorContent')) {
            document.getElementById('editorContent').value = data.content;
            syncEditorToContent();
            if (document.getElementById('charCount')) document.getElementById('charCount').textContent = data.content.length + ' 字';
        }
    } catch (e) {
        appendChatMessage('assistant', '请求失败：' + e.message);
    }
}

async function generateContent() {
    const aiReq = document.getElementById('aiInput').value.trim();
    // 主题 = 已选知识库主题 或 AI 对话框输入
    const topic = selectedTopic || aiReq;
    if (!topic) { showToast('请先在左侧选择主题，或在 AI 对话框输入需求','error'); return; }

    const platforms = ['xiaohongshu','douyin','facebook','twitter','reddit'];
    const btns = [document.getElementById('genBtn'), document.getElementById('genBtnMain')];
    btns.forEach(b => { if(b) b.disabled = true; });
    const mainBtn = document.getElementById('genBtnMain');
    if (mainBtn) mainBtn.innerHTML = '<iconify-icon icon="mdi:loading" class="spin" width="14"></iconify-icon> 生成中...';

    try {
        const resp = await apiFetch('/api/generate', { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
                topic,
                instruction: aiReq,                      // 额外的 AI 指令
                category: selectedCategory || 'custom',
                platforms,
                tone: document.getElementById('toneSelect').value,
                length: document.getElementById('lengthSelect').value,
                kb_category_ids: Array.from(selectedKbCats)   // 引用的企业知识库分类
            }) });
        const data = await resp.json();
        // P0-3: 防御后端异常响应
        if (!data || !Array.isArray(data.contents) || data.contents.length === 0) {
            showToast('生成失败：服务未返回有效内容', 'error');
            return;
        }
        importedFromChat = false;
        generatedContents = {}; data.contents.forEach(c=>generatedContents[c.platform]=c);
        // 装载当前预览平台到编辑器（保持编辑器/Tab/预览三者一致）
        if (!generatedContents[currentPreview]) currentPreview = data.contents[0].platform;
        loadPlatformToEditor(currentPreview);
        renderPreview(currentPreview);
        // 同步 Tab 高亮到 currentPreview
        refreshPreviewTabs();
        // 区分 AI / 模板模式
        autoSaveDraft();   // 生成成功立即自动保存
        // 保存到历史记录
        saveToHistory('ai_generate');
        if (data.source === 'fallback') {
            showToast('⚠️ 未配置 AI，使用模板生成。请在「设置」配置百炼 API Key', 'info');
        } else {
            showToast('AI 内容生成成功');
        }
    } catch(e) { showToast('生成失败: ' + e.message,'error'); }
    finally {
        btns.forEach(b => { if(b) b.disabled = false; });
        if (mainBtn) mainBtn.innerHTML = '<iconify-icon icon="mdi:sparkles" width="14"></iconify-icon> AI 生成';
    }
}

async function handleFileUpload(files) {
    for (const file of files) {
        if (attachments.length >= 9) { showToast('最多上传 9 个附件', 'error'); break; }
        const formData = new FormData();
        formData.append('file', file);
        try {
            const resp = await apiFetch('/api/upload', { method: 'POST', body: formData });
            const data = await resp.json();
            attachments.push(data);
            renderAttachments();
            showToast(`已上传：${file.name}`);
        } catch (e) { showToast(`上传失败：${e.message}`, 'error'); }
    }
    // 清空 file input 以便重复上传同名文件
    document.getElementById('fileInput').value = '';
}

async function submitToQueue() {
    // 提交前先把编辑器最新内容写回当前平台
    syncEditorToContent();
    if (draftEvidenceInsufficient || localStorage.getItem('evidence_status') === 'insufficient') {
        showToast('证据不足的对比框架不可发布，请先补充带来源的评测资料', 'error');
        return;
    }
    const entries = Object.entries(generatedContents).filter(([, c]) => c && c.title && c.body);
    if (!entries.length) { showToast('请先生成或输入内容', 'error'); return; }

    if (generatedContents.xiaohongshu) await ensureXhsAssets('xiaohongshu');

    let added = 0;
    const failed = [];
    for (const [platform, c] of entries) {
        try {
            const platformAttachments = platform === 'xiaohongshu'
                ? [...(Array.isArray(c.attachments) ? c.attachments : []), ...attachments]
                : platform === 'douyin'
                    ? [...(Array.isArray(c.attachments) ? c.attachments : []), ...attachments]
                    : attachments;
            const targets=Array.isArray(c.account_target_ids)?c.account_target_ids:[];
            await apiFetch('/api/queue', { method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ title:c.title, body:c.body, platforms:[platform], hashtags:c.hashtags||[], status:'pending_review', attachments: platformAttachments, source_refs:parseSourceEvidence(), account_targets:targets.length?{[platform]:targets}:{} }) });
            added+=Math.max(1,targets.length);
        } catch(e) {
            failed.push(platformInfo[platform]?.name || platform);
        }
    }

    // P0-2: 显示真实提交结果
    if (failed.length === 0) {
        showToast(`已提交 ${added} 个平台到审核队列`);
        attachments = []; renderAttachments();
    } else if (added === 0) {
        showToast(`提交失败：${failed.join('、')}`, 'error');
    } else {
        showToast(`已提交 ${added} 个，失败 ${failed.length} 个（${failed.join('、')}）`, 'error');
    }
}

// 抖音一键发布：视频 + 文案一起进审核队列
async function publishDouyinVideo() {

            body: JSON.stringify({
                title: c.title, body: c.body, platforms: ['douyin'],
                hashtags: c.hashtags || [], status: 'pending_review',
                attachments: [c.rendered_video, ...(c.attachments || []).filter(a => a.type !== 'video')],
                source_refs: parseSourceEvidence(),
            }) });

async function saveDraft() {
    syncEditorToContent();
    localStorage.setItem('draft',JSON.stringify({version:3,source:importedFromChat?'chat':'editor',activePlatform:currentPreview,contents:Object.values(generatedContents),video_workflow:draftVideoWorkflow,title:document.getElementById('editorTitle').value,body:document.getElementById('editorContent').value,hashtags:document.getElementById('editorHashtags').value}));
    if (activeVideoProject) {
        const payload = generatedContents.douyin || {};
        try {
            const response = await apiFetch(`/api/video-projects/${activeVideoProject.id}/revision`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({payload})});
            activeVideoProject.current_revision = await response.json();
        } catch (error) {
            showToast('视频项目保存失败：' + error.message, 'error');
            return;
        }
    }
    // 同时保存到历史记录
    saveToHistory('manual_save');
    showToast('草稿已保存'); 
}

document.getElementById('xhsLightbox').addEventListener('click',e=>{if(e.target.id==='xhsLightbox')closeXhsLightbox();});
document.querySelector('.lightbox-close').addEventListener('click',closeXhsLightbox);
document.querySelector('.lightbox-prev').addEventListener('click',()=>{lightboxIndex=(lightboxIndex-1+lightboxImages.length)%lightboxImages.length;updateLightbox();});
document.querySelector('.lightbox-next').addEventListener('click',()=>{lightboxIndex=(lightboxIndex+1)%lightboxImages.length;updateLightbox();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeXhsLightbox();});

// 关闭历史记录弹窗（点击背景）
document.getElementById('historyModal').addEventListener('click', e => {
    if (e.target.id === 'historyModal') closeHistoryModal();
});

init();
</script>

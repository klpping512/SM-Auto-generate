<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI 工作区 - SA-LogiFlow</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="/static/design-system.css"/>
<style>
.workspace-grid { flex: 1; display: grid; grid-template-columns: 280px minmax(0, 1fr) 360px; gap: 16px; overflow: hidden; }
.col-knowledge,
.col-editor,
.col-preview {
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: rgba(255,255,255,0.92);
    border: 1px solid rgba(229,230,235,0.86);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    overflow: hidden;
}
.toolbar { padding: 8px 12px; border-bottom: 1px solid var(--border-light); display: flex; gap: 4px; background:var(--bg-subcard); }
.toolbar button { padding: 6px 8px; border-radius: var(--radius-sm); border: none; background: none; color: var(--text-secondary); cursor: pointer; font-size: 16px; }
.toolbar button:hover { background: var(--bg-secondary); color: var(--text-primary); }
.preview-card { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: white; box-shadow:var(--shadow-sm); }
.preview-card.dark { background: #1a1a1a; border-color: #333; }
.kb-category {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    user-select: none;
}
.kb-category:hover { background: var(--bg-secondary); }
.kb-topic {
    padding: 5px 8px;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: var(--radius-sm);
}
.kb-topic:hover { background: var(--bg-secondary); color: var(--text-primary); }
.spin { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 1180px) {
    .workspace-grid { grid-template-columns: 1fr; overflow: visible; }
    .col-knowledge, .col-editor, .col-preview { min-height: 360px; }
}
</style>
</head>
<body>
<div class="app-layout" id="app"></div>
<div id="toastContainer" class="toast-container"></div>
<script src="/static/common.js"></script>
<script>
const PAGE_ID = 'editor';
const platformInfo = {
    xiaohongshu: { icon: 'ri:xiaohongshu-fill', color: '#FF2442', name: '小红书' },
    douyin: { icon: 'ri:tiktok-fill', color: '#000', name: '抖音' },
    facebook: { icon: 'ri:facebook-box-fill', color: '#1877F2', name: 'Facebook' },
    twitter: { icon: 'ri:twitter-x-fill', color: '#1DA1F2', name: 'Twitter' },
    reddit: { icon: 'ri:reddit-fill', color: '#FF4500', name: 'Reddit' },
};

let generatedContents = {};
let currentPreview = 'xiaohongshu';
let categories = [];
let selectedTopic = '';
let selectedCategory = 'custom';

async function init() {
    try { const r = await apiFetch('/api/topics'); categories = await r.json(); } catch(e) { categories = []; }

    document.getElementById('app').innerHTML = `
    ${renderSidebar(PAGE_ID)}
    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title">AI 工作区</h1>
            <div style="display:flex;gap:8px;">
                <button class="btn btn-secondary btn-sm" onclick="saveDraft()"><iconify-icon icon="mdi:content-save" width="16"></iconify-icon> 保存草稿</button>
                <button class="btn btn-primary btn-sm" onclick="submitToQueue()"><iconify-icon icon="mdi:send" width="16"></iconify-icon> 提交发布</button>
            </div>
        </div>
        <div class="workspace-grid">
            <!-- 左栏：知识库 -->
            <div class="col-knowledge">
                <div style="padding:16px;border-bottom:1px solid var(--border-light);">
                    <div style="font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;">
                        <iconify-icon icon="mdi:book-open-outline" style="color:var(--primary);"></iconify-icon> 知识库
                    </div>
                    <input class="input" placeholder="搜索知识库..." style="font-size:12px;padding:6px 10px;"/>
                </div>
                <div id="kbList" style="flex:1;overflow-y:auto;padding:8px;"></div>
                <div style="padding:12px;border-top:1px solid var(--border-light);">
                    <div style="font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:6px;">AI 对话</div>
                    <div style="display:flex;gap:6px;">
                        <input id="aiInput" class="input" placeholder="输入需求..." style="font-size:12px;padding:6px 10px;"/>
                        <button class="btn btn-primary btn-sm" onclick="generateContent()" id="genBtn"><iconify-icon icon="mdi:sparkles" width="14"></iconify-icon></button>
                    </div>
                </div>
            </div>
            <!-- 中栏：编辑器 -->
            <div class="col-editor">
                <div style="padding:12px 16px;border-bottom:1px solid var(--border-light);display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                    <div id="currentTopicTag" style="display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--primary-light);color:var(--primary);border-radius:var(--radius-full);font-size:12px;font-weight:600;">
                        <iconify-icon icon="mdi:tag-outline" width="14"></iconify-icon>
                        <span id="currentTopicText">未选择主题</span>
                    </div>
                    <div style="flex:1;"></div>
                    <select id="toneSelect" class="select" style="font-size:12px;min-width:100px;"><option value="professional">专业严谨</option><option value="friendly">亲切友好</option><option value="urgent">紧急通知</option></select>
                    <select id="lengthSelect" class="select" style="font-size:12px;min-width:80px;"><option value="short">短文案</option><option value="medium" selected>中文案</option><option value="long">长文案</option></select>
                    <button class="btn btn-primary btn-sm" onclick="generateContent()" id="genBtnMain"><iconify-icon icon="mdi:sparkles" width="14"></iconify-icon> AI 生成</button>
                </div>
                <div class="toolbar">
                    <button title="加粗"><iconify-icon icon="mdi:format-bold"></iconify-icon></button>
                    <button title="列表"><iconify-icon icon="mdi:format-list-bulleted"></iconify-icon></button>
                    <div style="flex:1;"></div>
                    <span id="charCount" style="font-size:11px;color:var(--text-muted);padding:6px 0;">0 字</span>
                </div>
                <div style="flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;">
                    <input id="editorTitle" class="input" placeholder="标题" style="font-size:18px;font-weight:700;border:none;padding:0;margin-bottom:12px;"/>
                    <textarea id="editorContent" style="flex:1;width:100%;border:none;outline:none;resize:none;font-size:14px;line-height:1.8;color:var(--text-primary);" placeholder="选择主题后点击生成，或直接输入文案..."></textarea>
                </div>
                <div style="padding:8px 16px;border-top:1px solid var(--border-light);">
                    <input id="editorHashtags" class="input" placeholder="标签（逗号分隔）" style="font-size:12px;padding:6px 10px;"/>
                </div>
            </div>
            <!-- 右栏：预览 -->
            <div class="col-preview">
                <div style="padding:0 12px;border-bottom:1px solid var(--border-light);display:flex;">
                    ${Object.entries(platformInfo).map(([k,v])=>`<button class="preview-tab" data-platform="${k}" onclick="switchPreview('${k}',this)" style="padding:10px 12px;font-size:11px;font-weight:600;border:none;background:none;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;">${v.name}</button>`).join('')}
                </div>
                <div id="previewArea" style="flex:1;overflow-y:auto;padding:20px;">
                    <div class="empty-state" style="padding-top:80px;"><iconify-icon icon="mdi:sparkles" width="48"></iconify-icon><p style="margin-top:8px;">点击生成按钮预览内容</p></div>
                </div>
            </div>
        </div>
    </div>`;

    const firstTab = document.querySelector('.preview-tab');
    if (firstTab) { firstTab.style.color='var(--primary)'; firstTab.style.borderBottomColor='var(--primary)'; }
    document.getElementById('editorContent').addEventListener('input', e => { document.getElementById('charCount').textContent = e.target.value.length + ' 字'; });

    // 渲染知识库（DOM 操作，避免模板拼接问题）
    renderKnowledgeBase();
}

function renderKnowledgeBase() {
    const container = document.getElementById('kbList');
    if (!container) return;
    container.innerHTML = '';
    categories.forEach(cat => {
        // 分类行
        const catDiv = document.createElement('div');
        catDiv.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12px;font-weight:600;cursor:pointer;border-radius:6px;margin-bottom:2px;';
        catDiv.innerHTML = `<iconify-icon icon="${cat.icon}" width="16" style="color:#3B82F6;"></iconify-icon><span style="flex:1;">${escapeHtml(cat.name_zh)}</span><span style="font-size:10px;color:#9CA3AF;">${cat.topics.length}</span><iconify-icon class="kb-arrow" icon="mdi:chevron-down" width="16" style="color:#9CA3AF;transition:transform 0.2s;"></iconify-icon>`;
        catDiv.onmouseover = function() { this.style.background = '#F3F4F6'; };
        catDiv.onmouseout = function() { this.style.background = ''; };

        // 主题容器
        const topicsDiv = document.createElement('div');
        topicsDiv.style.display = 'none';
        topicsDiv.style.paddingLeft = '26px';

        cat.topics.forEach(t => {
            const topicDiv = document.createElement('div');
            topicDiv.className = 'kb-topic-item';
            topicDiv.style.cssText = 'padding:6px 8px;font-size:12px;color:#6B7280;cursor:pointer;border-radius:6px;transition:all 0.15s;';
            topicDiv.textContent = t;
            topicDiv.onmouseover = function() { if (!this.dataset.selected) { this.style.background = '#F3F4F6'; this.style.color = '#1F2937'; } };
            topicDiv.onmouseout = function() { if (!this.dataset.selected) { this.style.background = ''; this.style.color = '#6B7280'; } };
            topicDiv.onclick = function() {
                // 清除其他选中态
                document.querySelectorAll('.kb-topic-item').forEach(el => {
                    el.dataset.selected = '';
                    el.style.background = '';
                    el.style.color = '#6B7280';
                    el.style.fontWeight = '400';
                });
                // 高亮当前
                this.dataset.selected = '1';
                this.style.background = 'var(--primary-light)';
                this.style.color = 'var(--primary)';
                this.style.fontWeight = '600';
                // 记录选中主题
                selectedTopic = t;
                selectedCategory = cat.id;
                document.getElementById('currentTopicText').textContent = t;
                document.getElementById('aiInput').value = '';
                document.getElementById('aiInput').placeholder = `已选「${t}」，可补充要求或直接点 AI 生成`;
                showToast(`已选择主题：${t}`, 'info');
            };
            topicsDiv.appendChild(topicDiv);
        });

        // 点击分类展开/收起
        catDiv.onclick = function() {
            const isOpen = topicsDiv.style.display === 'none';
            topicsDiv.style.display = isOpen ? 'block' : 'none';
            const arrow = this.querySelector('.kb-arrow');
            if (arrow) arrow.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
        };

        container.appendChild(catDiv);
        container.appendChild(topicsDiv);
    });
}

function toggleCategory(el) {
    const topics = el.nextElementSibling;
    topics.style.display = topics.style.display === 'none' ? 'block' : 'none';
}

function switchPreview(platform, btn) {
    currentPreview = platform;
    document.querySelectorAll('.preview-tab').forEach(b=>{b.style.color='var(--text-muted)';b.style.borderBottomColor='transparent';});
    btn.style.color='var(--primary)'; btn.style.borderBottomColor='var(--primary)';
    renderPreview(platform);
}

function renderPreview(platform) {
    const c = generatedContents[platform];
    const area = document.getElementById('previewArea');
    const p = platformInfo[platform];
    if (!c) { area.innerHTML='<div class="empty-state" style="padding-top:60px;"><iconify-icon icon="mdi:file-outline" width="40"></iconify-icon><p style="margin-top:8px;">该平台暂无内容</p></div>'; return; }
    const isDark = platform==='douyin';
    area.innerHTML=`<div class="fade-in">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:12px;"><iconify-icon icon="${p.icon}" style="color:${p.color};font-size:20px;"></iconify-icon><span style="font-size:13px;font-weight:700;">${p.name} 预览</span></div>
        <div class="preview-card ${isDark?'dark':''}" style="padding:20px;">
            <h3 style="font-size:15px;font-weight:700;margin-bottom:10px;color:${isDark?'white':'var(--text-primary)'};">${escapeHtml(c.title)}</h3>
            <p style="font-size:13px;line-height:1.8;white-space:pre-wrap;color:${isDark?'#ccc':'var(--text-secondary)'};">${escapeHtml(c.body)}</p>
            ${(c.hashtags||[]).length?`<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:4px;">${c.hashtags.map(h=>`<span style="font-size:11px;padding:2px 8px;border-radius:999px;background:${isDark?'#333':'#EFF6FF'};color:${isDark?'#60A5FA':'var(--primary)'};">#${escapeHtml(h)}</span>`).join('')}</div>`:''}
        </div>
        <div style="margin-top:12px;display:flex;gap:6px;justify-content:flex-end;">
            <button class="btn btn-secondary btn-sm" onclick="editPlatform('${platform}')">编辑</button>
            <button class="btn btn-secondary btn-sm" onclick="copyPlatform('${platform}')">复制</button>
        </div>
    </div>`;
}

function editPlatform(p) { const c=generatedContents[p]; if(c){document.getElementById('editorTitle').value=c.title;document.getElementById('editorContent').value=c.body;document.getElementById('editorHashtags').value=(c.hashtags||[]).join(', ');}}
async function copyPlatform(p) { const c=generatedContents[p]; if(!c)return; try{await navigator.clipboard.writeText(`${c.title}\n\n${c.body}\n\n${(c.hashtags||[]).map(h=>'#'+h).join(' ')}`);showToast('已复制');}catch(e){showToast('复制失败','error');}}

async function generateContent() {
    const aiReq = document.getElementById('aiInput').value.trim();
    // 主题 = 已选知识库主题 或 AI 对话框输入
    const topic = selectedTopic || aiReq;
    if (!topic) { showToast('请先在左侧选择主题，或在 AI 对话框输入需求','error'); return; }

    const platforms = ['xiaohongshu','facebook','twitter','reddit'];
    const btns = [document.getElementById('genBtn'), document.getElementById('genBtnMain')];
    btns.forEach(b => { if(b) b.disabled = true; });
    const mainBtn = document.getElementById('genBtnMain');
    if (mainBtn) mainBtn.innerHTML = '<iconify-icon icon="mdi:loading" class="spin" width="14"></iconify-icon> 生成中...';

    try {
        const resp = await apiFetch('/api/generate', { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
                topic,
                instruction: aiReq,                      // 额外的 AI 指令
                category: selectedCategory || 'custom',
                platforms,
                tone: document.getElementById('toneSelect').value,
                length: document.getElementById('lengthSelect').value
            }) });
        const data = await resp.json();
        generatedContents = {}; data.contents.forEach(c=>generatedContents[c.platform]=c);
        const first = data.contents[0];
        if (first) { document.getElementById('editorTitle').value=first.title; document.getElementById('editorContent').value=first.body; document.getElementById('editorHashtags').value=(first.hashtags||[]).join(', '); document.getElementById('charCount').textContent=first.body.length+' 字'; }
        renderPreview(currentPreview);
        // 区分 AI / 模板模式
        if (data.source === 'fallback') {
            showToast('⚠️ 未配置 AI，使用模板生成。请在「设置」配置 DeepSeek API Key', 'info');
        } else {
            showToast('AI 内容生成成功');
        }
    } catch(e) { showToast('生成失败: ' + e.message,'error'); }
    finally {
        btns.forEach(b => { if(b) b.disabled = false; });
        if (mainBtn) mainBtn.innerHTML = '<iconify-icon icon="mdi:sparkles" width="14"></iconify-icon> AI 生成';
    }
}

async function submitToQueue() {
    const title=document.getElementById('editorTitle').value, body=document.getElementById('editorContent').value;
    if (!title||!body) { showToast('请先生成或输入内容','error'); return; }
    const platforms=Object.keys(generatedContents);
    if (!platforms.length) { showToast('请先生成内容','error'); return; }
    let added=0;
    for (const [platform,c] of Object.entries(generatedContents)) {
        try { await apiFetch('/api/queue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:c.title,body:c.body,platforms:[platform],hashtags:c.hashtags||[],status:'pending_review'})}); added++; } catch(e){}
    }
    showToast(`已提交 ${added} 个平台到审核队列`);
}

function saveDraft() { localStorage.setItem('draft',JSON.stringify({title:document.getElementById('editorTitle').value,body:document.getElementById('editorContent').value,hashtags:document.getElementById('editorHashtags').value})); showToast('草稿已保存'); }

init();
</script>
</body>
</html>

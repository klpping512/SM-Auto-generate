<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>视频精确调整 - SA-LogiFlow</title>
<link rel="stylesheet" href="/static/design-system.css?v=6"/>
<style>
.workbench-page{height:100vh;overflow:hidden}.workbench-main{display:flex;flex-direction:column;height:100vh;min-width:0}.workbench-header{padding:18px 24px 14px;border-bottom:1px solid var(--border);background:white;display:flex;align-items:center;justify-content:space-between;gap:16px}.workbench-header h1{font-size:21px;margin:0}.workbench-header p{font-size:12px;color:var(--text-muted);margin:4px 0 0}.workbench-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(280px,.8fr) minmax(300px,1fr) minmax(340px,1.15fr);gap:12px;padding:12px;background:var(--bg-secondary)}.workbench-col{min-height:0;background:white;border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}.col-head{padding:14px 16px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center}.col-head h2{font-size:14px;margin:0}.col-head span{font-size:10px;color:var(--text-muted)}.col-body{padding:14px;overflow:auto;flex:1}.script-input{width:100%;min-height:260px;resize:vertical;line-height:1.75}.hint{font-size:11px;line-height:1.6;color:var(--text-muted);margin:10px 0}.atom-card{width:100%;text-align:left;border:1px solid var(--border);background:white;border-radius:11px;padding:12px;margin-bottom:9px;cursor:pointer}.atom-card.active{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 15%,transparent)}.atom-title{font-size:12px;font-weight:700}.atom-text{font-size:12px;color:var(--text-secondary);line-height:1.55;margin-top:5px}.atom-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:9px;background:var(--bg-secondary);color:var(--text-secondary);border-radius:99px;padding:3px 7px}.candidate{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px;background:white}.candidate.selected{border-color:#16a34a;box-shadow:0 0 0 2px #16a34a22}.candidate-media{height:150px;background:#111;display:flex;align-items:center;justify-content:center}.candidate-media img,.candidate-media video{width:100%;height:100%;object-fit:cover}.candidate-content{padding:12px}.candidate-row{display:flex;justify-content:space-between;gap:12px;align-items:start}.score{font-size:18px;font-weight:800;color:var(--primary)}.reason-list{padding-left:18px;margin:8px 0;color:var(--text-secondary);font-size:11px;line-height:1.6}.review{font-size:10px;color:#b45309;background:#fffbeb;padding:6px 8px;border-radius:7px;margin:7px 0}.candidate-actions{display:flex;gap:7px;align-items:center}.empty-note{padding:36px 18px;text-align:center;color:var(--text-muted);font-size:12px}.timeline{border-top:1px solid var(--border);padding:10px 16px;background:white;display:flex;gap:8px;overflow:auto}.timeline-item{min-width:150px;border-left:4px solid var(--border);padding:6px 9px;background:var(--bg-secondary);border-radius:6px;font-size:10px}.timeline-item.done{border-left-color:#16a34a}.timeline-item.review{border-left-color:#d97706;margin:0}.timeline-item strong{display:block;font-size:11px;margin-bottom:3px}@media(max-width:1100px){.workbench-page{height:auto;overflow:auto}.workbench-main{height:auto}.workbench-grid{grid-template-columns:1fr}.workbench-col{min-height:420px}.timeline{position:sticky;bottom:0}}
</style>
</head>
<body class="workbench-page">
<div class="app-layout">
  <div id="sidebar"></div>
  <main class="workbench-main">
    <header class="workbench-header">
      <div><h1>视频精确调整</h1><p>仅在自动编排需要人工细调时使用：口播拆解 → 语义原子 → 镜头 Top 3 → 人工确认</p></div>
      <div style="display:flex;gap:8px"><button class="btn btn-secondary" onclick="loadEditorDraft()">读取编辑器分镜</button><button class="btn btn-primary" id="saveBtn" onclick="saveToEditor()" disabled>应用到内容编辑器</button></div>
    </header>
    <section class="workbench-grid">
      <section class="workbench-col" id="scriptColumn">
        <div class="col-head"><h2>1. 口播与分镜</h2><span>输入</span></div>
        <div class="col-body">
          <textarea class="input script-input" id="scriptInput" placeholder="粘贴口播文案。系统会按句拆分；也可先从内容编辑器读取结构化分镜。"></textarea>
          <p class="hint">系统只用镜头已有的 ASR、OCR、人工标签和来源证据解释匹配。低置信度结果不会自动冒充准确答案。</p>
          <label class="field-label">目标画幅</label>
          <div class="input" style="margin:6px 0 12px;background:var(--bg-secondary);color:var(--text-secondary)">9:16 竖屏（固定）</div>
          <button class="btn btn-primary" style="width:100%" id="matchBtn" onclick="runMatch()">拆解并精准匹配</button>
        </div>
      </section>
      <section class="workbench-col" id="atomColumn">
        <div class="col-head"><h2>2. 语义片段</h2><span id="atomCount">0 个</span></div>
        <div class="col-body" id="atomList"><div class="empty-note">提交口播后，这里按时间线显示每个语义片段。</div></div>
      </section>
      <section class="workbench-col" id="candidateColumn">
        <div class="col-head"><h2>3. 候选镜头</h2><span>Top 3</span></div>
        <div id="hotspotEventMatches" class="empty-note">热点事件片段 / Buffalo 原有素材</div>
        <div class="col-body" id="candidateList"><div class="empty-note">选择左侧语义片段，查看候选镜头与匹配依据。</div></div>
      </section>
    </section>
    <footer class="timeline" id="timeline"><div class="timeline-item"><strong>尚未匹配</strong>等待口播输入</div></footer>
  </main>
</div>
<div id="toastContainer" class="toast-container"></div>
<script src="/static/common.js?v=8"></script>
<script>
const PAGE_ID='workbench';const params=new URLSearchParams(location.search);const projectId=params.get('project_id');let session=null,segments=new Map(),activeAtomId=null,sourceDraft=null,projectData=null;let selectedHotspotEvent=null;
document.getElementById('sidebar').outerHTML=renderSidebar(PAGE_ID);
function mediaUrl(segment,kind){const path=kind==='thumb'?(segment.thumbnail_path||''):(segment.preview_path||segment.asset_filepath||'');return path?'/static/'+path.replace(/^\/+static\//,''):'';}
function semanticChips(atom){const values=Object.values(atom.semantics||{}).flat().filter(Boolean);return values.slice(0,8).map(value=>`<span class="chip">${escapeHtml(value)}</span>`).join('');}
async function loadSegments(){const response=await apiFetch('/api/asset-segments?limit=2000');const data=await response.json();segments=new Map(data.map(item=>[item.id,item]));}
async function loadHotspotEventMatches(eventId){const response=await apiFetch(`/api/hotspot-events/${eventId}/matches`,{cache:'no-store'});return response.json();}
function loadSelectedHotspotEvent(){try{selectedHotspotEvent=JSON.parse(localStorage.getItem('selectedHotspotEventClip')||'null');if(selectedHotspotEvent){document.getElementById('hotspotEventMatches').innerHTML=`<strong>已选择热点事件素材</strong><br>${escapeHtml(selectedHotspotEvent.title_zh||'热点事件')}<br><small>${(Number(selectedHotspotEvent.start_ms||0)/1000).toFixed(1)}–${(Number(selectedHotspotEvent.end_ms||0)/1000).toFixed(1)} 秒；写回项目后只使用此时间段</small>`;}}catch(e){selectedHotspotEvent=null;}}
function loadEditorDraft(){try{sourceDraft=JSON.parse(localStorage.getItem('draft')||'null');const content=(sourceDraft?.contents||[]).find(item=>item.platform==='douyin');if(content?.scenes?.length){document.getElementById('scriptInput').value=content.scenes.map(item=>item.voiceover||'').filter(Boolean).join('\n');showToast(`已读取 ${content.scenes.length} 个分镜`);return;}showToast('编辑器中没有可读取的抖音分镜','error');}catch(e){showToast('编辑器草稿格式无法读取','error');}}
async function loadProjectDraft(){if(!projectId)return;try{const response=await apiFetch(`/api/video-projects/${projectId}`);projectData=await response.json();const payload=projectData.current_revision?.payload||{};sourceDraft={contents:[{platform:'douyin',...payload}]};document.getElementById('scriptInput').value=(payload.scenes||[]).map(item=>item.voiceover||'').filter(Boolean).join('\n');document.getElementById('saveBtn').textContent='应用到视频项目';showToast('已读取视频项目分镜','info');}catch(error){showToast(error.message,'error');}}
function payload(){const script=document.getElementById('scriptInput').value.trim();const orientation='portrait';if(sourceDraft){const content=(sourceDraft.contents||[]).find(item=>item.platform==='douyin');if(content?.scenes?.length&&content.scenes.map(item=>item.voiceover||'').filter(Boolean).join('\n')===script)return {scenes:content.scenes,orientation};}return {script,orientation};}
async function runMatch(){const body=payload();if(!body.script&&!body.scenes?.length){showToast('请先输入口播文案','error');return;}const button=document.getElementById('matchBtn');button.disabled=true;button.textContent='正在匹配';try{await loadSegments();const response=await apiFetch('/api/semantic-match',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});session=await response.json();activeAtomId=session.atoms[0]?.id||null;renderAll();showToast(`已生成 ${session.atoms.length} 个语义片段的候选镜头`);}catch(e){showToast(e.message,'error');}finally{button.disabled=false;button.textContent='拆解并精准匹配';}}
function renderAll(){renderAtoms();renderCandidates();renderTimeline();document.getElementById('saveBtn').disabled=!session&&!selectedHotspotEvent;}
function renderAtoms(){document.getElementById('atomCount').textContent=`${session?.atoms?.length||0} 个`;document.getElementById('atomList').innerHTML=(session?.atoms||[]).map((atom,index)=>`<button class="atom-card ${atom.id===activeAtomId?'active':''}" onclick="activeAtomId=${atom.id};renderAll()"><div class="atom-title">片段 ${index+1} · ${(atom.duration_ms/1000).toFixed(1)} 秒</div><div class="atom-text">${escapeHtml(atom.text)}</div><div class="atom-meta">${semanticChips(atom)}</div></button>`).join('')||'<div class="empty-note">暂无语义片段</div>';}
function candidateMedia(segment){const video=mediaUrl(segment,'video'),thumb=mediaUrl(segment,'thumb');if(segment?.asset_file_type==='video'&&video)return `<video src="${escapeHtml(video)}" poster="${escapeHtml(thumb)}" controls preload="metadata"></video>`;if(thumb||video)return `<img src="${escapeHtml(thumb||video)}" alt="候选镜头"/>`;return '<span style="color:#aaa;font-size:11px">暂无预览</span>';}
function renderCandidates(){const atom=(session?.atoms||[]).find(item=>item.id===activeAtomId);if(!atom){document.getElementById('candidateList').innerHTML='<div class="empty-note">请选择语义片段</div>';return;}document.getElementById('candidateList').innerHTML=(atom.candidates||[]).map(candidate=>{const segment=segments.get(candidate.segment_id)||{};const selected=atom.selected_segment_id===candidate.segment_id;return `<article class="candidate ${selected?'selected':''}"><div class="candidate-media">${candidateMedia(segment)}</div><div class="candidate-content"><div class="candidate-row"><div><strong>${escapeHtml(segment.asset_name||('镜头 '+candidate.segment_id))}</strong><div style="font-size:10px;color:var(--text-muted);margin-top:3px">${(segment.start_ms/1000||0).toFixed(1)}–${(segment.end_ms/1000||0).toFixed(1)} 秒 · ${escapeHtml(segment.primary_category||'待分类')}</div></div><span class="score">${candidate.match_score}</span></div><div style="font-size:11px;font-weight:700;margin-top:9px">匹配依据</div><ul class="reason-list">${candidate.reasons.map(reason=>`<li>${escapeHtml(reason)}</li>`).join('')}</ul>${candidate.review_required?'<div class="review">证据或时长不足，需要人工复核</div>':''}<div class="candidate-actions"><button class="btn ${selected?'btn-secondary':'btn-primary'} btn-sm" onclick="selectCandidate(${atom.id},${candidate.segment_id},${candidate.review_required})">${selected?'已选择':'选择镜头'}</button>${selected?`<label style="font-size:10px"><input type="checkbox" ${atom.locked?'checked':''} onchange="selectCandidate(${atom.id},${candidate.segment_id},${candidate.review_required},this.checked)"> 锁定</label>`:''}</div></div></article>`;}).join('')||'<div class="empty-note">没有满足硬约束的本地镜头。可先去内容资产补充素材。</div>';}
async function selectCandidate(atomId,segmentId,needsReview,locked=false){try{const response=await apiFetch(`/api/semantic-match/${session.id}/atoms/${atomId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({segment_id:segmentId,locked,review_confirmed:needsReview,action:'selected',reason:needsReview?'人工复核后选择':'采用推荐'})});session=await response.json();activeAtomId=atomId;renderAll();showToast('镜头选择已保存');}catch(e){showToast(e.message,'error');}}
function renderTimeline(){document.getElementById('timeline').innerHTML=(session?.atoms||[]).map((atom,index)=>{const candidate=(atom.candidates||[]).find(item=>item.segment_id===atom.selected_segment_id);const segment=segments.get(atom.selected_segment_id);return `<div class="timeline-item ${atom.selected_segment_id?(candidate?.review_required?'review':'done'):''}"><strong>片段 ${index+1} · ${atom.selected_segment_id?'已选':'待选'}</strong>${escapeHtml(segment?.asset_name||atom.text.slice(0,18))}</div>`;}).join('')||'<div class="timeline-item"><strong>尚未匹配</strong>等待口播输入</div>';}
async function saveToEditor(){if(!session&&!selectedHotspotEvent)return;const mapping=(session?.atoms||[]).map(atom=>{const segment=segments.get(atom.selected_segment_id);return segment?{segment_id:segment.id,asset_id:segment.asset_id,start_ms:segment.start_ms,end_ms:segment.end_ms}:null;});if(selectedHotspotEvent){const eventMapping={asset_id:selectedHotspotEvent.asset_id,event_clip_id:selectedHotspotEvent.event_clip_id,start_ms:selectedHotspotEvent.start_ms,end_ms:selectedHotspotEvent.end_ms};if(mapping.length)mapping[0]={...mapping[0],...eventMapping};else mapping.push(eventMapping);}localStorage.setItem('semanticMatchResult',JSON.stringify({session_id:session?.id||null,mapping}));if(sourceDraft){const content=(sourceDraft.contents||[]).find(item=>item.platform==='douyin');if(content?.scenes){content.scenes.forEach((scene,index)=>{const match=mapping[index];if(match)Object.assign(scene,{asset_id:match.asset_id,asset_segment_id:match.segment_id,event_clip_id:match.event_clip_id,asset_start_ms:match.start_ms,asset_end_ms:match.end_ms});});if(projectData){await apiFetch(`/api/video-projects/${projectId}/revision`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({payload:content})});localStorage.removeItem('selectedHotspotEventClip');showToast('事件片段已写回视频项目');setTimeout(()=>location.href=`/video-project.html?id=${encodeURIComponent(projectId)}`,300);return;}localStorage.setItem('draft',JSON.stringify(sourceDraft));}}showToast('已写回内容编辑器');setTimeout(()=>location.href='/editor.html',300);}
loadSelectedHotspotEvent();if(projectId)loadProjectDraft();else if(params.get('from')==='editor')loadEditorDraft();
</script>
</body>
</html>

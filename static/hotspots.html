<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>热点审核台 - SA-LogiFlow</title>
  <link rel="stylesheet" href="/static/design-system.css?v=6"/>
</head>
<body>
  <div class="app-layout" id="app"></div>
  <div id="toastContainer" class="toast-container"></div>
  <div id="drawerBackdrop" class="drawer-backdrop" hidden onclick="closeDrawers()"></div>
  <aside id="collectionDrawer" class="workbench-drawer" aria-label="热点采集说明" hidden></aside>
  <aside id="sourceDrawer" class="workbench-drawer" aria-label="信源管理" hidden></aside>
  <aside id="brandDrawer" class="workbench-drawer" aria-label="品牌证据管理" hidden></aside>

  <script src="/static/common.js?v=8"></script>
  <script>
const PAGE_ID='hotspots';
let hotspots=[],sources=[],brandEvidence=[],assets=[],hotspotMedia=[],hotspotMediaIndex=[],fetchRun=null;
const params=new URLSearchParams(location.search);
let selectedHotspotId=Number(params.get('hotspot_id')||sessionStorage.getItem('selectedHotspotId')||0);
let selectedHotspot=null,evidencePackage=null,sampleBundle=null,outputTab='video';
let query='',publisherFilter='',mediaTypeFilter='all',timeFilter='all',busyAction='';

const sourcePurpose={
  'SAnews':'综合政务、社会事件、交通与公共服务热点',
  'SARS':'海关、边境、税务与跨境履约风险',
  'Department of Transport':'道路、港口、货运与交通运行信息',
  'South African Government':'政府声明、部门公告和政策信息',
  'South African Reserve Bank':'汇率、利率、支付与宏观金融背景',
  'Moneyweb':'财经与企业新闻，覆盖 Transnet、港口、燃油与供应链成本',
  'BusinessTech':'商业与民生新闻，覆盖电商、快递、道路与基础设施',
  'Daily Maverick':'深度时事报道，覆盖港口拥堵、铁路与边境口岸事件',
  'The Citizen':'综合新闻，覆盖罢工、封路、天气等履约影响事件',
  'The South African':'综合新闻与民生话题，补充 C 端视角热点',
  'YouTube · SA Today':'南非公开视频热点发现，只读取最近单视频元数据',
  'YouTube · South Africa Now':'南非公开视频热点发现，只读取最近单视频元数据',
  'YouTube · SABC Digital News':'南非公开视频热点发现，只读取最近单视频元数据',
  'YouTube · eNCA':'南非 24 小时新闻台，现场类新闻视频密度高',
  'YouTube · Newzroom Afrika':'南非 24 小时新闻台，现场类新闻视频密度高'
};

function icon(path){return `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${path}"/></svg>`;}
function formatDate(value){if(!value)return '未记录';const date=new Date(value);return Number.isNaN(date.getTime())?value:date.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function statusLabel(status){return {running:'抓取中',succeeded:'成功',partial:'部分失败',failed:'失败'}[status]||'尚未抓取';}
function sourceHealth(){return fetchRun?.result?.source_health||[];}
function healthByName(name){return sourceHealth().find(item=>item.name===name);}

async function init(){
  const user=getCurrentUser();
  const jobs=[loadHotspots(),loadFetchStatus(),loadBrandEvidence(),loadAssets(),loadHotspotMediaIndex()];
  if(user.role==='admin')jobs.push(loadSources());
  await Promise.all(jobs);
  chooseInitialHotspot();
  await loadSelectedHotspotMedia();
  render();
  ensureHotspotTranslation();
  await loadSelectedHistory();
  if(fetchRun?.status==='running')setTimeout(pollFetchStatus,1600);
}

async function loadHotspots(){const r=await apiFetch('/api/hotspots?limit=200');hotspots=await r.json();}
async function loadFetchStatus(){const r=await apiFetch('/api/hotspots/fetch-status');fetchRun=(await r.json()).run;}
async function loadSources(){try{const r=await apiFetch('/api/hotspot-sources');sources=await r.json();}catch{sources=[];}}
async function loadBrandEvidence(){const r=await apiFetch('/api/brand-evidence');brandEvidence=await r.json();}
async function loadAssets(){const r=await apiFetch('/api/assets');assets=await r.json();}
async function loadHotspotMediaIndex(){try{const r=await apiFetch('/api/hotspot-media?limit=1000');hotspotMediaIndex=await r.json();}catch{hotspotMediaIndex=[];}}
async function loadSelectedHotspotMedia(){if(!selectedHotspotId){hotspotMedia=[];return;}const r=await apiFetch(`/api/hotspot-media?hotspot_id=${selectedHotspotId}`);hotspotMedia=await r.json();}

async function ensureHotspotTranslation(){const requestedId=selectedHotspotId,item=selectedHotspot;if(!item||item.translation_status==='translating'||(item.translation_status==='ready'&&item.translation_snapshot_sha256===item.snapshot_sha256&&item.title_zh&&item.summary_zh))return;item.translation_status='translating';render();try{const r=await apiFetch(`/api/hotspots/${requestedId}/translate`,{method:'POST'});const translated=await r.json();if(requestedId!==selectedHotspotId)return;const index=hotspots.findIndex(value=>value.id===requestedId);if(index>=0)hotspots[index]=translated;selectedHotspot=translated;render();}catch(error){if(requestedId!==selectedHotspotId)return;item.translation_status='failed';render();showToast('中文翻译失败，可继续使用英文原文','error');}}

function chooseInitialHotspot(){
  selectedHotspot=hotspots.find(item=>item.id===selectedHotspotId)||hotspots[0]||null;
  selectedHotspotId=selectedHotspot?.id||0;
  if(selectedHotspotId)sessionStorage.setItem('selectedHotspotId',String(selectedHotspotId));
}

async function loadSelectedHistory(){
  const requestedHotspotId=selectedHotspotId;
  if(!requestedHotspotId)return;
  try{
    const r=await apiFetch(`/api/hotspots/${requestedHotspotId}/sample-bundles?limit=10`);
    const history=await r.json();
    if(requestedHotspotId!==selectedHotspotId||!history.length)return;
    const restoredBundle=history[0];
    const packageResponse=await apiFetch(`/api/evidence-packages/${restoredBundle.evidence_package_id}`);
    const restoredPackage=await packageResponse.json();
    if(requestedHotspotId!==selectedHotspotId)return;
    sampleBundle=restoredBundle;evidencePackage=restoredPackage;render();
  }catch{}
}

function filteredHotspots(){
  const now=Date.now();
  return hotspots.filter(item=>{
    const haystack=`${item.title_zh||''} ${item.summary_zh||''} ${item.title} ${item.summary} ${item.publisher}`.toLowerCase();
    if(query&&!haystack.includes(query.toLowerCase()))return false;
    if(publisherFilter&&item.publisher!==publisherFilter)return false;
    if(mediaTypeFilter!=='all'&&hotspotContentForm(item)!==mediaTypeFilter)return false;
    if(timeFilter!=='all'){
      const time=new Date(item.published_at||item.retrieved_at).getTime();
      const hours=timeFilter==='24h'?24:timeFilter==='7d'?168:720;
      if(!time||now-time>hours*3600000)return false;
    }
    return true;
  });
}

function hotspotContentForm(item){
  const kinds=hotspotMediaIndex.filter(media=>Number(media.hotspot_id)===Number(item.id)).map(media=>media.media_kind);
  if(kinds.some(kind=>kind==='video_link'||kind==='video_file'))return 'video';
  if(kinds.includes('image'))return 'image';
  return 'text';
}

function contentFormLabel(form){return {video:'视频',image:'图片',text:'纯文本'}[form]||'纯文本';}
function contentFormMeta(form){return {video:'视频候选',image:'图片候选',text:'纯文本事实来源'}[form]||'纯文本事实来源';}
function renderContentFormTag(item){const form=hotspotContentForm(item);return `<span class="content-form-tag ${form}">${contentFormLabel(form)}</span>`;}

function render(){
  const admin=getCurrentUser().role==='admin';
  document.getElementById('app').innerHTML=`${renderSidebar(PAGE_ID)}<main class="main-content hotspot-page">
    <header class="page-header hotspot-header">
      <div><p class="eyebrow">INTERNAL HOTSPOT REVIEW</p><h1 class="page-title">热点审核台</h1><p class="page-subtitle">面向运营与编辑：核验来源、处理冲突与待确认项；正常抓取结果自动入库，人工只处理需要判断的热点。</p></div>
      <div class="header-actions">
        <button class="btn btn-ghost" type="button" onclick="openCollectionGuide()">系统如何采集？</button>
        ${admin?'<button class="btn btn-secondary" type="button" onclick="openSourceManager()">信源管理</button>':''}
        <button class="btn btn-primary" type="button" onclick="fetchLatest()" ${busyAction==='fetch'||fetchRun?.status==='running'?'disabled':''}>${icon('M12 4V1L8 5l4 4V6a6 6 0 11-5.65 8H4.26A8 8 0 1012 4z')}<span>${fetchRun?.status==='running'?'正在抓取':'抓取最新热点'}</span></button>
      </div>
    </header>
    <div class="page-body hotspot-body">
      ${renderFetchSummary()}
      <section class="workbench-grid">
        <div class="hotspot-list-panel">${renderHotspotList()}</div>
        <div class="hotspot-workspace">${renderWorkspace()}</div>
      </section>
    </div>
  </main>`;
}

function renderFetchSummary(){
  const result=fetchRun?.result||{};
  const healthy=sourceHealth().filter(item=>item.status==='ok').length;
  const total=sourceHealth().length||sources.filter(item=>item.enabled).length;
  return `<section class="fetch-summary" aria-live="polite">
    <div><span>上次抓取</span><strong>${fetchRun?formatDate(fetchRun.finished_at||fetchRun.started_at):'尚未运行'}</strong><small class="run-state ${escapeHtml(fetchRun?.status||'idle')}">${statusLabel(fetchRun?.status)}</small></div>
    <div><span>信源状态</span><strong>${total?`${healthy}/${total} 正常`:'等待首次检测'}</strong><button type="button" onclick="openSourceManager()">查看明细</button></div>
    <div><span>本次结果</span><strong>${fetchRun?`新增 ${Number(result.new||0)+Number(result.video_new||0)} · 更新 ${Number(result.updated||0)+Number(result.video_updated||0)}`:'暂无结果'}</strong><small>视频候选 ${Number(result.video_media||0)} · 可用配图 ${Number(result.assets||0)} · 配图失败 ${Number(result.media_errors?.length||0)}</small></div>
  </section>`;
}

function renderHotspotList(){
  const publishers=[...new Set(hotspots.map(item=>item.publisher).filter(Boolean))];
  const items=filteredHotspots();
  return `<div class="list-toolbar"><h2>热点池 <span>${items.length}</span></h2><div class="filter-row"><input class="input" aria-label="搜索热点" placeholder="搜索标题或摘要" value="${escapeHtml(query)}" oninput="query=this.value;render()"/><select class="select" aria-label="筛选内容形式" onchange="mediaTypeFilter=this.value;render()"><option value="all">全部形式</option><option value="video" ${mediaTypeFilter==='video'?'selected':''}>视频</option><option value="image" ${mediaTypeFilter==='image'?'selected':''}>图片</option><option value="text" ${mediaTypeFilter==='text'?'selected':''}>纯文本</option></select><select class="select" aria-label="筛选来源" onchange="publisherFilter=this.value;render()"><option value="">全部来源</option>${publishers.map(name=>`<option value="${escapeHtml(name)}" ${publisherFilter===name?'selected':''}>${escapeHtml(name)}</option>`).join('')}</select><select class="select" aria-label="筛选时间" onchange="timeFilter=this.value;render()"><option value="all">全部时间</option><option value="24h" ${timeFilter==='24h'?'selected':''}>24 小时</option><option value="7d" ${timeFilter==='7d'?'selected':''}>7 天</option><option value="30d" ${timeFilter==='30d'?'selected':''}>30 天</option></select></div></div>
    <div class="hotspot-list">${items.map(hotspotCard).join('')||`<div class="list-empty"><strong>没有符合条件的热点</strong><p>${hotspots.length?'调整筛选条件后再试。':'点击“抓取最新热点”，系统会读取官方 Feed 和已确认的公开视频频道。'}</p></div>`}</div>`;
}

function hotspotCard(item){
  const selected=item.id===selectedHotspotId;
  const translationState=item.translation_status==='translating'?' · 翻译中':item.translation_status==='failed'?' · 中文翻译失败':'';
  const form=hotspotContentForm(item);
  return `<button class="hotspot-card ${selected?'selected':''}" type="button" onclick="selectHotspot(${item.id})"><span class="card-source">${escapeHtml(item.publisher)}${translationState}</span><span class="card-title-row"><strong>${escapeHtml(item.title_zh||item.title)}</strong>${renderContentFormTag(item)}</span>${item.title_zh?`<span class="original-title">${escapeHtml(item.title)}</span>`:''}<p>${escapeHtml(item.summary_zh||item.summary||'暂无摘要')}</p><span class="card-meta">${formatDate(item.published_at||item.retrieved_at)} · ${contentFormMeta(form)}</span></button>`;
}

function renderWorkspace(){
  if(!selectedHotspot)return `<div class="workspace-empty">${icon('M4 4h16v16H4zM7 8h10V6H7v2zm0 4h10v-2H7v2zm0 4h7v-2H7v2z')}<strong>先从左侧选择一个热点</strong><p>系统不会只凭标题直接生成内容。</p></div>`;
  const admin=getCurrentUser().role==='admin';
  const confirmed=brandEvidence.filter(item=>item.status==='confirmed'&&item.disclosure_level==='public');
  const usable=assets.filter(item=>item.status==='active'&&['ready','review_required'].includes(item.processing_status||''));
  const videos=usable.filter(item=>item.file_type==='video').length;
  const images=usable.filter(item=>item.file_type==='image').length;
  const hotspotVideos=hotspotMedia.filter(item=>item.media_kind==='video_link'||item.media_kind==='video_file').length;
  const hotspotImages=hotspotMedia.filter(item=>item.media_kind==='image').length;
  const green=hotspotMedia.filter(item=>item.rights_tier==='green').length,yellow=hotspotMedia.filter(item=>item.rights_tier==='yellow').length,red=hotspotMedia.filter(item=>item.rights_tier==='red').length;
  return `<div class="workflow-head"><div><span>当前选题</span><div class="workflow-title-row"><h2>${escapeHtml(selectedHotspot.title_zh||selectedHotspot.title)}</h2>${renderContentFormTag(selectedHotspot)}</div>${selectedHotspot.title_zh?`<p class="workspace-original">${escapeHtml(selectedHotspot.title)}</p>`:''}</div><a href="${escapeHtml(selectedHotspot.source_url)}" target="_blank" rel="noopener noreferrer">打开原始来源</a></div>
    <section class="workflow-section"><div class="section-heading"><div><span>当前记录</span><h3>热点详情</h3></div><span class="status-chip ok">已选中</span></div><dl class="fact-grid"><div><dt>发布机构</dt><dd>${escapeHtml(selectedHotspot.publisher)}</dd></div><div><dt>发布时间</dt><dd>${formatDate(selectedHotspot.published_at)}</dd></div><div><dt>抓取时间</dt><dd>${formatDate(selectedHotspot.retrieved_at)}</dd></div><div><dt>中文状态</dt><dd>${selectedHotspot.translation_status==='ready'?'已缓存':selectedHotspot.translation_status==='translating'?'翻译中':selectedHotspot.translation_status==='failed'?'<button class="translation-retry" onclick="ensureHotspotTranslation()">翻译失败，点击重试</button>':'等待翻译'}</dd></div></dl><p class="source-summary">${escapeHtml(selectedHotspot.summary_zh||selectedHotspot.summary||'原始来源没有提供摘要，请打开原文人工核对。')}</p>${selectedHotspot.summary_zh?`<details class="source-original"><summary>查看英文原文摘要</summary><p>${escapeHtml(selectedHotspot.summary||'')}</p></details>`:''}</section>
    <section class="workflow-section"><div class="section-heading"><div><span>步骤 2</span><h3>核验证据</h3></div><span class="status-chip ${evidencePackage?'ok':'pending'}">${evidencePackage?'已锁定':'待执行'}</span></div><p class="section-help">外部事实只来自当前原文；Buffalo 能力表述只允许引用已人工确认的品牌证据。</p>${confirmed.length?`<div class="brand-evidence-list">${confirmed.map(item=>`<label><input type="checkbox" class="brand-evidence-check" value="${item.id}" checked/><span><strong>${escapeHtml(item.claim)}</strong><small>${escapeHtml(item.evidence_note)}</small></span></label>`).join('')}</div>`:'<div class="notice-box"><strong>没有已确认的品牌证据</strong><p>仍可生成不含品牌能力承诺的内部样本；不会写具体时效、覆盖率或业绩。</p></div>'}<div class="section-actions">${admin?'<button class="btn btn-secondary" type="button" onclick="openBrandManager()">管理品牌证据</button>':''}${evidencePackage?'':`<button class="btn btn-primary" type="button" onclick="buildEvidencePackage()" ${busyAction?'disabled':''}>核验并锁定证据</button>`}</div>${evidencePackage?renderEvidencePackage():''}</section>
    <section class="workflow-section"><div class="section-heading"><div><span>步骤 3</span><h3>送入素材生产</h3></div><span class="status-chip ${usable.length||hotspotMedia.length?'ok':'warning'}">${usable.length||hotspotMedia.length?'可跟进':'待补采'}</span></div><div class="material-summary dual-library-summary"><div><strong>${hotspotVideos}</strong><span>热点视频候选</span></div><div><strong>${hotspotImages}</strong><span>热点图片候选</span></div><div><strong>${videos}</strong><span>原本库视频</span></div><div><strong>${images}</strong><span>原本库图片</span></div></div><p class="rights-counts"><span class="green">绿色 ${green}</span><span class="yellow">黄色 ${yellow}</span><span class="red">红色 ${red}</span></p><p class="section-help">审核台只做确认与跟进判断；Hook 浏览、按日检索和长期素材管理请到热点素材库。</p>${sampleBundle?`<details class="source-original"><summary>查看样本镜头匹配摘要</summary>${renderMaterialReview()}</details>`:''}<a class="btn btn-primary" href="/assets.html?library=hotspot&hotspot_id=${selectedHotspot.id}">去热点素材库查看</a></section>
    <section class="workflow-section output-section"><div class="section-heading"><div><span>步骤 4</span><h3>生成样本</h3></div><span class="status-chip ${sampleBundle?'warning':'pending'}">${sampleBundle?'内部预览':'未生成'}</span></div>${sampleBundle?renderOutputs():`<p class="section-help">三种形式共用同一份事实和品牌证据，结构分别生成；默认不可发布。</p><button class="btn btn-primary" type="button" onclick="generateSamples()" ${!evidencePackage||busyAction?'disabled':''}>${busyAction==='sample'?'正在生成':'生成视频、图文和公众号样本'}</button>`}</section>
    ${renderTechnicalDetails()}`;
}

function renderEvidencePackage(){
  const facts=evidencePackage.fact_claims||[];
  const brands=evidencePackage.brand_claims||[];
  return `<div class="evidence-result"><strong>已锁定 ${facts.length} 条事实、${brands.length} 条品牌证据</strong><p>状态：${escapeHtml(evidencePackage.status)}。后续三种样本只能使用这些 claim。</p></div>`;
}

function renderMaterialReview(){
  const scenes=sampleBundle?.video?.scenes||[];
  return `<div class="scene-review-list">${scenes.map((scene,index)=>{const candidates=scene.candidates||[];const best=candidates[0];return `<article class="scene-review ${scene.match_review_required?'weak':''}"><div class="scene-review-head"><strong>镜头 ${index+1} · ${escapeHtml(scene.business_role||'待定义')}</strong><span>${scene.match_review_required?'需人工换镜头':best?'候选可复核':'缺少素材'}</span></div><p>${escapeHtml(scene.visual||scene.voiceover||'')}</p>${best?`<div class="best-candidate">最佳候选：素材 ${best.asset_id||scene.asset_id||'未知'} · ${formatSegmentRange(best.start_ms,best.end_ms)} · 匹配分 ${Number(best.match_score||0).toFixed(2)}</div><details><summary>查看 Top ${candidates.length} 匹配依据</summary>${candidates.map((candidate,rank)=>`<div class="candidate-detail"><strong>${rank+1}. 素材 ${candidate.asset_id||'未知'} · ${formatSegmentRange(candidate.start_ms,candidate.end_ms)}</strong><span>匹配分 ${Number(candidate.match_score||0).toFixed(2)}${candidate.review_required?' · 低于质量门槛':''}</span><p>${escapeHtml(candidate.description||'暂无镜头描述')}</p><small>${(candidate.reasons||[]).map(reason=>escapeHtml(reason)).join('；')||'没有足够的直接匹配依据'}</small></div>`).join('')}</details>`:'<div class="material-gap">缺少与该段口播相关的本地镜头，请补充对应场景、动作或主体素材。</div>'}</article>`;}).join('')}</div>`;
}

function formatSegmentRange(startMs,endMs){
  if(startMs==null||endMs==null)return '时间范围待确认';
  return `${(Number(startMs)/1000).toFixed(1)}–${(Number(endMs)/1000).toFixed(1)} 秒`;
}

function renderTechnicalDetails(){
  const manifest=sampleBundle?.manifest||{};
  const usage=manifest.model_usage||{};
  const claimIds=manifest.claim_ids||sampleBundle?.video?.claim_ids||[];
  return `<details class="technical-details"><summary>技术明细</summary><div>热点 ID：${selectedHotspot.id}</div><div>证据包：${escapeHtml(evidencePackage?.id||sampleBundle?.evidence_package_id||'尚未创建')}</div><div>样本包：${escapeHtml(sampleBundle?.id||'尚未创建')}</div><div>输出目录：${escapeHtml(sampleBundle?.output_dir||'尚未生成')}</div><div>Claim IDs：${claimIds.length?claimIds.map(id=>escapeHtml(id)).join('、'):'尚未生成'}</div><div>模型预算：调用 ${Number(usage.calls_used||0)}/${Number(usage.max_calls||0)}，输入 ${Number(usage.input_tokens_used||0)}，输出 ${Number(usage.output_tokens_used||0)}</div><div>素材策略：自有素材优先；许可媒体仅作补充；来源不明不下载。</div></details>`;
}

function renderOutputs(){
  const issues=sampleBundle.quality_issues||[];
  return `<div class="internal-warning"><strong>内部测试，不可发布</strong><span>必须人工检查事实、品牌表述与画面匹配后，才能进入正式生产。</span></div><div class="output-tabs"><button class="${outputTab==='video'?'active':''}" onclick="outputTab='video';render()">视频</button><button class="${outputTab==='carousel'?'active':''}" onclick="outputTab='carousel';render()">图文</button><button class="${outputTab==='wechat'?'active':''}" onclick="outputTab='wechat';render()">公众号</button></div>${renderOutputContent()}<div class="quality-panel"><strong>质量检查</strong><ul>${issues.map(item=>`<li>${escapeHtml(item)}</li>`).join('')||'<li>暂无自动阻断项，仍需人工复核。</li>'}</ul></div><button class="btn btn-secondary" onclick="sampleBundle=null;render()">重新生成前检查证据</button>`;
}

function renderOutputContent(){
  if(outputTab==='video'){
    const video=sampleBundle.video||{};
    const previewUrl=samplePreviewUrl();
    const previewStatus=sampleBundle.manifest?.video_preview?.quality_report?.status;
    const materialBlocked=video.material_status==='blocked';
    const gaps=video.material_gaps||[];
    const blockTitle=gaps.some(item=>item.includes('热点素材'))?'热点素材未就绪，暂不可成片':'原本素材未就绪，暂不可成片';
    const preview=materialBlocked

function samplePreviewUrl(){
  const raw=sampleBundle?.preview_path||sampleBundle?.manifest?.video_preview?.path||sampleBundle?.video?.preview_path||'';
  if(!raw)return '';
  if(/^https?:\/\//i.test(raw)||raw.startsWith('/static/'))return raw;
  const marker='/static/';const index=raw.indexOf(marker);
  return index>=0?raw.slice(index):'/static/'+raw.replace(/^\/+/, '');
}

async function setPackageFilter(key,value){packageFilters[key]=value;await loadPackages();renderTopicPackages();}
async function selectPackage(id){
  rememberTopicPackageListScroll();
  const request=++packageSelectionRequest;
  try{
    const response=await apiFetch(`/api/hotspot-packages/${id}`);
    const detail=await response.json();
    if(request!==packageSelectionRequest)return;
    selectedPackage=detail;
    sessionStorage.setItem('selectedHotspotId',String(id));
    renderTopicPackages();
  }catch(error){if(request===packageSelectionRequest)showToast(error.message,'error');}
}
async function confirmTopicPackage(id){try{await apiFetch(`/api/hotspot-packages/${id}/confirm`,{method:'POST'});await loadPackageDetail(id);await loadPackages();renderTopicPackages();showToast('专题事实已确认；Hook 需另行准备');}catch(error){showToast(error.message,'error');}}

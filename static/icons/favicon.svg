  <rect x="10" y="20" width="26" height="18" rx="3" fill="#fff"/>
  <!-- truck cab -->
  <rect x="36" y="26" width="16" height="12" rx="3" fill="#fff"/>
  <!-- cab window -->
  <rect x="39" y="28" width="8" height="6" rx="1.5" fill="#6366f1"/>
  <!-- wheels -->

  <circle cx="19" cy="42" r="2" fill="#6366f1"/>
  <circle cx="44" cy="42" r="4.5" fill="#fff"/>
  <circle cx="44" cy="42" r="2" fill="#6366f1"/>
  <!-- LF monogram -->
  <text x="32" y="17" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="10" fill="#fff" letter-spacing="0.5">LF</text>

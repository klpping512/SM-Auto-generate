<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg"/>
<link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico"/>
<link rel="apple-touch-icon" href="/static/icons/icon-180.png"/>
<link rel="manifest" href="/static/manifest.json"/>
<meta name="theme-color" content="#6366f1"/>
<title>审核中心 - SA-LogiFlow</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="/static/design-system.css"/>
</head>
<body>
<div class="app-layout" id="app"></div>
<div id="toastContainer" class="toast-container"></div>
<script src="/static/common.js"></script>
<script>
const PAGE_ID = 'review';
const platformNames = { xiaohongshu:'小红书',douyin:'抖音',facebook:'Facebook',twitter:'Twitter',reddit:'Reddit' };
const platformIcons = { xiaohongshu:'simple-icons:xiaohongshu',douyin:'ri:tiktok-fill',facebook:'ri:facebook-box-fill',twitter:'ri:twitter-x-fill',reddit:'ri:reddit-fill' };
const platformColors = { xiaohongshu:'#FF2442',douyin:'#000',facebook:'#1877F2',twitter:'#1DA1F2',reddit:'#FF4500' };

let pendingItems = [];
let currentItemId = null;

async function init() {
    try {
        const resp = await apiFetch('/api/review/pending');
        if (resp.ok) { pendingItems = await resp.json(); }
        else { pendingItems = []; }
    } catch(e) { pendingItems = []; }
    render();
}

function render() {
    document.getElementById('app').innerHTML = `
    ${renderSidebar(PAGE_ID)}
    <div class="main-content">
        <div class="page-header">
            <div style="display:flex;align-items:center;gap:8px;">
                <h1 class="page-title">审核中心</h1>
                <span class="badge badge-purple">${pendingItems.length} 待审核</span>
            </div>
            <button class="btn btn-secondary btn-sm" onclick="init()"><iconify-icon icon="mdi:refresh" width="16"></iconify-icon> 刷新</button>
        </div>
        <div class="page-body">
            ${pendingItems.length === 0 ? `
                <div class="card">
                    <div class="empty-state">
                        <iconify-icon icon="mdi:check-all" width="56" style="color:var(--success);"></iconify-icon>
                        <p style="margin-top:12px;font-size:15px;font-weight:600;color:var(--text-primary);">没有待审核内容</p>
                        <p style="margin-top:4px;">所有内容都已处理完毕</p>
                    </div>
                </div>
            ` : `<div style="display:flex;flex-direction:column;gap:12px;">
                ${pendingItems.map(item => {
                    const p = {icon:platformIcons[item.platform]||'mdi:help',color:platformColors[item.platform]||'#6B7280',name:platformNames[item.platform]||item.platform};
                    return `<div class="card fade-in" style="border-left:4px solid #8B5CF6;">
                        <div style="padding:20px;">
                            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                                <span class="badge badge-purple">待审核</span>
                                <span style="font-size:11px;font-weight:600;color:${p.color};display:flex;align-items:center;gap:4px;"><iconify-icon icon="${p.icon}" width="14"></iconify-icon> ${escapeHtml(p.name)}</span>
                                <span style="font-size:11px;color:var(--text-muted);margin-left:auto;">${escapeHtml(item.created_at)||''}</span>
                            </div>
                            <h3 style="font-size:15px;font-weight:700;margin-bottom:8px;">${escapeHtml(item.title)}</h3>
                            <p style="font-size:13px;color:var(--text-secondary);white-space:pre-wrap;line-height:1.7;">${escapeHtml(item.body)}</p>
                            ${(item.hashtags||[]).length?`<div style="margin-top:8px;font-size:11px;color:var(--primary);">${item.hashtags.map(h=>'#'+escapeHtml(h)).join(' ')}</div>`:''}
                            <div style="margin-top:16px;display:flex;justify-content:flex-end;gap:8px;">
                                <button class="btn btn-secondary btn-sm" onclick="openReview(${item.id})">查看</button>
                                <button class="btn btn-success btn-sm" onclick="doReview(${item.id},'approve')">通过</button>
                                <button class="btn btn-error btn-sm" onclick="openRejectModal(${item.id})">驳回</button>
                            </div>
                        </div>
                    </div>`;
                }).join('')}
            </div>`}
        </div>
    </div>

    <!-- 驳回弹窗 -->
    <div id="rejectModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;">
        <div class="card" style="width:440px;padding:24px;">
            <h3 style="font-size:16px;font-weight:700;margin-bottom:16px;">驳回内容</h3>
            <textarea id="rejectNote" class="input" rows="4" placeholder="请填写驳回原因（必填）" style="resize:none;"></textarea>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
                <button class="btn btn-secondary btn-sm" onclick="closeRejectModal()">取消</button>
                <button class="btn btn-error btn-sm" onclick="confirmReject()">确认驳回</button>
            </div>
        </div>
    </div>`;
}

async function doReview(id, action, note='') {
    try {
        const resp = await apiFetch(`/api/review/${id}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action, note}) });
        if (resp.ok) { showToast(action==='approve'?'已通过，已加入发布队列':'已驳回'); init(); }
        else { const e=await resp.json(); showToast(e.detail||'操作失败','error'); }
    } catch(e) { showToast('操作失败','error'); }
}

function openReview(id) { doReview(id, 'approve'); }

function openRejectModal(id) {
    currentItemId = id;
    document.getElementById('rejectModal').style.display = 'flex';
    document.getElementById('rejectNote').value = '';
    document.getElementById('rejectNote').focus();
}

function closeRejectModal() {
    document.getElementById('rejectModal').style.display = 'none';
    currentItemId = null;
}

function confirmReject() {
    const note = document.getElementById('rejectNote').value.trim();
    if (!note) { showToast('请填写驳回原因','error'); return; }
    doReview(currentItemId, 'reject', note);
    closeRejectModal();
}

init();
</script>
</body>
</html>

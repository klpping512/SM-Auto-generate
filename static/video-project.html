<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>视频工作台 - SA-LogiFlow</title>
<link rel="stylesheet" href="/static/design-system.css?v=8"/>
<style>
.wb-page{height:100vh;overflow:hidden}
.wb-main{display:flex;flex-direction:column;height:100vh;min-width:0;overflow:hidden}
.wb-header{padding:16px 24px 12px;border-bottom:1px solid var(--border);background:#fff;flex-shrink:0}
.wb-header h1{font-size:20px;margin:0}
.wb-header p{font-size:12px;color:var(--text-muted);margin:4px 0 0}
.wb-stages{display:flex;gap:4px;padding:10px 24px;border-bottom:1px solid var(--border-light);background:var(--bg-subcard);overflow-x:auto;flex-shrink:0}
.wb-stage{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text-muted);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.wb-stage .n{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#e8e2d8;color:#6b6256;font-size:11px}
.wb-stage.active{background:#fff;border-color:var(--primary);color:var(--text-primary);box-shadow:0 1px 0 rgba(185,138,76,.15)}
.wb-stage.active .n{background:var(--primary);color:#fff}
.wb-stage.done .n{background:#287a45;color:#fff}
.wb-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.7fr);gap:0;overflow:hidden}
.wb-canvas{min-width:0;overflow:auto;padding:20px 24px 28px;background:var(--bg-page)}
.wb-rail{min-width:0;overflow:auto;padding:20px 18px;border-left:1px solid var(--border);background:#fff}
.wb-card{border:1px solid var(--border-line);border-radius:10px;background:#fff;padding:16px;margin-bottom:12px}
.wb-card h2{font-size:15px;margin:0 0 10px}
.wb-card h3{font-size:13px;margin:0 0 8px}
.wb-meta{display:grid;gap:8px;font-size:13px;line-height:1.55}
.wb-meta dt{font-size:11px;color:var(--text-muted);margin:0}
.wb-meta dd{margin:2px 0 0;font-weight:600}
.scene-editor{display:grid;gap:10px}
.scene-row{padding:12px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-subcard)}
.scene-row header{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;font-weight:800}
.scene-fields{display:grid;grid-template-columns:1fr 1fr 90px;gap:8px}
.scene-fields label,.voice-block label{font-size:11px;color:var(--text-muted)}
.scene-fields textarea,.scene-fields input{margin-top:4px;min-height:64px}
.scene-fields input{min-height:44px}
.match-grid{display:grid;gap:12px}
.match-card{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-subcard)}
.match-source{padding:10px;border-radius:7px;background:#fff;border:1px solid var(--border-light);font-size:12px;line-height:1.5}
.match-source .tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;margin-bottom:6px}
.tag-hook{background:#fff7ea;color:#704417}
.tag-owned{background:#f0f9f3;color:#25613a}
.match-reason{grid-column:1/-1;font-size:12px;color:var(--text-secondary)}
.subtitle-safe{position:relative;width:min(220px,100%);aspect-ratio:9/16;margin-top:12px;border-radius:10px;background:linear-gradient(180deg,#f7f3ea,#ebe4d7);border:1px solid var(--border-line);overflow:hidden}
.subtitle-safe .zone{position:absolute;left:10%;right:10%;bottom:12%;height:18%;border:1px dashed var(--primary);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--primary);background:rgba(185,138,76,.08)}
.wb-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-top:1px solid var(--border);background:#fff;flex-shrink:0}
.wb-footer .btn{min-height:44px;min-width:44px}
.stage-line{display:flex;justify-content:space-between;font-size:12px}
.project-progress{height:8px;margin:10px 0 14px;background:#ece7df;border-radius:4px;overflow:hidden}
.project-progress i{display:block;height:100%;background:var(--primary);transition:width .25s}
.issue{padding:10px;border-left:3px solid #b86d2d;background:#fff7ea;border-radius:5px;font-size:12px;color:#704417;margin-top:8px}
.match-score-note{padding:10px;border-radius:5px;background:#fef2f2;color:#991b1b;font-size:12px;margin-top:8px}
.adjustment-note{padding:10px;border:1px solid #b7dfc5;border-radius:5px;background:#f0f9f3;color:#25613a;font-size:12px;line-height:1.55;margin-top:8px}
.empty-note{padding:28px 16px;text-align:center;color:var(--text-muted);font-size:13px}
.media-box video{width:100%;max-height:420px;background:#1c1915;border-radius:8px}
.quality-table{display:grid;gap:7px;margin-top:10px}
.quality-check{display:flex;justify-content:space-between;padding:7px 9px;background:var(--bg-subcard);border-radius:5px;font-size:11px}
.quality-check .pass{color:#287a45}.quality-check .fail{color:#a33}
.manual-review{display:grid;gap:10px;margin-top:14px;padding:12px;border:1px solid #c8d9eb;border-radius:7px;background:#f6faff}
.manual-review h3{font-size:13px;margin:0}
.manual-review p{margin:0;font-size:12px;line-height:1.55;color:var(--text-muted)}
.manual-review-checks{display:grid;gap:8px}
.manual-review-checks label{display:flex;align-items:flex-start;gap:7px;font-size:12px;line-height:1.45}
.manual-review-status{padding:10px;border-radius:5px;background:#f0f9f3;color:#25613a;font-size:12px;line-height:1.55;margin-top:10px}
.manual-review-status.rejected{background:#fef2f2;color:#991b1b}
.project-list{display:grid;gap:10px}
.project-list a{display:block;padding:14px 16px;border:1px solid var(--border-line);border-radius:8px;background:#fff;text-decoration:none;color:inherit;min-height:44px}
.project-list a:hover{border-color:var(--primary)}
.project-list strong{display:block;font-size:14px}
.project-list span{font-size:12px;color:var(--text-muted)}
.check-list{display:grid;gap:8px;font-size:12px;line-height:1.5}
.check-list .ok{color:#25613a}.check-list .bad{color:#991b1b}
.replace-panel{margin-top:10px;padding:10px;border:1px dashed var(--border-line);border-radius:7px;background:#fff}
.candidate{border:1px solid var(--border-light);border-radius:8px;padding:10px;margin-top:8px;font-size:12px}
.candidate.selected{border-color:#16a34a}
.qd{display:grid;gap:10px}
.qd-score{display:flex;align-items:center;gap:12px}
.qd-score strong{font-size:26px}
.qd-score .delta{font-size:13px;font-weight:700}
.delta.up{color:#287a45}.delta.down{color:#991b1b}
.qd-axes{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.qd-axis{display:flex;justify-content:space-between;gap:6px;padding:4px 8px;background:var(--bg-subcard);border-radius:5px;font-size:11px}
.qd-axis.low{background:#fef2f2;color:#991b1b;font-weight:700}
.qd-issue{padding:9px 10px;border-left:3px solid #d97706;background:#fff7ea;border-radius:5px;font-size:12px;line-height:1.55}
.qd-issue.high{border-left-color:#991b1b;background:#fef2f2}
.qd-issue .meta{font-size:11px;color:var(--text-muted);margin-bottom:4px}
.qd-decision{padding:9px 10px;border-radius:5px;font-size:12px;line-height:1.55}
.qd-decision.blocked{background:#fef2f2;color:#991b1b;font-weight:600}
.qd-decision.allowed{background:#f0f9f3;color:#25613a}
.qd-decision.neutral{background:var(--bg-subcard);color:var(--text-secondary)}
.qd-ref{border:1px dashed var(--border-line);border-radius:7px;padding:10px;font-size:12px;line-height:1.55;background:#fff}
.qd-ref-note{font-size:11px;color:#b45309;margin-bottom:6px}
@media(max-width:1024px){
  .wb-body{grid-template-columns:1fr}
  .wb-rail{border-left:0;border-top:1px solid var(--border)}
  .match-card,.scene-fields{grid-template-columns:1fr}
}
@media(max-width:760px){
  .wb-page{height:auto;overflow:auto}
  .wb-main{height:auto;min-height:100vh}
  .wb-body{overflow:visible}
  .wb-canvas,.wb-rail{overflow:visible}
}
</style>
</head>
<body class="wb-page">
<div class="app-layout" id="app"></div>
<div id="toastContainer" class="toast-container"></div>
<script src="/static/common.js?v=10"></script>
<script>
const PAGE_ID='video-project';
const params=new URLSearchParams(location.search);
const projectId=params.get('id');
const STAGES=[
  {id:'brief',label:'需求确认'},
  {id:'script',label:'脚本分镜'},
  {id:'match',label:'素材匹配'},
  {id:'voice',label:'配音字幕'},
  {id:'review',label:'生成验收'},
];
const VALID_STAGES=new Set(STAGES.map(s=>s.id));
let currentStage=VALID_STAGES.has(params.get('stage'))?params.get('stage'):'brief';
let project=null;
let job=null;
let mediaCapabilities={};
let projectPoller=null;
let projectPollFailures=0;
let matchSession=null;
let matchSegments=new Map();
let activeReplaceScene=-1;
let qualityFixes=false;
const MANUAL_PREVIEW_CHECKS=[
  ['hook_authentic','开头 Hook 有吸引力，且画面与热点事件相符'],
  ['no_repeat','没有重复使用同一来源或同一时间段的镜头'],
  ['image_transitions','图片过渡自然，没有造成突兀停顿'],
  ['subtitle_visibility','字幕位置合适，没有遮挡主体或关键信息'],
  ['audio_video_sync','TTS、字幕与画面节奏同步'],
  ['cta_natural','结尾 CTA 自然，不突兀、不误导']
];

function setStage(stage,{replace=false}={}){
  if(!VALID_STAGES.has(stage))return;
  if(stage!=='script')qualityFixes=false;
  currentStage=stage;
  const url=new URL(location.href);
  url.searchParams.set('stage',stage);
  if(projectId)url.searchParams.set('id',projectId);
  history[replace?'replaceState':'pushState']({},'',url);
  renderAll();
}

function projectShell(listMode=false){
  document.getElementById('app').innerHTML=`${renderSidebar(PAGE_ID)}
  <main class="wb-main">
    <header class="wb-header">
      <h1 id="projectTitle">${listMode?'视频项目':'视频工作台'}</h1>
      <p id="projectSubtitle">${listMode?'选择项目进入五阶段确认工作流':'系统自动生产 · 你只需确认关键节点'}</p>
    </header>
    <div class="card" style="border-left:4px solid var(--primary);margin:0 24px 12px;">
      <div class="card-body" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;">
        <span style="font-weight:600;">生产平台</span>
        <select id="platformRouteSelect" class="select" style="font-size:12px;padding:4px 8px;"
                onchange="onPlatformRouteChange(this.value)">
          ${PLATFORMS.map(p=>`<option value="${p.id}" ${getPlatformContext()===p.id?'selected':''}>${p.name}</option>`).join('')}
        </select>
        <span style="font-size:12px;color:var(--text-muted);">视频工作台只生产短视频（抖音竖屏流程）</span>
      </div>
    </div>
    ${listMode?'':`<nav class="wb-stages" id="stageNav" aria-label="视频生产阶段"></nav>
    <div class="wb-body">
      <section class="wb-canvas" id="canvas"></section>
      <aside class="wb-rail" id="rail"></aside>
    </div>
    <footer class="wb-footer">
      <button type="button" class="btn btn-secondary" id="secondaryAction" hidden></button>
      <button type="button" class="btn btn-primary" id="primaryAction">下一步</button>
    </footer>`}
    ${listMode?'<section class="wb-canvas" id="canvas"></section>':''}
  </main>`;
}

function stageIndex(id){return STAGES.findIndex(s=>s.id===id)}

function onPlatformRouteChange(id){
  setPlatformContext(id);
  if(id==='wechat_mp'){
    showToast('视频工作台只生产短视频（抖音竖屏）','info');
    return;
  }
  location.reload();
}

function renderStageNav(){
  const nav=document.getElementById('stageNav');
  if(!nav)return;
  const activeIdx=stageIndex(currentStage);
  nav.innerHTML=STAGES.map((stage,idx)=>{
    const cls=['wb-stage'];
    if(stage.id===currentStage)cls.push('active');
    if(idx<activeIdx)cls.push('done');
    return `<button type="button" class="${cls.join(' ')}" onclick="setStage('${stage.id}')"><span class="n">${idx+1}</span>${escapeHtml(stage.label)}</button>`;
  }).join('');
}

function payload(){return project?.current_revision?.payload||{}}
function scenes(){return Array.isArray(payload().scenes)?payload().scenes:[]}
function targetMs(){return Number(project?.target_duration_ms||payload().target_duration_ms||60000)}
function scriptReady(){
  const list=scenes();
  return list.length>=FORMAL_MIN_SCENES && list.length<=FORMAL_MAX_SCENES;
}
function awaitingScript(){
  const p=payload();
  return p.status==='awaiting_script' || (!scriptReady() && ['pending','running'].includes(job?.status));
}

function readSceneEditors(){
  const base=payload();
  return [...document.querySelectorAll('.scene-row')].map((row,index)=>{
    const durationSec=Number(row.querySelector('[data-field="duration"]')?.value||base.scenes?.[index]?.duration||5);
    return {
      ...(base.scenes?.[index]||{}),
      scene:index+1,
      visual:row.querySelector('[data-field="visual"]')?.value.trim()||'',
      voiceover:row.querySelector('[data-field="voiceover"]')?.value.trim()||'',
      text_overlay:row.querySelector('[data-field="subtitle"]')?.value.trim()||base.scenes?.[index]?.text_overlay||'',
      duration:durationSec,
      duration_ms:Math.round(durationSec*1000),
    };
  });
}

function currentPayloadFromForm(){
  const base=payload();
  const snap=project.source_snapshot||{};
  const voiceEl=document.getElementById('projectVoice');
  let tts_provider=base.tts_provider||snap.tts_provider;
  let voice=base.voice||snap.voice;
  if(voiceEl&&voiceEl.value){
    const selection=parseVoiceSelection(voiceEl.value);
    tts_provider=selection.tts_provider||tts_provider;
    voice=selection.voice||voice;
  }
  const speechRate=Number(document.getElementById('speechRate')?.value||base.speech_rate||1);
  return {
    ...base,
    title:document.getElementById('projectTitle')?.textContent||base.title,
    voice,
    tts_provider,
    speech_rate:speechRate,
    scenes:document.querySelectorAll('.scene-row').length?readSceneEditors():(base.scenes||[]),
  };
}

async function ensureCapabilities(){
  if(Object.keys(mediaCapabilities).length)return mediaCapabilities;
  try{const r=await apiFetch('/api/media/capabilities');mediaCapabilities=await r.json();}catch(e){mediaCapabilities={voice_options:defaultVoiceOptions()};}
  return mediaCapabilities;
}

function checklistHtml(items){
  return `<div class="check-list">${items.map(([ok,text])=>`<div class="${ok?'ok':'bad'}">${ok?'✓':'!'} ${escapeHtml(text)}</div>`).join('')}</div>`;
}

function renderBrief(){
  const snap=project.source_snapshot||{};
  const brief=payload().brief||{};
  const hooks=snap.matched_event_clip_ids||brief.approved_hook_event_ids||[];
  const topic=brief.logistics_topic||snap.topic||project.title||'—';
  document.getElementById('canvas').innerHTML=`
    <div class="wb-card">
      <h2>需求确认</h2>
      <dl class="wb-meta">
        <div><dt>主题</dt><dd>${escapeHtml(topic)}</dd></div>
        <div><dt>平台</dt><dd>${escapeHtml(project.platform||'douyin')}</dd></div>
        <div><dt>成片目标</dt><dd>60 秒（允许 50～90 秒）</dd></div>
        <div><dt>热点事件 Hook</dt><dd>${hooks.length?`已锁定 ${hooks.length} 段：${hooks.map(id=>'#'+escapeHtml(String(id))).join('、')}`:'等待 Hook 锁定'}</dd></div>
        <div><dt>生产条件</dt><dd>双素材库 · 7～10 镜正式分镜 · MiMo 优先配音</dd></div>
      </dl>
    </div>`;
  document.getElementById('rail').innerHTML=`
    <div class="wb-card"><h3>本步检查</h3>${checklistHtml([
      [true,'目标时长 60 秒'],
      [hooks.length>0,'热点 Hook 已锁定'],
      [project.platform==='douyin','平台为抖音竖屏'],
    ])}</div>`;
}

function renderScript(){
  const list=scenes();
  const fixesPanel=qualityFixes?renderQualityFixesPanel():'';
  if(awaitingScript()&&!list.length){
    document.getElementById('canvas').innerHTML=`${fixesPanel}<div class="wb-card"><h2>脚本分镜</h2><div class="empty-note">正式分镜正在后台规划（7～10 镜）。就绪后会自动显示，无需离开本页。</div></div>`;
  }else{
    document.getElementById('canvas').innerHTML=`
      ${fixesPanel}
      <div class="wb-card">
        <h2>脚本分镜</h2>
        <p class="project-subtitle" style="margin-bottom:12px">${escapeHtml(classifyDouyinScriptState({durationTarget:Math.round(targetMs()/1000),scenes:list,isFormalPlan:true}).label)}</p>
        <div class="scene-editor">${list.map((scene,index)=>`
          <article class="scene-row" data-index="${index}">
            <header><span>分镜 ${index+1}｜${escapeHtml(scene.scene_role||scene.evidence_type||'待匹配')}</span></header>
            <div class="scene-fields">
              <label>旁白<textarea class="input" data-field="voiceover">${escapeHtml(scene.voiceover||'')}</textarea></label>
              <label>字幕<textarea class="input" data-field="subtitle">${escapeHtml(scene.text_overlay||scene.subtitle||scene.voiceover||'')}</textarea></label>
              <label>时长(秒)<input class="input" type="number" min="2" max="20" step="0.5" data-field="duration" value="${escapeHtml(String(scene.duration||Math.round((scene.duration_ms||5000)/1000)))}"><textarea class="input" data-field="visual" hidden>${escapeHtml(scene.visual||'')}</textarea></label>
            </div>
          </article>`).join('')||'<div class="empty-note">暂无分镜</div>'}
        </div>
      </div>`;
  }
  const used=list.reduce((sum,s)=>sum+Number(s.duration_ms||(s.duration||5)*1000),0);
  const target=targetMs();
  const okCount=list.length>=FORMAL_MIN_SCENES&&list.length<=FORMAL_MAX_SCENES;
  const okDur=used>=FORMAL_MIN_DURATION_MS&&used<=FORMAL_MAX_DURATION_MS;
  document.getElementById('rail').innerHTML=`
    <div class="wb-card">
      <h3>时长预算</h3>
      <div class="stage-line"><strong>已用 ${(used/1000).toFixed(1)} 秒</strong><span>目标 ${(target/1000).toFixed(0)} 秒</span></div>
      <div class="project-progress"><i style="width:${Math.min(100,Math.round(used/target*100))}%"></i></div>
      ${checklistHtml([
        [okCount,`镜头数 ${list.length||0}（需 ${FORMAL_MIN_SCENES}～${FORMAL_MAX_SCENES}）`],
        [okDur||!list.length,`总时长落在 50～90 秒`],
      ])}
    </div>`;
}

function sceneSourceLabel(scene){
  if(scene.event_clip_id||scene.evidence_type==='hotspot_video'){
    const start=((scene.asset_start_ms||scene.start_ms||0)/1000).toFixed(1);
    const end=((scene.asset_end_ms||scene.end_ms||0)/1000).toFixed(1);
    return {tag:'热点 Hook',cls:'tag-hook',body:`事件片段 #${scene.event_clip_id||'—'} · ${start}–${end} 秒`};
  }
  if(scene.asset_id){
    const start=((scene.asset_start_ms||scene.start_ms||0)/1000).toFixed(1);
    const end=((scene.asset_end_ms||scene.end_ms||0)/1000).toFixed(1);
    return {tag:'Buffalo 自有',cls:'tag-owned',body:`素材 #${scene.asset_id}${scene.asset_segment_id?(' / 段 '+scene.asset_segment_id):''} · ${start}–${end} 秒`};
  }
  return {tag:'待匹配',cls:'tag-hook',body:'尚未绑定可用镜头'};
}

function renderMatch(){
  const list=scenes();
  if(!list.length){
    document.getElementById('canvas').innerHTML=`<div class="wb-card"><h2>素材匹配</h2><div class="empty-note">分镜就绪后将展示热点 Hook 与 Buffalo 自有素材的匹配结果。</div></div>`;
  }else{
    document.getElementById('canvas').innerHTML=`
      <div class="wb-card">
        <h2>素材匹配</h2>
        <div class="match-grid">${list.map((scene,index)=>{
          const src=sceneSourceLabel(scene);
          const reason=scene.match_reason||scene.match_rationale||(scene.evidence_type?`依据：${scene.evidence_type}`:'系统双素材自动匹配');
          const alt=scene.event_clip_id||scene.evidence_type==='hotspot_video'
            ? {tag:'Buffalo 自有',cls:'tag-owned',body:scene.owned_asset_id?`配套自有素材 #${scene.owned_asset_id}`:'同镜可替换为自有镜头'}
            : {tag:'热点 Hook',cls:'tag-hook',body:'同镜可引用已确认 Hook 片段'};
          return `<article class="match-card" data-scene="${index}">
            <div class="match-source"><span class="tag ${src.cls}">${src.tag}</span><div><strong>分镜 ${index+1}</strong><div>${escapeHtml(src.body)}</div><div style="margin-top:6px;color:var(--text-muted)">${escapeHtml((scene.voiceover||'').slice(0,80))}</div></div></div>
            <div class="match-source"><span class="tag ${alt.cls}">${alt.tag}</span><div>${escapeHtml(alt.body)}</div>
              <button type="button" class="btn btn-secondary btn-sm" style="margin-top:8px;min-height:44px" onclick="openReplacePanel(${index})">替换镜头</button>
            </div>
            <div class="match-reason">匹配依据：${escapeHtml(reason)}</div>
            <div class="replace-panel" id="replacePanel-${index}" hidden></div>
          </article>`;
        }).join('')}</div>
      </div>`;
  }
  const unmatched=list.filter(s=>!s.asset_id&&!s.event_clip_id).length;
  const gate=job?.quality_report?.gate;
  document.getElementById('rail').innerHTML=`
    <div class="wb-card">
      <h3>匹配检查</h3>
      ${checklistHtml([

async function openReplacePanel(index){

const QD_AXES=[['prompt_alignment','提示词一致'],['visual_quality','画质'],['character_consistency','主体一致'],['product_consistency','产品一致'],['temporal_consistency','时序连贯'],['motion_quality','运动质量'],['camera_quality','镜头质量'],['subtitle_audio_quality','字幕音频'],['storytelling','叙事'],['platform_suitability','平台适配']];
function qualityDiagnostics(){
  const report=job?.quality_report||{};
  const evaluation=report.video_evaluation;
  if(!evaluation||evaluation.overall_score===undefined||evaluation.overall_score===null)return null;
  const decision=report.regeneration_decision||{};
  const score=Number(evaluation.overall_score);
  const failed=!(evaluation.passed===true)||score<80||evaluation.evaluation_status!=='completed';
  const blockedReason=['maximum_attempts_reached','no_meaningful_improvement','actionable_axes_healthy'].includes(decision.reason)?decision.reason:null;
  return {evaluation,decision,score,failed,blockedReason};
}
function renderDiagnosticsDecision(diag){
  if(!diag||!diag.failed)return '';
  const d=diag.decision;const reason=d.reason||'';
  const delta=d.score_delta!=null?`（上次 ${Number(d.previous_score).toFixed(0)} → 本次 ${diag.score.toFixed(0)}，Δ ${(d.score_delta>=0?'+':'')+d.score_delta}）`:'';
  if(diag.blockedReason){
    if(reason==='actionable_axes_healthy'){
      return `<div class="qd-decision blocked">可改轴已达标，本片失分主要在画面素材本身，重生成难改善——建议人工复核或换素材/话题${delta}</div>`;
    }
    const label=reason==='maximum_attempts_reached'?'已达重生成上限（2 次）':'重跑提升不足 3 分';
    return `<div class="qd-decision blocked">${label}：已禁用继续重生成，请人工复核或换选题${delta}</div>`;
  }
  if(reason==='score_declined')return `<div class="qd-decision blocked">本次分数低于上次${delta}；继续重生成前请先按建议修改</div>`;
  if(reason==='manual_regeneration_allowed')return `<div class="qd-decision allowed">护栏通过，可按质检建议重生成${delta}</div>`;
  return `<div class="qd-decision neutral">判定：${escapeHtml(d.action||'-')} · ${escapeHtml(reason||'-')}${escapeHtml(delta)}</div>`;
}
function renderDiagnosticsPanel(){
  const diag=qualityDiagnostics();
  if(!diag)return '';
  const {evaluation,decision}=diag;
  const scores=evaluation.scores||{};
  const issues=evaluation.issues||[];
  const axesHtml=QD_AXES.filter(([key])=>scores[key]!==undefined).map(([key,label])=>{
    const value=Number(scores[key]);
    return `<div class="qd-axis${value<80?' low':''}"><span>${label}</span><strong>${value.toFixed(0)}</strong></div>`;
  }).join('');
  const issuesHtml=issues.map(issue=>`<div class="qd-issue${issue.severity==='high'?' high':''}"><div class="meta">${escapeHtml(issue.severity||'')} · ${escapeHtml(issue.category||'')} · ${Number(issue.start_second||0).toFixed(1)}–${Number(issue.end_second||0).toFixed(1)}s</div><div>${escapeHtml(issue.description||'')}</div><div style="margin-top:5px"><strong>建议：</strong>${escapeHtml(issue.suggested_fix||'')}</div></div>`).join('');
  return `<div class="wb-card" style="margin-top:12px"><h2>AI 质检诊断</h2><div class="qd">
    <div class="qd-score"><strong>${diag.score.toFixed(0)}</strong><span>/100 · ${evaluation.passed?'通过':'未达 80 分线'}</span>${decision.weighted_actionable_score!=null?`<span title="仅计字幕音频/提示词一致/叙事/平台适配四个重生成改得动的轴">可改轴加权分 ${Number(decision.weighted_actionable_score).toFixed(0)} / 100 · 衡量重生成能改善多少</span>`:''}${decision.score_delta!=null?`<span class="delta ${decision.score_delta>=0?'up':'down'}">Δ ${(decision.score_delta>=0?'+':'')+decision.score_delta} vs 上次</span>`:''}</div>
    ${diag.failed?renderDiagnosticsDecision(diag):''}
    ${axesHtml?`<div class="qd-axes">${axesHtml}</div>`:''}
    ${issuesHtml||'<div class="empty-note">质检未列出具体问题</div>'}
  </div></div>`;
}
function renderQualityFixesPanel(){
  const diag=qualityDiagnostics();
  if(!diag||!diag.failed)return '';
  const issues=diag.evaluation.issues||[];
  return `<div class="wb-card"><h2>质检修改建议（改完点击下方重生成）</h2>
    ${renderDiagnosticsDecision(diag)}
    <div class="qd" style="margin-top:10px">${issues.map(issue=>`<div class="qd-issue${issue.severity==='high'?' high':''}"><div class="meta">${Number(issue.start_second||0).toFixed(1)}–${Number(issue.end_second||0).toFixed(1)}s · ${escapeHtml(issue.category||'')}</div><div>${escapeHtml(issue.description||'')}</div><div style="margin-top:5px"><strong>建议：</strong>${escapeHtml(issue.suggested_fix||'')}</div></div>`).join('')||'<div class="empty-note">无逐条建议，请按诊断轴低分项调整脚本与素材</div>'}</div>
    <p style="font-size:12px;color:var(--text-muted)">本管线无文生视频：请改旁白/字幕/时长或到素材匹配阶段换镜头，不要只改提示词。</p>
  </div>`;
}

function isManualReviewEligible(){
  const report=job?.quality_report||{};const publication=report.publication||{};const technical=report.preview_quality||{};const checks=technical.checks||{};
  const required=['expected_resolution','has_audio','duration_aligned','has_timed_subtitles','no_repeated_source_or_range','final_subtitle_timeline_aligned','transition_audio_video_sync'];
  const technicalPassed=technical.status==='passed'&&required.every(name=>checks[name]===true);
  return (job?.status==='succeeded'&&publication.review_mode==='manual_preview')||(job?.status==='needs_review'&&job?.stage==='preview_quality_check'&&technicalPassed)||Boolean(report.manual_review);
}

function renderManualPreviewReview(manualReview){
  if(!isManualReviewEligible())return '';
  if(manualReview?.status==='accepted'){
    return `<section class="manual-review-status"><strong>人工验收已记录</strong><div>${escapeHtml(manualReview.reviewed_at||'')}｜${escapeHtml(manualReview.reviewer?.username||'当前用户')}</div><div>该结论仅适用于内部预览；系统仍保持不可发布。</div></section>`;

  if(manualReview?.status==='rejected'){
    return `<section class="manual-review-status rejected"><strong>人工验收未通过</strong><div>${escapeHtml(manualReview.reviewed_at||'')}｜${escapeHtml(manualReview.note||'未填写原因')}</div></section>`;
  }
  return `<section class="manual-review"><h3>人工验收</h3><p>请完整观看预览后逐项确认；确认只会记录内部验收，不会发布。</p><div class="manual-review-checks">${MANUAL_PREVIEW_CHECKS.map(([key,label])=>`<label><input type="checkbox" data-manual-review="${key}"> <span>${label}</span></label>`).join('')}</div><label class="project-subtitle" for="manualReviewNote">验收备注（可选）</label><textarea class="input" id="manualReviewNote" placeholder="例如：第二段图片转场自然"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" style="min-height:44px" onclick="submitManualPreviewReview('accept')">确认人工验收（不发布）</button><button class="btn btn-secondary btn-sm" style="min-height:44px" onclick="submitManualPreviewReview('reject')">记录为未通过</button></div></section>`;
}

function gatedDownload(url,label){
  if(!url)return '';
  return `<a class="btn btn-primary btn-sm" style="margin-top:10px;min-height:44px" href="${escapeHtml(url)}" download>${escapeHtml(label)}</a>`;

function renderReview(){
  const status=job?.status||'draft';
  const progress=Number(job?.progress||0);
  const pausedMatch=status==='needs_review'&&job?.stage==='match_quality_check';
  const manuallyAccepted=job?.quality_report?.manual_review?.status==='accepted';
  const renderProgress=job?.quality_report?.render_progress;
  const failReason=job?.error_message||'';
  const stage=status==='failed'
    ? `${VIDEO_STAGE_LABELS[job?.stage]||job?.stage||'生成'}失败`
    : (manuallyAccepted?'人工验收已记录（未发布）':(pausedMatch?'匹配质量不足，等待人工处理':(renderProgress?.stage||VIDEO_STAGE_LABELS[job?.stage]||job?.stage||'等待生成')));
  const publication=job?.quality_report?.publication;
  const manualReview=job?.quality_report?.manual_review;
  const internalPreview=publication?.tier==='internal_preview';
  const publishAllowed=publication?.publish_allowed===true;
  const issues=[...new Set(job?.quality_report?.gate?.issues||[])];
  const adjustments=job?.quality_report?.automatic_adjustments||[];
  const preview=job?.preview_url&&job.preview_url!==job.output_url?`<h3>低清预览</h3><video src="${escapeHtml(job.preview_url)}" controls></video>${renderQuality(job.quality_report?.preview_quality)}`:'';
  const outputLabel=internalPreview?'内部测试预览':'高清成片';
  const outputDownload=internalPreview?'下载内部预览':'下载 MP4';
  const output=job?.output_url?`<h3 style="margin-top:14px">${outputLabel}</h3><video src="${escapeHtml(job.output_url)}" controls></video>${gatedDownload(job.output_url,outputDownload)}${renderQuality(internalPreview?job.quality_report?.preview_quality:job.quality_report?.final_quality)}`:'';
  document.getElementById('canvas').innerHTML=`
    <div class="wb-card media-box">
      <h2>生成验收</h2>
      <div class="stage-line"><strong>${escapeHtml(stage)}</strong><span>${escapeHtml(status)} · ${progress}%</span></div>
      <div class="project-progress"><i style="width:${progress}%"></i></div>
      ${preview+output||'<div class="empty-note">通过质量检查后会显示预览和成片</div>'}
      ${formatRenderProvenance(job?.quality_report,scenes())}
      ${renderManualPreviewReview(manualReview)}
      ${renderDiagnosticsPanel()}
    </div>`;
  
  // P3: 渲染完成后显示"去内容编辑器 + 加入发布队列"按钮
  const primaryActionBtn = document.getElementById('primaryAction');
  if (status === 'succeeded' && job?.output_url && !internalPreview) {
    const enqueueContainer = document.createElement('div');
    enqueueContainer.className = 'wb-card';
    enqueueContainer.innerHTML = `
      <h3 style="margin-bottom:12px;font-size:14px;color:#25613a">📤 发布入口</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="toEditorBtn" class="btn btn-primary" style="min-height:44px;min-width:180px"
          onclick="location.href='/editor.html?video_project_id=' + encodeURIComponent(project?.id || '')">
          去内容编辑器（写文案·选标签·发布）
        </button>
        <button id="enqueueBtn" class="btn btn-secondary" style="min-height:44px;min-width:150px" onclick="enqueueToPublishQueue()">
          加入发布队列
        </button>
      </div>
    `;
    const canvasDiv = document.getElementById('canvas');
    canvasDiv.appendChild(enqueueContainer);
  }
  document.getElementById('rail').innerHTML=`
    <div class="wb-card">
      <h3>待确认问题</h3>
      ${adjustments.length?`<div class="adjustment-note"><strong>系统已自动调整</strong><div>${adjustments.map(escapeHtml).join('；')}</div></div>`:''}
      ${status==='failed'&&failReason?`<div class="issue"><strong>失败原因</strong><div>${escapeHtml(failReason)}</div></div>`:''}
      ${issues.length?issues.slice(0,5).map(i=>`<div class="issue">${escapeHtml(i)}</div>`).join('')+'':''}
      ${!issues.length&&!adjustments.length&&!(status==='failed'&&failReason)?'<div class="empty-note">当前没有需要人工处理的问题</div>':''}
      ${!publishAllowed&&(internalPreview||manualReview)?'<div class="match-score-note"><strong>内部验收文件</strong>：不可进入发布队列。</div>':''}
    </div>`;
}

function primaryActionConfig(){
  if(currentStage==='brief')return {label:'确认需求，进入分镜',run:()=>setStage('script')};
  if(currentStage==='script'){if(qualityFixes)return {label:'保存并按建议重生成',run:resumeWithQualityFixes};return {label:'保存并进入素材',run:async()=>{await saveRevision();setStage('match');}};}
  if(currentStage==='match')return {label:'确认匹配，进入配音',run:()=>setStage('voice')};
  if(currentStage==='voice')return {label:'保存音色，进入验收',run:async()=>{await saveRevision();setStage('review');}};
  // review
  const status=job?.status||'draft';
  const manualReview=job?.quality_report?.manual_review;
  if(!job)return {label:'开始生成',run:startGeneration};
  if(['pending','running','cancel_requested'].includes(status))return {label:status==='cancel_requested'?'正在取消…':'取消生成',run:cancelFromProject,secondary:true,disabled:status==='cancel_requested'};
  if(status==='needs_review'&&manualReview?.status==='accepted'){
    return {label:'生成高清成片（不发布）',run:finalizeManualReview};
  }
  if(status==='needs_review'&&job?.quality_report?.publication?.review_mode==='manual_preview')return {label:'结束任务',run:cancelFromProject,secondary:true};
  if(status==='needs_review'){
    const diag=qualityDiagnostics();
    if(diag?.failed&&diag.blockedReason){
      if(diag.blockedReason==='actionable_axes_healthy'){
        return {label:'可改轴已达标，重生成难改善',run:()=>{},disabled:true};
      }
      return {label:diag.blockedReason==='maximum_attempts_reached'?'已达重生成上限':'重跑提升不足，已禁用',run:()=>{},disabled:true};
    }
    if(diag?.failed)return {label:'按质检建议重生成',run:openQualityFixMode};
    return {label:'按当前规则重新生成',run:continueGeneration};
  }
  if(status==='succeeded'&&job?.quality_report?.publication?.review_mode==='manual_preview'&&manualReview?.status==='rejected')return {label:'修改后重新生成',run:regenerateFromManualReview};
  if(['failed','canceled'].includes(status))return {label:'重新生成',run:retryGeneration};
  return {label:'已完成',run:()=>{},disabled:true};
}

function renderFooter(){
  const cfg=primaryActionConfig();
  const btn=document.getElementById('primaryAction');
  const secondary=document.getElementById('secondaryAction');
  if(!btn)return;
  btn.textContent=cfg.label;
  btn.disabled=Boolean(cfg.disabled);
  btn.className=cfg.secondary?'btn btn-secondary':'btn btn-primary';
  btn.onclick=()=>cfg.run();

    if(['pending','running'].includes(job?.status)&&currentStage==='review'){
      secondary.hidden=false;
      secondary.textContent='刷新进度';
      secondary.onclick=()=>loadJob();
    }else{
      secondary.hidden=true;
    }
  }
}

function renderAll(){
  if(!project)return;
  document.getElementById('projectTitle').textContent=project.title||'视频工作台';
  const brief=payload().brief||{};
  if(brief.angle||brief.logistics_topic){
    document.getElementById('projectSubtitle').textContent=`动态选题：${brief.angle||brief.logistics_topic}`;

async function saveRevision(){
  const response=await apiFetch(`/api/video-projects/${project.id}/revision`,{
    method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({payload:currentPayloadFromForm()}),
  });
  const revision=await response.json();
  project.current_revision=revision;
  project.current_revision_id=revision.id;
  showToast('已保存');
}

async function startGeneration(){
  try{
    // 先保存工作台当前选择；否则用户切到 MiniMax 后直接生成时，后端仍会读取旧 revision 的 MiMo。
    await saveRevision();
    const response=await apiFetch(`/api/video-projects/${project.id}/generate`,{method:'POST'});
    const result=await response.json();
    job=result.job;project.active_job_id=job.id;renderAll();startPolling();refreshVideoTaskBadge();
  }catch(error){showToast(error.message,'error');}
}
async function continueGeneration(){
  try{
    const response=await apiFetch(`/api/video-generation/jobs/${job.id}/resume`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({payload:currentPayloadFromForm()})});
    const result=await response.json();job=result.job;project.active_job_id=job.id;project.current_revision=result.revision;qualityFixes=false;renderAll();startPolling();refreshVideoTaskBadge();
  }catch(error){showToast(error.message,'error');}
}
function openQualityFixMode(){
  qualityFixes=true;
  setStage('script');
  showToast('已带入质检修改建议，改完脚本后点下方重生成');
}
async function resumeWithQualityFixes(){
  await saveRevision();
  await continueGeneration();
}
async function retryGeneration(){
  try{
    // 重试也必须使用当前 revision，尤其是用户刚把 TTS 从 MiMo 切到 MiniMax 的场景。
    await saveRevision();
    await startGeneration();
  }catch(error){showToast(error.message,'error');}
}
async function cancelFromProject(){await cancelVideoGeneration(job.id);await loadJob();}
async function regenerateFromManualReview(){await saveRevision();await startGeneration();}
async function finalizeManualReview(){
  try{const response=await apiFetch(`/api/video-generation/jobs/${job.id}/manual-finalize`,{method:'POST'});const result=await response.json();job=result.job;renderAll();startPolling();refreshVideoTaskBadge();showToast('已进入高清成片渲染，不会发布');}catch(error){showToast(error.message,'error');}
}
async function submitManualPreviewReview(action){
  const checklist=Object.fromEntries(MANUAL_PREVIEW_CHECKS.map(([key])=>[key,document.querySelector(`[data-manual-review="${key}"]`)?.checked===true]));
  if(action==='accept'&&Object.values(checklist).some(checked=>!checked)){showToast('请先逐项完成预览验收','error');return;}
  const note=document.getElementById('manualReviewNote')?.value.trim()||'';
  try{
    const response=await apiFetch(`/api/video-generation/jobs/${job.id}/manual-review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,checklist,note})});
    const result=await response.json();job=result.job;renderAll();showToast(action==='accept'?'人工验收已记录，未触发发布':'已记录未通过');
  }catch(error){showToast(error.message,'error');}
}

async function loadJob(){
  if(!project?.active_job_id){job=null;renderAll();return;}
  try{
    const response=await apiFetch(`/api/video-generation/jobs/${project.active_job_id}`);
    job=await response.json();projectPollFailures=0;renderAll();
    if(['pending','running','cancel_requested'].includes(job.status))startPolling();
    if(awaitingScript()||!scriptReady()){
      const fresh=await apiFetch(`/api/video-projects/${project.id}`);
      project=await fresh.json();
      renderAll();
    }
  }catch(error){
    projectPollFailures++;
    if(projectPollFailures>=3){
      if(projectPoller)clearInterval(projectPoller);projectPoller=null;
      showToast('本地服务已断开，请重启 8080 后刷新页面','error');
    }
  }
}

// P3: 加入发布队列
async function enqueueToPublishQueue(){
  if(!project?.id){showToast('项目 ID 无效','error');return;}
  try{
    const jobOutput = job?.output_path || '';
    const payload={
      title: project.title || '',
      body: (scenes()||[]).map(s=>String(s.voiceover||'').trim()).filter(Boolean).join('\n'),
      platforms:[project?.platform || 'douyin'],
      account_targets:{},
      status:'queued',
      video_project_id: project.id,
      revision_id: project.current_revision_id || job?.revision_id,
      video_path: jobOutput,
      idempotency_key: `queue:${project.id}:${project.current_revision_id || job?.revision_id || 'rev'}:${project.platform || 'douyin'}`,
      attachments: jobOutput ? [{type:'video', path: jobOutput}] : [],
    };
    const response=await apiFetch('/api/queue',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload),
    });
    const result=await response.json();
    if(response.ok){
      const queueId=(result.queue_ids||[])[0];
      showToast('已加入发布队列，请确认后再发布');
      setTimeout(()=>{
        location.href = queueId ? `/queue.html?highlight=${encodeURIComponent(queueId)}` : '/queue.html';
      },400);
    }else{
      showToast('❌ '+(result.detail||'入队失败'),'error');
    }
  }catch(error){
    showToast('❌ 加入失败：'+error.message,'error');
  }
}

function startPolling(){
  if(projectPoller)clearInterval(projectPoller);
  projectPoller=setInterval(async()=>{
    await loadJob();
    if(!job||!['pending','running','cancel_requested'].includes(job.status)){
      clearInterval(projectPoller);projectPoller=null;
    }
  },2000);
}

async function renderProjectList(){
  projectShell(true);
  const canvas=document.getElementById('canvas');
  canvas.innerHTML='<div class="empty-note">加载项目列表…</div>';
  try{
    const response=await apiFetch('/api/video-projects?limit=40');
    const items=await response.json();
    if(!items.length){
      canvas.innerHTML='<div class="wb-card"><div class="empty-note">还没有视频项目。请从 AI 对话创建 60 秒视频项目。</div><p style="text-align:center"><a class="btn btn-primary" style="min-height:44px" href="/chat.html">前往 AI 对话</a></p></div>';
      return;
    }
    canvas.innerHTML=`<div class="project-list">${items.map(item=>`
      <a href="/video-project.html?id=${encodeURIComponent(item.id)}&stage=brief">
        <strong>${escapeHtml(item.title||'未命名视频项目')}</strong>
        <span>${escapeHtml(item.status||'')} · ${Math.round(Number(item.target_duration_ms||60000)/1000)} 秒 · ${escapeHtml(item.updated_at||item.created_at||'')}</span>
      </a>`).join('')}</div>`;
  }catch(error){
    canvas.innerHTML=`<div class="match-score-note">${escapeHtml(error.message)}</div>`;
  }
}

async function init(){
  if(!projectId){await renderProjectList();return;}
  projectShell(false);
  try{
    await ensureCapabilities();
    const response=await apiFetch(`/api/video-projects/${projectId}`);
    project=await response.json();
    if(isLegacyVideoDraft(project)){
      location.replace(`/video-migrate.html?id=${encodeURIComponent(project.id)}`);
      return;
    }
    renderAll();
    await loadJob();
  }catch(error){showToast(error.message,'error');}
}
window.addEventListener('popstate',()=>{
  const stage=new URLSearchParams(location.search).get('stage');
  if(VALID_STAGES.has(stage)){currentStage=stage;renderAll();}
});
init();
</script>

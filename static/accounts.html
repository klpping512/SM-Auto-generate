<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg?v=5"/>
<link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico?v=5"/>
<link rel="apple-touch-icon" href="/static/icons/icon-180.png?v=5"/>
<link rel="manifest" href="/static/manifest.json?v=5"/>
<meta name="theme-color" content="#B98A4C"/>
<title>账号管理 - SA-LogiFlow</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="/static/design-system.css?v=5"/>
</head>
<body>
<div class="app-layout" id="app"></div>
<div id="toastContainer" class="toast-container"></div>
<script src="/static/common.js?v=5"></script>
<script>
const PAGE_ID = 'accounts';
const platformNames = { xiaohongshu:'小红书',douyin:'抖音',facebook:'Facebook',twitter:'Twitter',reddit:'Reddit' };
const platformIcons = { xiaohongshu:'simple-icons:xiaohongshu',douyin:'ri:tiktok-fill',facebook:'ri:facebook-box-fill',twitter:'ri:twitter-x-fill',reddit:'ri:reddit-fill' };
const platformColors = { xiaohongshu:'#FF2442',douyin:'#000',facebook:'#1877F2',twitter:'#1DA1F2',reddit:'#FF4500' };
const requiredFields = {
    facebook: [['page_id','主页 ID'],['page_access_token','主页访问令牌 (Page Access Token)']],
    twitter:  [['access_token','用户访问令牌 (OAuth2 access_token)']],
    reddit:   [['client_id','App Client ID'],['client_secret','App Client Secret'],
               ['refresh_token','Refresh Token'],['user_agent','User-Agent'],['subreddit','目标 Subreddit']],
    xiaohongshu: [], douyin: [],
};

let accounts = [];
let filterPlatform = '';
let pubStatus = { adapters: {}, supported_platforms: [] };

async function init() {
    const [ra, rs] = await Promise.all([apiFetch('/api/accounts'), apiFetch('/api/publish/status')]);
    accounts = await ra.json();
    pubStatus = await rs.json();
    render();
}

function render() {
    const filtered = filterPlatform ? accounts.filter(a => a.platform === filterPlatform) : accounts;
    document.getElementById('app').innerHTML = `
    ${renderSidebar(PAGE_ID)}
    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title">账号管理</h1>
            <button class="btn btn-primary btn-sm" onclick="showAddModal()"><iconify-icon icon="mdi:plus" width="16"></iconify-icon> 绑定新账号</button>
        </div>
        <div class="page-body">
            <div class="card" style="margin-bottom:16px;"><div class="card-body" style="display:flex;gap:16px;flex-wrap:wrap;">
                ${Object.keys(platformNames).map(pf => {
                    const hasAdapter = (pf in (pubStatus.adapters||{}));
                    const readyCount = accounts.filter(a => a.platform===pf && a.ready).length;
                    const total = accounts.filter(a => a.platform===pf).length;
                    return `<div style="min-width:120px;"><div style="font-size:12px;color:var(--text-muted);">${platformNames[pf]}</div>
                        <div style="font-size:13px;font-weight:600;color:${hasAdapter ? (readyCount>0?'#10B981':'#F59E0B') : '#EF4444'};">
                        ${hasAdapter ? `就绪 ${readyCount}/${total}` : '无适配器'}</div></div>`;
                }).join('')}
            </div></div>
            <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
                <button class="btn ${!filterPlatform ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="filterPlatform='';render();">全部</button>
                ${Object.entries(platformNames).map(([k, v]) => `<button class="btn ${filterPlatform === k ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="filterPlatform='${k}';render();">${v}</button>`).join('')}
            </div>
            <div class="card">
                <div class="card-body" style="padding:0;">
                    <table class="data-table">
                        <thead><tr><th>平台 & 账号</th><th>状态</th><th>配置摘要</th><th>最后同步</th><th style="text-align:right;">操作</th></tr></thead>
                        <tbody>
                            ${filtered.length === 0 ? '<tr><td colspan="5" class="empty-state">暂无账号</td></tr>' :
                            filtered.map(a => {
                                const p = { icon: platformIcons[a.platform] || 'mdi:help', color: platformColors[a.platform] || '#6B7280', name: platformNames[a.platform] || a.platform };
                                return `<tr>
                                    <td><div style="display:flex;align-items:center;gap:10px;">
                                        <div style="width:32px;height:32px;border-radius:var(--radius-md);background:${p.color}15;color:${p.color};display:flex;align-items:center;justify-content:center;"><iconify-icon icon="${p.icon}" width="18"></iconify-icon></div>
                                        <div><div style="font-weight:600;font-size:13px;">${escapeHtml(a.name)}</div><div style="font-size:11px;color:var(--text-muted);">ID: ${escapeHtml(a.account_id)}</div></div>
                                    </div></td>
                                    <td>
                                        <span style="display:flex;align-items:center;gap:4px;font-size:12px;">
                                          <span style="width:6px;height:6px;border-radius:50%;background:${a.status==='expired' ? '#EF4444' : (a.ready ? '#10B981' : '#F59E0B')};"></span>
                                          ${a.status==='expired' ? '已过期' : (a.ready ? '就绪' : '缺凭据')}
                                        </span>
                                        ${a.ready ? '' : `<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">缺: ${escapeHtml((a.missing||[]).join(', '))}</div>`}
                                    </td>
                                    <td style="font-size:12px;color:var(--text-secondary);">${escapeHtml(a.config_summary) || '-'}</td>
                                    <td style="font-size:12px;color:var(--text-muted);">${escapeHtml(a.last_sync) || '-'}</td>
                                    <td style="text-align:right;">
                                        ${a.credential_kind==='token' ? `<button class="btn btn-ghost btn-sm" title="填写凭据" onclick="openCredModal(${a.id},'${a.platform}')"><iconify-icon icon="mdi:key-outline" width="16"></iconify-icon></button>` : ''}
                                        ${a.credential_kind==='cookie' && a.status!=='expired' ? `<button class="btn btn-ghost btn-sm" title="连接账号" onclick="openWizard(${a.id},'${a.platform}')"><iconify-icon icon="mdi:qrcode-scan" width="16"></iconify-icon></button>` : ''}
                                        ${a.status==='expired' && a.credential_kind==='cookie' ? `<button class="btn btn-ghost btn-sm" style="color:var(--error);" title="重新连接" onclick="openWizard(${a.id},'${a.platform}')"><iconify-icon icon="mdi:login-variant" width="16"></iconify-icon></button>` : ''}
                                        ${a.ready ? `<button class="btn btn-ghost btn-sm" title="测试连接" onclick="testConnection(${a.id})"><iconify-icon icon="mdi:lan-connect" width="16"></iconify-icon></button>` : ''}
                                        <button class="btn btn-ghost btn-sm" style="color:var(--error);" onclick="deleteAccount(${a.id})"><iconify-icon icon="mdi:delete-outline" width="16"></iconify-icon></button>
                                    </td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div id="addModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;">
        <div class="card" style="width:440px;padding:24px;max-height:85vh;overflow:auto;">
            <h3 id="addModalTitle" style="font-size:16px;font-weight:700;margin-bottom:16px;">连接新账号</h3>
            <div id="addStepInfo" style="display:flex;gap:6px;margin-bottom:16px;">
                <div id="addStep1Tag" style="padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;background:var(--primary);color:white;">1 基本信息</div>
                <div id="addStep2Tag" style="padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;background:var(--bg-secondary);color:var(--text-muted);">2 连接</div>
                <div id="addStep3Tag" style="padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;background:var(--bg-secondary);color:var(--text-muted);">3 完成</div>
            </div>
            <div id="addStep1Content" style="display:flex;flex-direction:column;gap:12px;">
                <div><label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:block;">选择平台</label>
                    <select id="newPlatform" class="select" style="width:100%;" onchange="onPlatformChange()">
                        ${Object.entries(platformNames).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}
                    </select></div>
                <div id="platformHint" style="font-size:11px;color:var(--text-muted);padding:8px 12px;background:var(--bg-secondary);border-radius:var(--radius-md);">
                    选择小红书或抖音后，将通过扫码方式连接账号
                </div>
                <div id="nameField"><label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:block;">账号名称</label><input id="newName" class="input" placeholder="如: SA物流达人"/></div>
                <div id="idField"><label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:block;">账号 ID</label><input id="newAccountId" class="input" placeholder="自动生成"/></div>
            </div>
            <div id="addStep2Content" style="display:none;"></div>
            <div id="addStep3Content" style="display:none;text-align:center;padding:20px 0;"></div>
            <div id="addStep1Btns" style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;">
                <button class="btn btn-secondary btn-sm" onclick="closeAddModal()">取消</button>
                <button class="btn btn-primary btn-sm" id="addStep1NextBtn" onclick="addStep1Next()">扫码连接</button>
            </div>
            <div id="addStep2Btns" style="display:none;justify-content:flex-end;gap:8px;margin-top:20px;">
                <button class="btn btn-secondary btn-sm" onclick="closeAddModal()">取消</button>
            </div>
            <div id="addStep3Btns" style="display:none;justify-content:flex-end;gap:8px;margin-top:20px;">
                <button class="btn btn-primary btn-sm" onclick="closeAddModal();init();">完成</button>
            </div>
        </div>
    </div>
    <div id="credModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;">
        <div class="card" style="width:440px;padding:24px;max-height:80vh;overflow:auto;">
            <h3 style="font-size:16px;font-weight:700;margin-bottom:4px;">填写凭据</h3>
            <p id="credHint" style="font-size:12px;color:var(--text-muted);margin-bottom:16px;"></p>
            <div id="credFields" style="display:flex;flex-direction:column;gap:12px;"></div>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;">
                <button class="btn btn-secondary btn-sm" onclick="closeCredModal()">取消</button>
                <button class="btn btn-primary btn-sm" onclick="saveCredentials()">保存</button>
            </div>
        </div>
    </div>
    <div id="wizardModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;">
        <div class="card" style="width:480px;padding:24px;">
            <h3 id="wizardTitle" style="font-size:16px;font-weight:700;margin-bottom:20px;">连接账号</h3>
            <div id="wizardSteps" style="display:flex;gap:4px;margin-bottom:20px;"></div>
            <div id="wizardBody" style="min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;"></div>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;">
                <button class="btn btn-secondary btn-sm" id="wizardCancel" onclick="closeWizard()">取消</button>
                <button class="btn btn-primary btn-sm" id="wizardNext" style="display:none;" onclick="wizardNextStep()">下一步</button>
            </div>
        </div>
    </div>`;
}

const connectFlows = {
    xiaohongshu: {
        title: '连接小红书',
        steps: [
            { icon: 'mdi:cellphone', title: '准备', desc: '请确保手机已安装小红书 APP，并准备好扫码' },
            { icon: 'mdi:qrcode-scan', title: '扫码登录', desc: '浏览器将弹出小红书登录页，请用 APP 扫描二维码' },
            { icon: 'mdi:check-circle', title: '完成', desc: '登录成功，Cookie 已保存' },
        ],
    },
    douyin: {
        title: '连接抖音',
        steps: [
            { icon: 'mdi:cellphone', title: '准备', desc: '请确保手机已安装抖音 APP，并准备好扫码' },
            { icon: 'mdi:qrcode-scan', title: '扫码登录', desc: '浏览器将弹出抖音登录页，请用 APP 扫描二维码' },
            { icon: 'mdi:check-circle', title: '完成', desc: '登录成功，Cookie 已保存' },
        ],
    },
};

let wizardAccountId = null;
let wizardStep = 0;
let wizardPlatform = '';
let wizardPollTimer = null;

function openWizard(id, platform) {
    const flow = connectFlows[platform];
    if (!flow) { scanLogin(id); return; }
    wizardAccountId = id; wizardStep = 0; wizardPlatform = platform;
    document.getElementById('wizardTitle').textContent = flow.title;
    // 渲染步骤条
    document.getElementById('wizardSteps').innerHTML = flow.steps.map((s, i) => `
        <div style="flex:1;text-align:center;padding:8px 4px;border-radius:8px;background:${i===0?'var(--primary-light)':'transparent'};">
            <iconify-icon icon="${s.icon}" width="20" style="color:${i===0?'var(--primary)':'var(--text-muted)'};"></iconify-icon>
            <div style="font-size:10px;color:${i===0?'var(--primary)':'var(--text-muted)'};margin-top:4px;">${s.title}</div>
        </div>
    `).join('');
    renderWizardStep();
    document.getElementById('wizardModal').style.display = 'flex';
}

function renderWizardStep() {
    const flow = connectFlows[wizardPlatform];
    const step = flow.steps[wizardStep];
    const body = document.getElementById('wizardBody');
    const nextBtn = document.getElementById('wizardNext');
    // 高亮当前步骤
    document.getElementById('wizardSteps').children[wizardStep]?.querySelectorAll('*').forEach(el => {
        el.style.color = 'var(--primary)';
    });
    if (wizardStep === 0) {
        body.innerHTML = `<iconify-icon icon="${step.icon}" width="40" style="color:var(--primary);"></iconify-icon>
            <p style="font-size:13px;color:var(--text-secondary);text-align:center;">${step.desc}</p>`;
        nextBtn.textContent = '开始扫码';
        nextBtn.style.display = '';
    } else if (wizardStep === 1) {
        body.innerHTML = `<div class="spin" style="width:32px;height:32px;border:3px solid var(--border-light);border-top-color:var(--primary);border-radius:50%;"></div>
            <p style="font-size:13px;color:var(--text-secondary);text-align:center;">${step.desc}<br/><span style="font-size:11px;color:var(--text-muted);">（浏览器已弹出，请完成扫码）</span></p>`;
        nextBtn.style.display = 'none';
        // 启动扫码
        scanLoginFromWizard();
    } else {
        body.innerHTML = `<iconify-icon icon="${step.icon}" width="48" style="color:#10B981;"></iconify-icon>
            <p style="font-size:14px;font-weight:600;color:#10B981;">${step.desc}</p>`;
        nextBtn.textContent = '完成';
        nextBtn.style.display = '';
        nextBtn.onclick = () => { closeWizard(); init(); };
    }
}

function wizardNextStep() {
    wizardStep++;
    renderWizardStep();
}

function closeWizard() {
    if (wizardPollTimer) { clearTimeout(wizardPollTimer); wizardPollTimer = null; }
    document.getElementById('wizardModal').style.display = 'none';
    wizardAccountId = null;
}

async function scanLoginFromWizard() {
    try {
        const resp = await apiFetch(`/api/accounts/${wizardAccountId}/scan-login`, { method: 'POST' });
        const data = await resp.json();
        if (data.session_id) pollWizardReady(data.session_id, 0);
        else pollWizardLegacyReady(0); // 兼容尚未重启的旧版后端
    } catch (e) {
        document.getElementById('wizardBody').innerHTML = `<iconify-icon icon="mdi:alert-circle" width="40" style="color:#EF4444;"></iconify-icon>
            <p style="font-size:13px;color:#EF4444;">启动失败：${escapeHtml(e.message)}</p>`;
        document.getElementById('wizardCancel').textContent = '关闭';
    }
}

async function pollWizardLegacyReady(tries) {
    if (tries > 90) {
        document.getElementById('wizardBody').innerHTML = `<p style="font-size:13px;color:#F59E0B;">扫码超时，请重试</p>`;
        return;
    }
    wizardPollTimer = setTimeout(async () => {
        try {
            const resp = await apiFetch('/api/accounts');
            accounts = await resp.json();
            const acc = accounts.find(a => a.id === wizardAccountId);
            if (acc && acc.ready) { wizardStep = 2; renderWizardStep(); return; }
        } catch (e) { /* 短暂网络错误时继续轮询 */ }
        pollWizardLegacyReady(tries + 1);
    }, 2000);
}

async function pollWizardReady(sessionId, tries) {
    if (tries > 90) {
        document.getElementById('wizardBody').innerHTML = `<iconify-icon icon="mdi:clock-alert" width="40" style="color:#F59E0B;"></iconify-icon>
            <p style="font-size:13px;color:#F59E0B;">扫码超时，请关闭后重试</p>`;
        return;
    }
    wizardPollTimer = setTimeout(async () => {
        try {
            const resp = await apiFetch(`/api/accounts/${wizardAccountId}/scan-login/${sessionId}`);
            const state = await resp.json();
            if (state.status === 'success') {
                wizardStep = 2;
                renderWizardStep();
                return;
            }
            if (state.status === 'error' || state.status === 'timeout') {
                document.getElementById('wizardBody').innerHTML = `<iconify-icon icon="mdi:alert-circle" width="40" style="color:#EF4444;"></iconify-icon>
                    <p style="font-size:13px;color:#EF4444;text-align:center;">${state.status === 'timeout' ? '扫码超时，请重试' : '连接失败：' + escapeHtml(state.error || '未知错误')}</p>`;
                return;
            }
        } catch (e) { /* 短暂网络错误时继续轮询 */ }
        pollWizardReady(sessionId, tries + 1);
    }, 2000);
}

function showAddModal() {
    // 重置到步骤 1
    setAddStep(1);
    document.getElementById('newName').value = '';
    document.getElementById('newAccountId').value = '';
    onPlatformChange();
    document.getElementById('addModal').style.display = 'flex';
}
function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }

function setAddStep(n) {
    document.getElementById('addStep1Content').style.display = n === 1 ? 'flex' : 'none';
    document.getElementById('addStep2Content').style.display = n === 2 ? 'block' : 'none';
    document.getElementById('addStep3Content').style.display = n === 3 ? 'block' : 'none';
    document.getElementById('addStep1Btns').style.display = n === 1 ? 'flex' : 'none';
    document.getElementById('addStep2Btns').style.display = n === 2 ? 'flex' : 'none';
    document.getElementById('addStep3Btns').style.display = n === 3 ? 'flex' : 'none';
    for (let i = 1; i <= 3; i++) {
        const tag = document.getElementById(`addStep${i}Tag`);
        tag.style.background = i === n ? 'var(--primary)' : (i < n ? '#10B981' : 'var(--bg-secondary)');
        tag.style.color = i === n ? 'white' : (i < n ? 'white' : 'var(--text-muted)');
    }
}

function onPlatformChange() {
    const pf = document.getElementById('newPlatform').value;
    const isRpa = ['xiaohongshu', 'douyin'].includes(pf);
    const btn = document.getElementById('addStep1NextBtn');
    // RPA: 简化表单 + 红色扫码按钮
    document.getElementById('idField').style.display = isRpa ? 'none' : '';
    document.getElementById('nameField').querySelector('label').textContent = isRpa ? '扫码登录 ' + platformNames[pf] : '账号名称';
    document.getElementById('newName').placeholder = isRpa ? '给这个账号起个名字...' : '如: SA物流达人';
    if (isRpa) {
        btn.textContent = '开始扫码连接';
        btn.style.background = pf === 'xiaohongshu' ? '#FF2442' : '#000';
    } else {
        btn.textContent = '下一步 → 填写 API 凭据';
        btn.style.background = '';
    }
}

async function addStep1Next() {
    const platform = document.getElementById('newPlatform').value;
    const name = document.getElementById('newName').value.trim() || (platformNames[platform] + '账号');
    const accountId = (platform + '_' + Date.now().toString(36)).slice(0, 20);
    if (!name) { showToast('请填写账号名称', 'error'); return; }
    const isRpa = ['xiaohongshu', 'douyin'].includes(platform);
    // 创建账号
    try {
        await apiFetch('/api/accounts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ platform, name, account_id: accountId, config_summary: '' }),
        });
    } catch (e) { showToast('创建账号失败: ' + e.message, 'error'); return; }
    const resp = await apiFetch('/api/accounts');
    accounts = await resp.json();
    const newAcc = accounts.find(a => a.account_id === accountId && a.platform === platform);
    if (!newAcc) { showToast('创建成功但未找到账号', 'error'); return; }
    // 进入步骤 2
    setAddStep(2);
    const step2 = document.getElementById('addStep2Content');
    if (isRpa) {
        step2.innerHTML = `<div style="text-align:center;padding:20px 0;">
            <div class="spin" style="width:40px;height:40px;border:3px solid var(--border-light);border-top-color:#FF2442;border-radius:50%;margin:0 auto 16px;"></div>
            <p style="font-size:15px;font-weight:700;color:var(--text-primary);">正在打开 ${platformNames[platform]} 登录页</p>
            <p style="font-size:12px;color:var(--text-muted);margin-top:8px;">浏览器将弹出一个新窗口，<br/>请使用 ${platformNames[platform]} APP 扫码完成登录</p>
        </div>`;
        try {
            const loginResp = await apiFetch(`/api/accounts/${newAcc.id}/scan-login`, { method: 'POST' });
            const loginData = await loginResp.json();
            if (loginData.session_id) pollAddReady(newAcc.id, loginData.session_id, 0, platform);
            else pollAddLegacyReady(newAcc.id, 0, platform); // 兼容旧版后端
        } catch (e) {
            step2.innerHTML = `<p style="color:#EF4444;text-align:center;padding:20px;">扫码启动失败：${escapeHtml(e.message)}<br/><button class="btn btn-secondary btn-sm" style="margin-top:12px;" onclick="closeAddModal()">关闭</button></p>`;
        }
    } else {
        // API 平台：展示凭据表单
        const fields = requiredFields[platform] || [];
        step2.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px;">
            <p style="font-size:12px;color:var(--text-muted);">请填写 ${platformNames[platform]} 的 API 凭据：</p>
            ${fields.map(([k, label]) => `<div><label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:block;">${escapeHtml(label)}</label>
                <input id="addCred_${k}" class="input" placeholder="${escapeHtml(k)}" autocomplete="off"/></div>`).join('')}
        </div>`;
        document.getElementById('addStep2Btns').innerHTML = `
            <button class="btn btn-secondary btn-sm" onclick="closeAddModal()">取消</button>
            <button class="btn btn-primary btn-sm" onclick="saveAddCredentials(${newAcc.id}, '${platform}')">保存凭据</button>`;
    }
}

async function pollAddLegacyReady(accId, tries, platform) {
    if (tries > 90) {
        document.getElementById('addStep2Content').innerHTML = `<p style="text-align:center;color:#F59E0B;">扫码超时，请关闭后重试</p>`;
        return;
    }
    setTimeout(async () => {
        try {
            const resp = await apiFetch('/api/accounts');
            accounts = await resp.json();
            const acc = accounts.find(a => a.id === accId);
            if (acc && acc.ready) { showAddComplete(accId, platform, true); return; }
        } catch (e) { /* 短暂网络错误时继续轮询 */ }
        pollAddLegacyReady(accId, tries + 1, platform);
    }, 2000);
}

async function saveAddCredentials(accId, platform) {
    const fields = requiredFields[platform] || [];
    const credentials = {};
    for (const [k] of fields) {
        const v = document.getElementById(`addCred_${k}`).value.trim();
        if (!v) { showToast('请填写全部字段', 'error'); return; }
        credentials[k] = v;
    }
    try {
        await apiFetch(`/api/accounts/${accId}/credentials`,
            { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credentials }) });
        showAddComplete(accId, platform, true);
    } catch (e) { showToast('保存失败: ' + e.message, 'error'); }
}

async function pollAddReady(accId, sessionId, tries, platform) {
    if (tries > 90) {
        document.getElementById('addStep2Content').innerHTML = `<p style="text-align:center;color:#F59E0B;">扫码超时，请关闭后重试</p>`;
        return;
    }
    setTimeout(async () => {
        try {
            const resp = await apiFetch(`/api/accounts/${accId}/scan-login/${sessionId}`);
            const state = await resp.json();
            if (state.status === 'success') { showAddComplete(accId, platform, true); return; }
            if (state.status === 'error' || state.status === 'timeout') {
                document.getElementById('addStep2Content').innerHTML = `<p style="text-align:center;color:#EF4444;">${state.status === 'timeout' ? '扫码超时，请重试' : '连接失败：' + escapeHtml(state.error || '未知错误')}</p>`;
                return;
            }
        } catch (e) { /* 继续轮询 */ }
        pollAddReady(accId, sessionId, tries + 1, platform);
    }, 2000);
}

function showAddComplete(accId, platform, success) {
    setAddStep(3);
    document.getElementById('addStep3Content').innerHTML = success
        ? `<iconify-icon icon="mdi:check-circle" width="48" style="color:#10B981;"></iconify-icon>
           <p style="font-size:14px;font-weight:600;color:#10B981;margin-top:8px;">连接成功！</p>
           <p style="font-size:12px;color:var(--text-muted);margin-top:4px;">${platformNames[platform]} 账号已就绪</p>`
        : `<iconify-icon icon="mdi:alert-circle" width="48" style="color:#EF4444;"></iconify-icon>
           <p style="font-size:14px;font-weight:600;color:#EF4444;margin-top:8px;">连接失败</p>`;
}

async function deleteAccount(id) { if (!confirm('确定删除？')) return; try { await apiFetch(`/api/accounts/${id}`, { method: 'DELETE' }); init(); showToast('已删除'); } catch (e) { showToast('删除失败', 'error'); } }

// 测试连接：cookie 平台实际打开浏览器校验登录态，可能需数秒
async function testConnection(id) {
    showToast('正在测试连接，请稍候…', 'info');
    try {
        const r = await apiFetch(`/api/accounts/${id}/test-connection`, { method: 'POST' });
        const d = await r.json();
        showToast(d.ok ? '连接正常，账号可用' : ('连接失败：' + (d.reason || '账号不可用')), d.ok ? 'success' : 'error');
        init();
    } catch (e) { showToast('测试失败：' + e.message, 'error'); }
}

// ==================== 凭据 Modal ====================
let credAccountId = null;

function openCredModal(id, platform) {
    const fields = requiredFields[platform] || [];
    credAccountId = id;
    document.getElementById('credHint').textContent =
        `平台：${platformNames[platform] || platform}。凭据仅用于发布，保存后不再回显。`;
    document.getElementById('credFields').innerHTML = fields.map(([k, label]) => `
        <div><label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:block;">${escapeHtml(label)}</label>
        <input id="cred_${k}" class="input" placeholder="${escapeHtml(k)}" autocomplete="off"/></div>`).join('');
    document.getElementById('credModal').style.display = 'flex';
}

function closeCredModal() { document.getElementById('credModal').style.display = 'none'; credAccountId = null; }

async function saveCredentials() {
    const acc = accounts.find(a => a.id === credAccountId);
    const fields = requiredFields[acc.platform] || [];
    const credentials = {};
    for (const [k] of fields) {
        const v = document.getElementById(`cred_${k}`).value.trim();
        if (!v) { showToast('请填写全部字段', 'error'); return; }
        credentials[k] = v;
    }
    try {
        const r = await apiFetch(`/api/accounts/${credAccountId}/credentials`,
            { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credentials }) });
        const d = await r.json();
        closeCredModal();
        showToast(d.ready ? '凭据已保存，账号就绪' : '已保存，但仍缺字段');
        init();
    } catch (e) { showToast('保存失败: ' + e.message, 'error'); }
}

// ==================== RPA 扫码登录 ====================
async function scanLogin(id) {
    try {
        const resp = await apiFetch(`/api/accounts/${id}/scan-login`, { method: 'POST' });
        const data = await resp.json();
        showToast('已启动，请在弹出的浏览器完成扫码', 'info');
        if (data.session_id) pollAccountReady(id, data.session_id, 0);
        else pollAccountLegacyReady(id, 0);
    } catch (e) { showToast('扫码启动失败: ' + e.message, 'error'); }
}

function pollAccountLegacyReady(id, tries) {
    if (tries > 90) { showToast('扫码超时，请重试', 'error'); return; }
    setTimeout(async () => {
        try {
            const resp = await apiFetch('/api/accounts');
            accounts = await resp.json();
            const acc = accounts.find(a => a.id === id);
            if (acc && acc.ready) { showToast('扫码登录成功，账号就绪'); init(); return; }
        } catch (e) { /* 短暂网络错误时继续轮询 */ }
        pollAccountLegacyReady(id, tries + 1);
    }, 2000);
}

function pollAccountReady(id, sessionId, tries) {
    if (tries > 90) { showToast('扫码超时，请重试', 'error'); return; }
    setTimeout(async () => {
        try {
            const resp = await apiFetch(`/api/accounts/${id}/scan-login/${sessionId}`);
            const state = await resp.json();
            if (state.status === 'success') { showToast('扫码登录成功，账号就绪'); init(); return; }
            if (state.status === 'error' || state.status === 'timeout') {
                showToast(state.status === 'timeout' ? '扫码超时，请重试' : `连接失败：${state.error || '未知错误'}`, 'error');
                return;
            }
        } catch (e) { /* 忽略单次失败，继续轮询 */ }
        pollAccountReady(id, sessionId, tries + 1);
    }, 2000);
}

init();
</script>

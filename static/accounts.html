<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>账号管理 - 南非物流社交媒体营销工具</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .sidebar-item-active { background-color: rgba(59, 130, 246, 0.1); border-right: 4px solid #3b82f6; color: #3b82f6; }
</style>
</head>
<body class="bg-gray-50 text-gray-800 flex h-screen overflow-hidden">
<aside class="w-64 bg-white border-r border-gray-200 flex flex-col flex-none">
    <div class="p-6 border-b border-gray-100 flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-900 rounded-lg flex items-center justify-center text-white">
            <iconify-icon icon="mdi:truck-fast" width="24"></iconify-icon>
        </div>
        <span class="font-bold text-lg tracking-tight text-blue-900">SA-LogiFlow</span>
    </div>
    <nav class="flex-1 py-6 space-y-1">
        <a class="flex items-center px-6 py-3 text-gray-600 hover:bg-gray-50 transition-colors" href="/home.html">
            <iconify-icon class="mr-3" icon="mdi:view-dashboard" width="20"></iconify-icon><span>分发总览</span>
        </a>
        <a class="flex items-center px-6 py-3 text-gray-600 hover:bg-gray-50 sidebar-item-active" href="/accounts.html">
            <iconify-icon class="mr-3" icon="mdi:account-group" width="20"></iconify-icon><span>账号管理</span>
        </a>
        <a class="flex items-center px-6 py-3 text-gray-600 hover:bg-gray-50 transition-colors" href="/editor.html">
            <iconify-icon class="mr-3" icon="mdi:square-edit-outline" width="20"></iconify-icon><span>内容创作</span>
        </a>
        <a class="flex items-center px-6 py-3 text-gray-600 hover:bg-gray-50 transition-colors" href="/queue.html">
            <iconify-icon class="mr-3" icon="mdi:clock-list" width="20"></iconify-icon><span>发布队列</span>
        </a>
        <a class="flex items-center px-6 py-3 text-gray-600 hover:bg-gray-50 transition-colors" href="/config.html">
            <iconify-icon class="mr-3" icon="mdi:cog" width="20"></iconify-icon><span>平台配置</span>
        </a>
    </nav>
</aside>

<main class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 flex-none">
        <h1 class="text-xl font-semibold text-gray-800">账号管理</h1>
        <button onclick="showAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
            <iconify-icon icon="mdi:plus"></iconify-icon><span>绑定新账号</span>
        </button>
    </header>
    <div class="flex-1 overflow-y-auto p-8">
        <!-- 平台筛选 -->
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
            <button onclick="filterAccounts(null)" class="filter-btn px-4 py-2 bg-blue-900 text-white rounded-full text-sm font-medium" data-filter="all">全部账号</button>
            <button onclick="filterAccounts('xiaohongshu')" class="filter-btn px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:border-blue-500" data-filter="xiaohongshu">小红书</button>
            <button onclick="filterAccounts('douyin')" class="filter-btn px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:border-blue-500" data-filter="douyin">抖音</button>
            <button onclick="filterAccounts('facebook')" class="filter-btn px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:border-blue-500" data-filter="facebook">Facebook</button>
            <button onclick="filterAccounts('twitter')" class="filter-btn px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:border-blue-500" data-filter="twitter">Twitter</button>
            <button onclick="filterAccounts('reddit')" class="filter-btn px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:border-blue-500" data-filter="reddit">Reddit</button>
        </div>

        <!-- 账号表格 -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-50 text-xs text-gray-500 uppercase">
                    <tr>
                        <th class="px-6 py-4 font-medium">平台 & 账号</th>
                        <th class="px-6 py-4 font-medium">状态</th>
                        <th class="px-6 py-4 font-medium">配置参数摘要</th>
                        <th class="px-6 py-4 font-medium">最后同步</th>
                        <th class="px-6 py-4 font-medium text-right">操作</th>
                    </tr>
                </thead>
                <tbody id="accountTable" class="divide-y divide-gray-100">
                    <tr><td colspan="5" class="px-6 py-8 text-center text-gray-400">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- 添加账号弹窗 -->
<div id="addModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
    <div class="bg-white rounded-xl p-6 w-96 shadow-xl">
        <h3 class="font-bold text-lg mb-4">绑定新账号</h3>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">平台</label>
                <select id="newPlatform" class="w-full border-gray-300 rounded-lg">
                    <option value="xiaohongshu">小红书</option>
                    <option value="douyin">抖音</option>
                    <option value="facebook">Facebook</option>
                    <option value="twitter">Twitter</option>
                    <option value="reddit">Reddit</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">账号名称</label>
                <input id="newName" type="text" class="w-full border-gray-300 rounded-lg" placeholder="如: SA物流达人">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">账号ID</label>
                <input id="newAccountId" type="text" class="w-full border-gray-300 rounded-lg" placeholder="如: xhs_logi_001">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">配置摘要</label>
                <input id="newConfig" type="text" class="w-full border-gray-300 rounded-lg" placeholder="如: Cookie有效期: 12天">
            </div>
        </div>
        <div class="flex justify-end gap-3 mt-6">
            <button onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded-lg text-sm hover:bg-gray-50">取消</button>
            <button onclick="addAccount()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">确认绑定</button>
        </div>
    </div>
</div>

<script>
const API = '';
const platformInfo = {
    xiaohongshu: { icon: 'ri:xiaohongshu-fill', color: 'text-red-600', name: '小红书' },
    douyin: { icon: 'ri:tiktok-fill', color: 'text-gray-900', name: '抖音' },
    facebook: { icon: 'ri:facebook-box-fill', color: 'text-blue-700', name: 'Facebook' },
    twitter: { icon: 'ri:twitter-x-fill', color: 'text-gray-900', name: 'Twitter' },
    reddit: { icon: 'ri:reddit-fill', color: 'text-orange-600', name: 'Reddit' },
};
const statusInfo = {
    active: { dot: 'bg-green-500', text: 'text-green-600', label: '已授权' },
    expired: { dot: 'bg-red-500', text: 'text-red-600', label: 'Token 已过期' },
    error: { dot: 'bg-red-500', text: 'text-red-600', label: '连接错误' },
};

let allAccounts = [];

async function loadAccounts(platform = null) {
    try {
        const url = platform ? `${API}/api/accounts?platform=${platform}` : `${API}/api/accounts`;
        const resp = await fetch(url);
        allAccounts = await resp.json();
        renderAccounts(allAccounts);
    } catch (e) {
        console.error('Failed to load accounts:', e);
    }
}

function renderAccounts(accounts) {
    const tbody = document.getElementById('accountTable');
    if (accounts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-400">暂无账号，点击右上角「绑定新账号」添加</td></tr>';
        return;
    }
    tbody.innerHTML = accounts.map(a => {
        const p = platformInfo[a.platform] || { icon: 'mdi:help', color: 'text-gray-400', name: a.platform };
        const s = statusInfo[a.status] || statusInfo.active;
        return `
            <tr class="hover:bg-gray-50 transition-colors">
                <td class="px-6 py-4">
                    <div class="flex items-center gap-3">
                        <iconify-icon class="${p.color} text-2xl" icon="${p.icon}"></iconify-icon>
                        <div>
                            <div class="text-sm font-bold text-gray-900">${a.name}</div>
                            <div class="text-xs text-gray-500">ID: ${a.account_id}</div>
                        </div>
                    </div>
                </td>
                <td class="px-6 py-4">
                    <span class="flex items-center gap-1.5 ${s.text} text-xs font-medium">
                        <span class="w-2 h-2 ${s.dot} rounded-full"></span>
                        ${s.label}
                    </span>
                </td>
                <td class="px-6 py-4">
                    <div class="text-xs text-gray-600">${a.config_summary || '-'}</div>
                </td>
                <td class="px-6 py-4 text-sm text-gray-500">${a.last_sync || '-'}</td>
                <td class="px-6 py-4 text-right">
                    <button onclick="deleteAccount(${a.id})" class="text-gray-400 hover:text-red-600">
                        <iconify-icon icon="mdi:trash-can-outline"></iconify-icon>
                    </button>
                </td>
            </tr>`;
    }).join('');
}

function filterAccounts(platform) {
    document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.filter === (platform || 'all')) {
            btn.className = 'filter-btn px-4 py-2 bg-blue-900 text-white rounded-full text-sm font-medium';
        } else {
            btn.className = 'filter-btn px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:border-blue-500';
        }
    });
    if (platform) {
        renderAccounts(allAccounts.filter(a => a.platform === platform));
    } else {
        renderAccounts(allAccounts);
    }
}

function showAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
function closeModal() { document.getElementById('addModal').classList.add('hidden'); }

async function addAccount() {
    const data = {
        platform: document.getElementById('newPlatform').value,
        name: document.getElementById('newName').value,
        account_id: document.getElementById('newAccountId').value,
        config_summary: document.getElementById('newConfig').value,
    };
    if (!data.name || !data.account_id) { alert('请填写账号名称和ID'); return; }
    try {
        await fetch(`${API}/api/accounts`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data),
        });
        closeModal();
        loadAccounts();
    } catch (e) {
        alert('添加失败: ' + e.message);
    }
}

async function deleteAccount(id) {
    if (!confirm('确定删除此账号？')) return;
    try {
        await fetch(`${API}/api/accounts/${id}`, { method: 'DELETE' });
        loadAccounts();
    } catch (e) {
        alert('删除失败');
    }
}

loadAccounts();
</script>
</body>
</html>

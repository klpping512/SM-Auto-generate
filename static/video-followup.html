<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>视频跟进 - SA-LogiFlow</title><link rel="stylesheet" href="/static/design-system.css?v=8"/><style>
.followup-main{overflow:auto}.followup-head{align-items:flex-start}.followup-subtitle{font-size:12px;color:var(--text-muted);margin-top:5px}.followup-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr);gap:16px}.followup-card{border:1px solid var(--border-line);border-radius:12px;background:#fff;overflow:hidden}.followup-card>header{padding:14px 16px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;gap:12px;align-items:center}.followup-card>header h2{font-size:15px}.followup-body{padding:16px}.event-preview{background:#141414;border-radius:10px;overflow:hidden}.event-preview video{display:block;width:100%;max-height:560px;object-fit:contain;background:#141414}.event-title{font-size:20px;line-height:1.45;margin:16px 0 5px}.event-en{font-size:12px;color:var(--text-muted);line-height:1.5}.event-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.event-chip{font-size:10px;padding:4px 8px;border-radius:99px;background:var(--bg-subcard);color:var(--text-secondary)}.flow-note{padding:12px;border-radius:10px;background:#fff9ef;color:#80531b;font-size:12px;line-height:1.65;margin-bottom:14px}.flow-steps{display:grid;gap:10px}.flow-step{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:11px;border:1px solid var(--border-light);border-radius:9px}.flow-step i{width:24px;height:24px;border-radius:50%;background:#f3eadc;color:#8a5914;font-style:normal;font-weight:800;text-align:center;line-height:24px}.flow-step strong{font-size:12px}.flow-step p{font-size:11px;color:var(--text-muted);margin:3px 0 0;line-height:1.5}.match-list{display:grid;gap:8px;margin-top:14px}.match-item{padding:10px;border:1px solid var(--border-light);border-radius:8px}.match-item strong{display:block;font-size:11px}.match-item span{display:block;color:var(--text-muted);font-size:10px;margin-top:3px;line-height:1.4}.followup-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.followup-actions .btn{flex:1;min-width:150px}.empty-note{padding:28px;text-align:center;color:var(--text-muted);font-size:12px}@media(max-width:900px){.followup-grid{grid-template-columns:1fr}}
</style></head><body><div class="app-layout" id="app"></div><div id="toastContainer" class="toast-container"></div>
<script src="/static/common.js?v=8"></script><script>
const PAGE_ID='video-followup';const followupParams=new URLSearchParams(location.search);const packageId=Number(followupParams.get('hotspot_id')||0);let eventId=Number(followupParams.get('event_clip_id')||0);let event=null,plan=null,topicBriefId='';
function shell(){document.getElementById('app').innerHTML=`${renderSidebar(PAGE_ID)}<main class="main-content followup-main"><header class="page-header followup-head"><div><h1 class="page-title">视频跟进</h1><p class="followup-subtitle">热点事实与 Buffalo 原本素材按职责组合；生成前先确认内容角度。</p></div><div class="project-actions"><a class="btn btn-secondary btn-sm" href="/assets.html?library=hotspot">返回热点素材</a></div></header><section class="followup-grid"><section class="followup-card"><header><h2>热点事件预览</h2><span id="eventStatus">加载中</span></header><div class="followup-body" id="eventPanel"><div class="empty-note">正在读取事件素材…</div></div></section><aside><section class="followup-card"><header><h2>自动编排流程</h2><span>证据优先</span></header><div class="followup-body"><div class="flow-note">热点只负责抛出一个物流问题；Buffalo 能说什么由知识库、已确认品牌证据和自有画面共同限定。</div><label for="customTopic" style="display:block;font-size:12px;font-weight:700;margin-bottom:6px">关联自定义物流话题</label><textarea id="customTopic" rows="3" placeholder="例如：面向刚进入南非市场的卖家，讲清关和末端配送风险" style="width:100%;resize:vertical"></textarea><label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px;margin-top:10px">视频生成链路</label><select id="chainMode" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border-line);"><option value="mix3">热点 + 南非素材 + 自有（三源必混）</option><option value="hotspot_owned" selected>热点 + 自有（za_stock 仅缺口补位）</option><option value="owned_only">纯自有（不依赖热点）</option></select><div class="followup-actions"><button class="btn btn-secondary" onclick="applyCustomTopic()">自动找营销引子</button></div><div id="recommendPanel" aria-live="polite"></div><div class="flow-steps"><div class="flow-step"><i>1</i><div><strong>模型推荐热点引子</strong><p>只从已采集热点中选择；热点不等于服务证明。</p></div></div><div class="flow-step"><i>2</i><div><strong>RAG 限定品牌表达</strong><p>知识库、品牌证据和 Buffalo 原片共同决定能说什么。</p></div></div><div class="flow-step"><i>3</i><div><strong>生成正式视频项目</strong><p>必须满足 50–60 秒双库证据门禁。</p></div></div></div><div id="matchPanel"></div><div class="followup-actions"><button class="btn btn-primary" id="autoBtn" onclick="createDraft()">生成视频草稿</button><button class="btn btn-secondary" onclick="openPrecisionAdjust()">视频精确调整</button></div></div></section></aside></section></main>`;}
function previewMarkup(){const va=event?.virtual_asset||{};if(!va.preview_url)return '<div class="empty-note">本地视频预览暂不可用，请先检查热点素材是否已下载完成。</div>';const poster=va.thumbnail_url?` poster="${escapeHtml(va.thumbnail_url)}"`:'';return `<div class="event-preview"><video src="${escapeHtml(va.preview_url)}#t=${Number(va.preview_start_second||0)},${Number(va.preview_end_second||0)}"${poster} controls preload="metadata" playsinline></video></div>`;}
function renderEvent(){document.getElementById('eventStatus').textContent=event.review_status==='confirmed'?'已确认':'待复核';document.getElementById('eventPanel').innerHTML=previewMarkup()+`<h2 class="event-title">${escapeHtml(event.title_zh||'热点事件')}</h2><div class="event-en">${escapeHtml(event.title_en||'')}</div><div class="event-meta"><span class="event-chip">${escapeHtml(event.location||'地点待确认')}</span><span class="event-chip">${(Number(event.start_ms||0)/1000).toFixed(1)}–${(Number(event.end_ms||0)/1000).toFixed(1)} 秒</span><span class="event-chip">事件片段 ${((event.duration_ms||0)/1000).toFixed(1)} 秒</span><span class="event-chip">来源：${escapeHtml(event.publisher||'热点信源')}</span></div>`;}
function renderPlan(){const brief=plan?.brief||{},summary=plan?.evidence_summary||{},planned=((summary.planned_duration_ms??summary.duration_ms)||0)/1000,final=((summary.duration_ms||0)/1000);document.getElementById('matchPanel').innerHTML=`<div class="match-list"><div class="match-item"><strong>动态内容角度</strong><span>${escapeHtml(brief.angle||'请先关联一个明确角度')}</span></div><div class="match-item"><strong>物流主题</strong><span>${escapeHtml(brief.logistics_topic||'待判断')}｜${escapeHtml(brief.claim||'')}</span></div><div class="match-item"><strong>正式成片证据</strong><span>热点 Hook ${summary.hotspot_video||0}/2 段｜Buffalo 视频 ${summary.owned_video||0}/4 段｜规划画面 ${planned.toFixed(0)} 秒＋CTA 后约 ${final.toFixed(0)} 秒</span></div>${summary.ready?'':'<div class="match-item"><strong>证据不足，禁止调用模型生成成片</strong><span>正式成片必须同时满足 2 段直接相关热点、4 段 Buffalo 原片和含 CTA 的 50–90 秒时长；系统不会用空白卡或泛物流画面凑时长。</span></div>'}</div>`;const button=document.getElementById('autoBtn');button.disabled=!summary.ready||!topicBriefId;button.title=!topicBriefId?'请先关联自定义物流话题':summary.ready?'模型将基于已验证证据生成 50–90 秒文案和分镜':'当前证据不足，不能生成';}
function renderRecommendations(result){const panel=document.getElementById('recommendPanel'),items=result?.recommendations||[];if(!items.length){panel.innerHTML='<div class="match-item"><strong>暂无可用热点引子</strong><span>可以先做常青内容，但系统不会把它包装成热点营销。</span></div>';return;}panel.innerHTML=`<div class="match-list"><div class="match-item"><strong>系统推荐的营销引子</strong><span>${escapeHtml(result.message||'')}</span></div>${items.map(item=>`<div class="match-item"><strong>${escapeHtml(item.title)}</strong><span>${escapeHtml(item.marketing_question||'')}</span><span>${item.can_render_video?`可用于视频｜<button class="btn btn-secondary btn-sm" onclick="useRecommendedEvent(${Number(item.event_clip_id)})">采用此热点</button>`:'仅可用于图文/脚本引子，尚无可用热点视频'}</span></div>`).join('')}</div>`;}
async function applyCustomTopic(){const input=document.getElementById('customTopic'),raw=input.value.trim();if(!raw)return showToast('请先输入自定义物流话题','error');try{const r=await apiFetch('/api/topic-briefs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({raw_input:raw,platforms:['douyin'],content_form:'video',chain_mode:document.getElementById('chainMode').value})});const result=await r.json();const brief=result.brief;if(!brief.angle){input.value=(result.angles||[])[0]||raw;showToast('选题较宽，请补充或选择一个角度后再关联','error');return;}topicBriefId=brief.id;const recommended=await apiFetch(`/api/topic-briefs/${encodeURIComponent(topicBriefId)}/recommend-hotspots`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({limit:3,use_model:true})});renderRecommendations(await recommended.json());const p=await apiFetch(`/api/hotspot-events/${eventId}/logistics-plan?topic_brief_id=${encodeURIComponent(topicBriefId)}`,{cache:'no-store'});plan=await p.json();renderPlan();showToast('已完成热点引子与 Buffalo RAG 检索');}catch(error){showToast(error.message,'error');}}
function useRecommendedEvent(id){eventId=Number(id);load();}
async function load(){try{if(!eventId&&packageId){const packageResponse=await apiFetch(`/api/hotspot-packages/${packageId}`,{cache:'no-store'});const topicPackage=await packageResponse.json();eventId=Number((topicPackage.event_clips||[])[0]?.id||0);if(!eventId)throw new Error('该专题包尚无可用热点事件片段，请先准备并分析单个已授权媒体。');}if(!eventId)throw new Error('缺少热点事件 ID');const response=await apiFetch(`/api/hotspot-events/${eventId}`,{cache:'no-store'});event=await response.json();const suffix=topicBriefId?`?topic_brief_id=${encodeURIComponent(topicBriefId)}`:'';const planResponse=await apiFetch(`/api/hotspot-events/${eventId}/logistics-plan${suffix}`,{cache:'no-store'});plan=await planResponse.json();localStorage.setItem('selectedHotspotEventClip',JSON.stringify({event_clip_id:event.id,asset_id:event.asset_id,start_ms:event.start_ms,end_ms:event.end_ms,title_zh:event.title_zh,title_en:event.title_en,virtual_asset:event.virtual_asset}));renderEvent();renderPlan();}catch(error){document.getElementById('eventPanel').innerHTML=`<div class="empty-note">${escapeHtml(error.message)}</div>`;showToast(error.message,'error');}}
function openPrecisionAdjust(){if(!event)return;location.href=`/video-workbench.html?event_clip_id=${encodeURIComponent(event.id)}`;}
async function createDraft(){if(!event||!plan||!topicBriefId)return;const button=document.getElementById('autoBtn');button.disabled=true;button.textContent='模型正在基于证据规划文案…';try{const chainMode=document.getElementById('chainMode').value;const payload={platform:'douyin',target_duration_ms:60000,chain_mode:chainMode};if(chainMode!=='owned_only'){payload.hotspot_event_id=event.id;}const response=await apiFetch(`/api/topic-briefs/${encodeURIComponent(topicBriefId)}/generate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();const project=result.project;if(!project?.id)throw new Error('未能创建视频项目');localStorage.removeItem('selectedHotspotEventClip');location.href=`/video-project.html?id=${encodeURIComponent(project.id)}`;}catch(error){showToast(error.message,'error');button.disabled=false;button.textContent='生成视频草稿';}}
shell();load();
</script></body></html>

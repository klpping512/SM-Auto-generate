<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>经营驾驶舱 - SA-LogiFlow</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<link rel="stylesheet" href="/static/design-system.css"/>
</head>
<body>
<div class="app-layout" id="app"></div>
<script src="/static/common.js"></script>
<script>
const PAGE_ID = 'home';
const platformColors = { xiaohongshu: '#FF2442', douyin: '#000', facebook: '#1877F2', twitter: '#1DA1F2', reddit: '#FF4500' };
const platformNames = { xiaohongshu: '小红书', douyin: '抖音', facebook: 'Facebook', twitter: 'Twitter', reddit: 'Reddit' };

function getWeekRange() {
    const now = new Date(), mon = new Date(now);
    mon.setDate(now.getDate() - now.getDay() + 1);
    const f = d => `${d.getMonth()+1}/${d.getDate()}`;
    return `${f(mon)} — ${f(now)}`;
}

async function init() {
    const resp = await apiFetch('/api/dashboard');
    const data = await resp.json();
    const ws = data.weekly_stats || {};
    const qs = data.queue_stats;

    // 计算模拟环比
    const pubChange = ws.published > 0 ? '+12%' : '0%';
    const successRate = qs.total > 0 ? Math.round(qs.published / qs.total * 100) : 0;

    document.getElementById('app').innerHTML = `
    ${renderSidebar(PAGE_ID)}
    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title">经营驾驶舱</h1>
            <div style="display:flex;gap:8px;">
                <button class="btn btn-secondary btn-sm" onclick="location.reload()">
                    <iconify-icon icon="mdi:refresh" width="16"></iconify-icon> 刷新
                </button>
            </div>
        </div>
        <div class="page-body">
            <!-- 本周概况 Banner -->
            <div class="soft-banner" style="padding:28px 32px;color:white;margin-bottom:24px;">
                <div style="position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h2 style="font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;">
                        <iconify-icon icon="mdi:calendar-week-outline"></iconify-icon> 本周运营概况
                    </h2>
                    <span style="font-size:13px;opacity:0.7;">${getWeekRange()}</span>
                </div>
                <div style="position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;">
                    <div>
                        <div style="font-size:12px;opacity:0.7;margin-bottom:6px;">已发布</div>
                        <div style="font-size:36px;font-weight:700;line-height:1;">${ws.published || 0}</div>
                        <span style="font-size:11px;background:rgba(255,255,255,0.2);padding:2px 8px;border-radius:999px;margin-top:4px;display:inline-block;">${pubChange} 环比</span>
                    </div>
                    <div>
                        <div style="font-size:12px;opacity:0.7;margin-bottom:6px;">总创建</div>
                        <div style="font-size:36px;font-weight:700;line-height:1;">${ws.total || 0}</div>
                    </div>
                    <div>
                        <div style="font-size:12px;opacity:0.7;margin-bottom:6px;">发布成功率</div>
                        <div style="font-size:36px;font-weight:700;line-height:1;">${successRate}%</div>
                    </div>
                    <div>
                        <div style="font-size:12px;opacity:0.7;margin-bottom:6px;">最活跃平台</div>
                        <div style="font-size:20px;font-weight:700;margin-top:8px;">${platformNames[ws.top_platform] || ws.top_platform || '-'}</div>
                    </div>
                </div>
            </div>

            <!-- KPI 卡片 -->
            <div class="kpi-grid" style="margin-bottom:24px;">
                <div class="kpi-card">
                    <span class="kpi-label">队列总数</span>
                    <span class="kpi-value">${qs.total}</span>
                    <span class="kpi-change up"><iconify-icon icon="mdi:trending-up" width="14"></iconify-icon> +${qs.total}</span>
                </div>
                <div class="kpi-card">
                    <span class="kpi-label">待发布</span>
                    <span class="kpi-value">${qs.queued}</span>
                    <span class="badge badge-yellow">等待中</span>
                </div>
                <div class="kpi-card">
                    <span class="kpi-label">已发布</span>
                    <span class="kpi-value">${qs.published}</span>
                    <span class="kpi-change up"><iconify-icon icon="mdi:check" width="14"></iconify-icon> 成功</span>
                </div>
                <div class="kpi-card">
                    <span class="kpi-label">绑定账号</span>
                    <span class="kpi-value">${data.account_total}</span>
                    <span class="badge badge-green">${data.account_active} 活跃</span>
                </div>
            </div>

            <!-- 平台分布 -->
            <div style="display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-bottom:24px;">
                <div class="card">
                    <div class="card-header"><span class="card-title">平台分布</span></div>
                    <div class="card-body"><div id="distChart" style="height:280px;"></div></div>
                </div>
            </div>

            <!-- 平台连接状态 -->
            <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px;">
                ${Object.entries(platformNames).map(([k, name]) => {
                    const stats = data.platform_stats[k] || { total: 0, active: 0 };
                    const color = platformColors[k];
                    const connected = stats.active > 0;
                    return `<div class="card" style="padding:20px;text-align:center;background:var(--bg-subcard);">
                        <div style="width:44px;height:44px;border-radius:var(--radius-sm);background:${color}15;color:${color};display:flex;align-items:center;justify-content:center;margin:0 auto 10px;box-shadow:var(--shadow-sm);">
                            <iconify-icon icon="ri:${k === 'xiaohongshu' ? 'xiaohongshu-fill' : k === 'douyin' ? 'tiktok-fill' : k+'-box-fill'}" width="22"></iconify-icon>
                        </div>
                        <div style="font-size:13px;font-weight:600;margin-bottom:4px;">${name}</div>
                        <span class="badge ${connected ? 'badge-green' : 'badge-gray'}">${connected ? '已连接' : '未配置'}</span>
                        <div style="font-size:11px;color:var(--text-muted);margin-top:8px;">${stats.total} 个账号</div>
                    </div>`;
                }).join('')}
            </div>

            <!-- 最近活动 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">最近发布活动</span>
                    <a href="/queue.html" style="font-size:13px;color:var(--primary);text-decoration:none;">查看全部 →</a>
                </div>
                <div class="card-body" style="padding:0;">
                    <table class="data-table">
                        <thead><tr><th>时间</th><th>平台</th><th>标题</th><th>状态</th></tr></thead>
                        <tbody>
                            ${data.recent_activity.length === 0 ? '<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--text-muted);">暂无活动</td></tr>' :
                            data.recent_activity.map(item => {
                                const s = {draft:'badge-gray',pending_review:'badge-purple',queued:'badge-yellow',published:'badge-green',failed:'badge-red'}[item.status] || 'badge-gray';
                                const sl = {draft:'草稿',pending_review:'待审核',queued:'待发布',published:'已发布',failed:'失败'}[item.status] || item.status;
                                return `<tr>
                                    <td style="color:var(--text-muted);font-size:12px;">${item.created_at||'-'}</td>
                                    <td><span style="font-size:12px;">${platformNames[item.platform]||item.platform}</span></td>
                                    <td style="font-weight:600;">${escapeHtml(item.title)}</td>
                                    <td><span class="badge ${s}">${sl}</span></td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>`;

    // 分布图
    const distChart = echarts.init(document.getElementById('distChart'));
    const distData = Object.entries(data.platform_stats).map(([k,v]) => ({ value: v.total, name: platformNames[k]||k, itemStyle: { color: platformColors[k]||'#6B7280' } }));
    distChart.setOption({
        tooltip: { trigger: 'item' },
        series: [{ type: 'pie', radius: ['45%','75%'], avoidLabelOverlap: false, itemStyle: { borderRadius: 8, borderColor: '#fff', borderWidth: 3 }, label: { show: false }, data: distData.length ? distData : [{ value: 0, name: '暂无数据' }] }]
    });

    window.addEventListener('resize', () => { distChart.resize(); });
}

init();
</script>
</body>
</html>

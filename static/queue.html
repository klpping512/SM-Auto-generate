<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>发布队列 - SA-LogiFlow</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="/static/design-system.css"/>
</head>
<body>
<div class="app-layout" id="app"></div>
<div id="toastContainer" class="toast-container"></div>
<script src="/static/common.js"></script>
<script>
const PAGE_ID = 'queue';
const platformNames = { xiaohongshu:'小红书',douyin:'抖音',facebook:'Facebook',twitter:'Twitter',reddit:'Reddit' };
const platformIcons = { xiaohongshu:'simple-icons:xiaohongshu',douyin:'ri:tiktok-fill',facebook:'ri:facebook-box-fill',twitter:'ri:twitter-x-fill',reddit:'ri:reddit-fill' };
const platformColors = { xiaohongshu:'#FF2442',douyin:'#000',facebook:'#1877F2',twitter:'#1DA1F2',reddit:'#FF4500' };
const statusMap = { draft:{label:'草稿',cls:'badge-gray',border:'#9CA3AF'}, pending_review:{label:'待审核',cls:'badge-purple',border:'#8B5CF6'}, approved:{label:'已通过',cls:'badge-blue',border:'#3B82F6'}, queued:{label:'待发布',cls:'badge-yellow',border:'#F59E0B'}, published:{label:'已发布',cls:'badge-green',border:'#10B981'}, failed:{label:'失败',cls:'badge-red',border:'#EF4444'}, rejected:{label:'已驳回',cls:'badge-red',border:'#EF4444'}, reviewing:{label:'审核中',cls:'badge-blue',border:'#3B82F6'} };

let items = [];
let filterPlatform = '';
let filterStatus = '';

async function init() {
    const resp = await apiFetch('/api/queue');
    items = await resp.json();
    render();
}

function getFiltered() {
    return items.filter(i => {
        if (filterPlatform && i.platform !== filterPlatform) return false;
        if (filterStatus && i.status !== filterStatus) return false;
        return true;
    });
}

function render() {
    const filtered = getFiltered();
    document.getElementById('app').innerHTML = `
    ${renderSidebar(PAGE_ID)}
    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title">发布队列</h1>
            <div style="display:flex;gap:8px;">
                <span style="font-size:13px;color:var(--text-muted);line-height:32px;">共 ${filtered.length} 条</span>
                <button class="btn btn-secondary btn-sm" onclick="init()"><iconify-icon icon="mdi:refresh" width="16"></iconify-icon> 刷新</button>
            </div>
        </div>
        <div class="page-body">
            <div class="card" style="margin-bottom:16px;">
                <div style="padding:12px 20px;display:flex;gap:12px;align-items:center;">
                    <span style="font-size:13px;color:var(--text-muted);">平台:</span>
                    <select class="select" style="font-size:13px;" onchange="filterPlatform=this.value;render();">
                        <option value="">全部</option>
                        ${Object.entries(platformNames).map(([k,v])=>`<option value="${k}" ${filterPlatform===k?'selected':''}>${v}</option>`).join('')}
                    </select>
                    <span style="font-size:13px;color:var(--text-muted);">状态:</span>
                    <select class="select" style="font-size:13px;" onchange="filterStatus=this.value;render();">
                        <option value="">全部</option>
                        ${Object.entries(statusMap).map(([k,v])=>`<option value="${k}" ${filterStatus===k?'selected':''}>${v.label}</option>`).join('')}
                    </select>
                </div>
            </div>

            <div style="display:flex;flex-direction:column;gap:12px;">
                ${filtered.length === 0 ? `<div class="card"><div class="empty-state"><iconify-icon icon="mdi:tray-arrow-down" width="48"></iconify-icon><p style="margin-top:8px;">队列为空，去<a href="/editor.html" style="color:var(--primary);">内容创作</a>生成内容</p></div></div>` :
                filtered.map(item => {
                    const p = {icon:platformIcons[item.platform]||'mdi:help',color:platformColors[item.platform]||'#6B7280',name:platformNames[item.platform]||item.platform};
                    const s = statusMap[item.status] || statusMap.draft;
                    const tags = (item.hashtags||[]).map(h=>`#${escapeHtml(h)}`).join(' ');
                    const copyText = encodeURIComponent(`${item.title}\n\n${item.body}\n\n${(item.hashtags||[]).map(h=>'#'+h).join(' ')}`);
                    return `<div class="card fade-in" style="border-left:4px solid ${s.border};overflow:hidden;">
                        <div style="padding:16px 20px;display:flex;align-items:center;gap:16px;">
                            <div style="flex:1;min-width:0;">
                                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                                    <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--radius-full);background:${p.color}15;color:${p.color};display:flex;align-items:center;gap:4px;">
                                        <iconify-icon icon="${p.icon}" width="12"></iconify-icon> ${escapeHtml(p.name)}
                                    </span>
                                    <span class="badge ${s.cls}">${s.label}</span>
                                </div>
                                <div style="font-size:14px;font-weight:700;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(item.title)}</div>
                                <div style="font-size:13px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(item.body.substring(0,120))}${item.body.length>120?'...':''}</div>
                                ${tags?`<div style="font-size:11px;color:var(--primary);margin-top:4px;">${tags}</div>`:''}
                                ${item.error_msg?`<div style="font-size:11px;color:var(--error);margin-top:4px;">${escapeHtml(item.error_msg)}</div>`:''}
                            </div>
                            <div style="width:180px;flex-shrink:0;text-align:right;padding-left:16px;border-left:1px solid var(--border-light);">
                                <div style="font-size:11px;color:var(--text-muted);">创建</div>
                                <div style="font-size:12px;font-weight:500;margin-bottom:8px;">${escapeHtml(item.created_at)||'-'}</div>
                                <div style="font-size:11px;color:var(--text-muted);">定时发布</div>
                                <input type="datetime-local" value="${item.scheduled_at?escapeHtml(item.scheduled_at.replace(' ','T')):''}"
                                    onchange="updateSchedule(${item.id},this.value)"
                                    style="font-size:11px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px 4px;width:100%;margin-top:2px;"/>
                            </div>
                            <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;">
                                <button class="btn btn-ghost btn-sm" onclick="copyContent('${copyText}')" title="复制文案"><iconify-icon icon="mdi:content-copy" width="16"></iconify-icon></button>
                                ${item.status==='queued'?`<button class="btn btn-ghost btn-sm" style="color:var(--success);" onclick="publishItem(${item.id})" title="发布"><iconify-icon icon="mdi:send" width="16"></iconify-icon></button>`:''}
                                ${item.status==='failed'?`<button class="btn btn-ghost btn-sm" style="color:var(--primary);" onclick="updateStatus(${item.id},'queued')" title="重试"><iconify-icon icon="mdi:refresh" width="16"></iconify-icon></button>`:''}
                                <button class="btn btn-ghost btn-sm" style="color:var(--error);" onclick="deleteItem(${item.id})" title="删除"><iconify-icon icon="mdi:delete-outline" width="16"></iconify-icon></button>
                            </div>
                        </div>
                    </div>`;
                }).join('')}
            </div>
        </div>
    </div>`;
}

async function copyContent(text) { try{await navigator.clipboard.writeText(decodeURIComponent(text));showToast('已复制');}catch(e){showToast('复制失败','error');}}
async function updateSchedule(id,dt) { const s=dt?dt.replace('T',' ')+':00':null; try{await apiFetch(`/api/queue/${id}/status`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'queued',scheduled_at:s})});showToast('已更新');}catch(e){showToast('更新失败','error');}}
async function updateStatus(id,status) { try{await apiFetch(`/api/queue/${id}/status`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});init();}catch(e){showToast('操作失败','error');}}
async function publishItem(id) { if(!confirm('确定发布？'))return; try{const r=await apiFetch(`/api/publish/${id}`,{method:'POST'});const d=await r.json();showToast(d.success?'发布成功':'发布失败: '+(d.error||''),d.success?'success':'error');init();}catch(e){showToast('发布失败','error');}}
async function deleteItem(id) { if(!confirm('确定删除？'))return; try{await apiFetch(`/api/queue/${id}`,{method:'DELETE'});init();}catch(e){showToast('删除失败','error');}}

init();
</script>
</body>
</html>

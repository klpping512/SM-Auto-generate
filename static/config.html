<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg?v=5"/>
<link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico?v=5"/>
<link rel="apple-touch-icon" href="/static/icons/icon-180.png?v=5"/>
<link rel="manifest" href="/static/manifest.json?v=5"/>
<meta name="theme-color" content="#B98A4C"/>
<title>设置 - SA-LogiFlow</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="/static/design-system.css?v=5"/>
</head>
<body>
<div class="app-layout" id="app"></div>
<div id="toastContainer" class="toast-container"></div>
<script src="/static/common.js?v=5"></script>
<script>
const PAGE_ID = 'config';

function render() {
    document.getElementById('app').innerHTML = `
    ${renderSidebar(PAGE_ID)}
    <div class="main-content">
        <div class="page-header"><h1 class="page-title">设置</h1></div>
        <div class="page-body" style="padding-right:4px;">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:20px;align-items:start;">
            <div>

            <!-- 通知告警 -->
            <div class="card" style="margin-bottom:20px;">
                <div style="padding:16px 24px;border-bottom:1px solid var(--border-light);background:#FEF3C7;display:flex;align-items:center;gap:10px;">
                    <div style="width:36px;height:36px;border-radius:var(--radius-md);background:#F59E0B15;color:#F59E0B;display:flex;align-items:center;justify-content:center;"><iconify-icon icon="mdi:bell-outline" width="20"></iconify-icon></div>
                    <span style="font-size:15px;font-weight:700;">通知告警</span>
                </div>
                <div class="card-body">
                    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">发布失败时发送邮件告警通知</p>
                    <div style="display:flex;flex-direction:column;gap:12px;">
                        <div>
                            <label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:block;">SMTP 服务器</label>
                            <input id="smtpHost" class="input" value="smtp.163.com" placeholder="smtp.163.com"/>
                        </div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                            <div>
                                <label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:block;">端口</label>
                                <input id="smtpPort" class="input" value="465" placeholder="465"/>
                            </div>
                            <div>
                                <label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:block;">发件人邮箱</label>
                                <input id="smtpUser" class="input" type="email" placeholder="your@163.com"/>
                            </div>
                        </div>
                        <div>
                            <label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:block;">SMTP 密码/授权码</label>
                            <input id="smtpPass" class="input" type="password" placeholder="邮箱授权码"/>
                        </div>
                        <div>
                            <label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:block;">告警收件人</label>
                            <input id="alertEmail" class="input" type="email" placeholder="admin@example.com"/>
                        </div>
                    </div>
                    <div style="margin-top:16px;display:flex;gap:8px;">
                        <button class="btn btn-primary" onclick="saveNotification()">保存通知配置</button>
                        <button class="btn btn-secondary" onclick="testNotification('email')">发送测试邮件</button>
                    </div>
                </div>
            </div>
            </div>
            <div>

            <!-- IM 机器人通知 -->
            <div class="card" style="margin-bottom:20px;">
                <div style="padding:16px 24px;border-bottom:1px solid var(--border-light);background:#E0F2FE;display:flex;align-items:center;gap:10px;">
                    <div style="width:36px;height:36px;border-radius:var(--radius-md);background:#0EA5E915;color:#0EA5E9;display:flex;align-items:center;justify-content:center;"><iconify-icon icon="mdi:robot-outline" width="20"></iconify-icon></div>
                    <span style="font-size:15px;font-weight:700;">IM 机器人通知</span>
                </div>
                <div class="card-body">
                    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">发布成功/失败时，主动推送到飞书或企业微信群机器人</p>
                    <div style="display:flex;flex-direction:column;gap:12px;">
                        <div>
                            <label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:flex;align-items:center;gap:6px;"><iconify-icon icon="simple-icons:feishu" style="color:#3370FF;"></iconify-icon> 飞书 Webhook</label>
                            <div style="display:flex;gap:8px;">
                                <input id="feishuWebhook" class="input" placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/..." style="flex:1;"/>
                                <button class="btn btn-secondary" onclick="testNotification('feishu')">测试</button>
                            </div>
                        </div>
                        <div>
                            <label style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;display:flex;align-items:center;gap:6px;"><iconify-icon icon="mdi:wechat" style="color:#07C160;"></iconify-icon> 企业微信 Webhook</label>
                            <div style="display:flex;gap:8px;">
                                <input id="wecomWebhook" class="input" placeholder="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=..." style="flex:1;"/>
                                <button class="btn btn-secondary" onclick="testNotification('wecom')">测试</button>
                            </div>
                        </div>
                    </div>
                    <div style="margin-top:16px;">
                        <button class="btn btn-primary" onclick="saveNotification()">保存通知配置</button>
                    </div>
                    <p style="font-size:12px;color:var(--text-muted);margin-top:10px;">在群里添加「自定义机器人」即可获取 Webhook 地址。两者可同时配置，也可只配一个。</p>
                </div>
            </div>

            <!-- 定时发布 -->
            <div class="card" style="margin-bottom:20px;">
                <div style="padding:16px 24px;border-bottom:1px solid var(--border-light);background:#ECFDF5;display:flex;align-items:center;gap:10px;">
                    <div style="width:36px;height:36px;border-radius:var(--radius-md);background:#10B98115;color:#10B981;display:flex;align-items:center;justify-content:center;"><iconify-icon icon="mdi:clock-outline" width="20"></iconify-icon></div>
                    <span style="font-size:15px;font-weight:700;">定时发布</span>
                </div>
                <div class="card-body">
                    <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);">
                        <iconify-icon icon="mdi:check-circle" style="color:var(--success);"></iconify-icon>
                        定时调度器已启用，每分钟检查到期任务自动发布
                    </div>
                    <p style="font-size:12px;color:var(--text-muted);margin-top:8px;">在发布队列中设置「定时发布」时间，系统会自动在指定时间发布内容。注意：南非时区 UTC+2。</p>
                </div>
            </div>

            <!-- 视频生成 -->
            <div class="card" style="margin-bottom:20px;">
                <div style="padding:16px 24px;border-bottom:1px solid var(--border-light);background:#F3E8FF;display:flex;align-items:center;gap:10px;">
                    <iconify-icon icon="mdi:movie-open-play" width="22" style="color:#7C3AED;"></iconify-icon><span style="font-size:15px;font-weight:700;">抖音视频生成</span>
                </div>
                <div class="card-body"><p style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">MiMo v2.5 TTS 负责旁白，FFmpeg 负责竖屏 MP4 合成。密钥只保存在服务运行环境。</p><div style="display:flex;gap:8px;"><input id="mimoKey" type="password" class="input" placeholder="MiMo API Key"/><button class="btn btn-primary" onclick="saveMimoKey()">保存</button></div><div id="mediaCaps" style="font-size:12px;margin-top:12px;color:var(--text-secondary);">正在检测...</div></div>
            </div>

            <!-- 系统信息 -->
            <div class="card">
                <div class="card-body" style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);">
                    <iconify-icon icon="mdi:information-outline" style="color:var(--primary);"></iconify-icon>
                    发布功能通过慧媒 CLI 实现，请确保已安装并登录慧媒
                </div>
            </div>

            </div>
          </div>
        </div>
    </div>`;
}

async function saveNotification() {
    const config = {
        smtp_host: document.getElementById('smtpHost').value,
        smtp_port: document.getElementById('smtpPort').value,
        smtp_user: document.getElementById('smtpUser').value,
        smtp_pass: document.getElementById('smtpPass').value,
        alert_email: document.getElementById('alertEmail').value,
        feishu_webhook: document.getElementById('feishuWebhook').value.trim(),
        wecom_webhook: document.getElementById('wecomWebhook').value.trim(),
    };
    try {
        await apiFetch('/api/config/notification', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(config) });
        showToast('通知配置已保存');
    } catch(e) { showToast('保存失败: ' + e.message, 'error'); }
}

async function testNotification(channel = 'all') {
    const names = { email: '邮件', feishu: '飞书', wecom: '企业微信', all: '全部渠道' };
    try {
        await apiFetch('/api/config/notification/test', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({channel}) });
        showToast(`${names[channel] || ''}测试通知已发送`);
    } catch(e) { showToast('发送失败: ' + e.message, 'error'); }
}

async function saveMimoKey(){const key=document.getElementById('mimoKey').value.trim();if(!key){showToast('请输入 MiMo API Key','error');return;}try{await apiFetch('/api/config/mimo-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});document.getElementById('mimoKey').value='';showToast('MiMo Key 已加载');loadCapabilities();}catch(e){showToast(e.message,'error');}}
async function loadCapabilities(){try{const r=await apiFetch('/api/media/capabilities');const c=await r.json();const mark=v=>v?'✅':'❌';document.getElementById('mediaCaps').innerHTML=`${mark(c.ffmpeg)} FFmpeg &nbsp; ${mark(c.ffprobe)} ffprobe &nbsp; ${mark(c.mimo_key)} MiMo Key<br/><strong>${c.ready?'视频生成已就绪':'请补齐缺失项后再生成视频'}</strong>`;}catch(e){document.getElementById('mediaCaps').textContent='能力检测失败';}}

render();loadCapabilities();
</script>
</body>
</html>

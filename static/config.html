<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>平台配置 - SA-LogiFlow</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="/static/design-system.css"/>
</head>
<body>
<div class="app-layout" id="app"></div>
<div id="toastContainer" class="toast-container"></div>
<script src="/static/common.js"></script>
<script>
const PAGE_ID = 'config';

function render() {
    document.getElementById('app').innerHTML = `
    ${renderSidebar(PAGE_ID)}
    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title">设置</h1>
        </div>
        <div class="page-body" style="max-width:640px;">

            <div class="card" style="margin-bottom:20px;">
                <div style="padding:16px 24px;border-bottom:1px solid var(--border-light);background:var(--bg-subcard);display:flex;align-items:center;gap:10px;">
                    <div style="width:38px;height:38px;border-radius:var(--radius-sm);background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);">
                        <iconify-icon icon="mdi:brain" width="20"></iconify-icon>
                    </div>
                    <span style="font-size:15px;font-weight:700;">AI 引擎</span>
                </div>
                <div class="card-body">
                    <div style="margin-bottom:12px;">
                        <label style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;display:block;">DeepSeek API Key</label>
                        <div style="display:flex;gap:8px;">
                            <input id="apiKey" class="input" type="password" placeholder="sk-..." style="flex:1;"/>
                            <button class="btn btn-primary" onclick="saveApiKey()">保存</button>
                        </div>
                        <p style="font-size:12px;color:var(--text-muted);margin-top:6px;">用于 AI 文案生成，未配置时使用模板内容</p>
                    </div>
                    <div id="aiStatus" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);">
                        <span style="width:6px;height:6px;border-radius:50%;background:var(--text-muted);"></span> 未配置
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-body" style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);">
                    <iconify-icon icon="mdi:information-outline" style="color:var(--primary);"></iconify-icon>
                    发布功能通过慧媒 CLI 实现，请确保已安装并登录慧媒
                </div>
            </div>

        </div>
    </div>`;
}

async function saveApiKey() {
    const key = document.getElementById('apiKey').value.trim();
    if (!key) { showToast('请输入 API Key', 'error'); return; }
    try {
        const resp = await apiFetch('/api/config/apikey', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key })
        });
        if (resp.ok) {
            showToast('API Key 已保存，AI 内容生成已启用');
            document.getElementById('aiStatus').innerHTML = '<span style="width:6px;height:6px;border-radius:50%;background:var(--success);"></span> <span style="color:var(--success);font-weight:600;">已配置</span>';
        }
    } catch(e) { showToast('保存失败', 'error'); }
}

render();
</script>
</body>
</html>

function agentDebugLog(hypothesisId,location,message,data){const payload={sessionId:'34c455',runId:'post-fix',hypothesisId,location,message,data:data||{},timestamp:Date.now()};fetch('http://127.0.0.1:7788/ingest/8c31ab54-f67a-4ba8-a9a5-f33f81c60ffa',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'34c455'},body:JSON.stringify(payload)}).catch(()=>{});fetch('/api/_agent_debug_log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{});}

let _libraryScrollPos={pageBody:0,windowY:0};
function captureLibraryScroll(){const body=document.querySelector('.page-body');const pos={pageBody:body?body.scrollTop:0,windowY:window.scrollY||document.documentElement.scrollTop||0};_libraryScrollPos=pos;return pos;}
function restoreLibraryScroll(pos){const target=pos||_libraryScrollPos;if(!target)return;const apply=()=>{const body=document.querySelector('.page-body');if(body&&Number.isFinite(target.pageBody))body.scrollTop=target.pageBody;if(Number.isFinite(target.windowY)&&target.windowY>0)window.scrollTo(0,target.windowY);};apply();requestAnimationFrame(()=>{apply();requestAnimationFrame(apply);});}
function mediaStatusFingerprint(items){return (items||[]).map(item=>`${item.id}:${item.download_status}:${item.processing_status}:${item.download_progress||0}:${item.progress_detail||''}`).join('|');}
function mediaStructureFingerprint(items){return (items||[]).map(item=>`${item.id}:${item.download_status}:${item.processing_status}:${item.authorization_status||''}:${item.asset_id||''}:${item.error_message||''}`).join('|');}
function updateHotspotMediaProgressInPlace(){
  let updated=0;
  hotspotMedia.forEach(item=>{
    const card=document.querySelector(`[data-hotspot-media-id="${item.id}"]`);
    if(!card)return;
    const statusEl=card.querySelector('.hotspot-media-state');
    if(statusEl){statusEl.className=`hotspot-media-state ${escapeHtml(item.processing_status||'')}`;statusEl.textContent=hotspotStatusLabel(item);}
    const progress=hotspotMediaProgress(item);
    let progressEl=card.querySelector('.hotspot-progress');
    if(progress){
      const html=`<div class="hotspot-progress" aria-label="${escapeHtml(progress.label)}"><div class="hotspot-progress-head"><strong>${escapeHtml(progress.label)}</strong><span>${progress.pct}%</span></div><div class="hotspot-progress-track"><div class="hotspot-progress-bar" style="width:${progress.pct}%"></div></div><small>${escapeHtml(progress.detail)}</small></div>`;
      if(progressEl)progressEl.outerHTML=html;else{const state=card.querySelector('.hotspot-media-state');if(state)state.insertAdjacentHTML('afterend',html);}
      updated+=1;
    }else if(progressEl){progressEl.remove();updated+=1;}
    const err=card.querySelector('.hotspot-media-error');
    if(item.error_message){if(err)err.textContent=item.error_message;else{const host=card.querySelector('.hotspot-media-content');if(host)host.insertAdjacentHTML('beforeend',`<div class="hotspot-media-error">${escapeHtml(item.error_message)}</div>`);updated+=1;}}
    else if(err){err.remove();updated+=1;}
  });
  return updated;
}
async function init(){const params=new URLSearchParams(location.search);selectedHotspotId=params.get('hotspot_id')||'';const storedFreshness=sessionStorage.getItem('hotspotLibraryFreshness');hotspotFreshness=params.get('freshness')||storedFreshness||'30d';if(params.get('library')==='hotspot')viewMode='hotspot';await Promise.all([loadAssets(),loadInspirations(),loadHotspots(),loadHotspotMedia(),loadLocalImport()]);hotspotMediaFingerprint=mediaStatusFingerprint(hotspotMedia);window.__hotspotMediaStructureFingerprint=mediaStructureFingerprint(hotspotMedia);render('init');scheduleHotspotMediaPoll();if(localImportJob)scheduleLocalImportPoll();}
async function loadAssets(){const p=new URLSearchParams();if(typeFilter)p.set('type',typeFilter);if(categoryFilter)p.set('category',categoryFilter);if(query)p.set('query',query);const [assetResponse,eventResponse]=await Promise.all([apiFetch('/api/assets?'+p),apiFetch('/api/hotspot-events')]);const allAssets=await assetResponse.json();assets=allAssets.filter(asset=>asset.library_origin!=='hotspot'&&!asset.hotspot_id);hotspotEvents=await eventResponse.json();window.hotspotEventCache=Object.fromEntries(hotspotEvents.map(event=>[event.id,event]));}
async function loadInspirations(){const r=await apiFetch('/api/inspirations');inspirations=await r.json();}
async function loadHotspots(){const r=await apiFetch('/api/hotspots?limit=200');hotspots=await r.json();}
async function loadHotspotMedia(){const p=new URLSearchParams();if(selectedHotspotId)p.set('hotspot_id',selectedHotspotId);if(hotspotMediaKind)p.set('media_kind',hotspotMediaKind);p.set('_ts',Date.now());const r=await apiFetch('/api/hotspot-media?'+p,{cache:'no-store'});hotspotMedia=await r.json();}
function formatSize(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.ceil(n/1024)+' KB';}
function formatHotspotDate(value){if(!value)return '未记录';const date=new Date(value);return Number.isNaN(date.getTime())?String(value):date.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function hotspotIntakeAt(item){const value=item.confirmed_at||item.updated_at||item.created_at||item.published_at;const time=value?new Date(value).getTime():0;return Number.isFinite(time)?time:0;}
function hotspotAgeLabel(item){const time=hotspotIntakeAt(item)||(item.published_at?new Date(item.published_at).getTime():0);if(!time)return '时效未知';const days=Math.max(0,Math.floor((Date.now()-time)/86400000));if(days===0)return '今天';if(days<30)return `${days} 天前`;return '已超过 30 天';}
function withinHotspotFreshness(value){if(hotspotFreshness==='all')return true;if(!value)return false;const time=new Date(value).getTime();if(!time)return false;const days={"24h":1,"3d":3,"7d":7,"30d":30}[hotspotFreshness]||30;return Date.now()-time<=days*86400000;}
function filteredHotspotMedia(){return hotspotMedia.filter(item=>{const archived=item.lifecycle_status==='archived';if(hotspotFreshness==='archived')return archived;if(archived)return false;if(hotspotQuery){const hotspot=hotspots.find(value=>value.id===item.hotspot_id)||{};const haystack=`${hotspot.title_zh||''} ${hotspot.title||''} ${item.publisher||''} ${item.author||''}`.toLowerCase();if(!haystack.includes(hotspotQuery.toLowerCase()))return false;}return withinHotspotFreshness(item.confirmed_at||item.updated_at||item.created_at||item.published_at);});}
function filteredHotspotEvents(){return hotspotEvents.filter(item=>{if(selectedHotspotId&&String(item.hotspot_id)!==String(selectedHotspotId))return false;if(hotspotFreshness==='archived')return false;if(hotspotQuery){const haystack=`${item.title_zh||''} ${item.title_en||''}`.toLowerCase();if(!haystack.includes(hotspotQuery.toLowerCase()))return false;}return withinHotspotFreshness(item.updated_at||item.created_at);});}
function dayKeyFromTime(time){const date=new Date(time);return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;}
function dayLabelFromKey(key){const today=dayKeyFromTime(Date.now());const yesterday=dayKeyFromTime(Date.now()-86400000);if(key===today)return '今天';if(key===yesterday)return '昨天';const [y,m,d]=key.split('-');return `${Number(y)}年${Number(m)}月${Number(d)}日`;}
function groupHotspotLibraryItems(items){const groups=new Map();items.forEach(item=>{const time=item.intakeAt||0;const key=time?dayKeyFromTime(time):'unknown';if(!groups.has(key))groups.set(key,{key,label:time?dayLabelFromKey(key):'时间未知',items:[],hookCount:0,mediaCount:0});const group=groups.get(key);group.items.push(item);if(item.kind==='hook')group.hookCount+=1;else group.mediaCount+=1;});return [...groups.values()].sort((a,b)=>{if(a.key==='unknown')return 1;if(b.key==='unknown')return -1;return b.key.localeCompare(a.key);});}
function syncHotspotLibraryUrl(){const params=new URLSearchParams(location.search);params.set('library','hotspot');if(selectedHotspotId)params.set('hotspot_id',selectedHotspotId);else params.delete('hotspot_id');if(hotspotFreshness&&hotspotFreshness!=='30d')params.set('freshness',hotspotFreshness);else params.delete('freshness');sessionStorage.setItem('hotspotLibraryFreshness',hotspotFreshness);history.replaceState({},'',`${location.pathname}?${params.toString()}`);}

function localImportPanel(){if(!localImportJob)return '';const j=localImportJob,total=Number(j.total||0),done=Number(j.scanned||0),pct=total?Math.min(100,Math.round(done/total*100)):0,active=['pending','scanning','importing','processing','cancel_requested'].includes(j.status),analyzed=assets.filter(a=>['ready','review_required'].includes(a.processing_status)).length;const state=j.status==='offline'?'本地服务已断开，请重启 8080 后刷新':j.status==='succeeded'?'本地素材接入完成，语义分析正在后台排队':j.status==='canceled'?'导入已取消':j.status==='failed'?'导入失败':j.status==='interrupted'?'服务重启导致任务中断，可重新开始':j.status==='cancel_requested'?'正在完成当前文件后取消':'正在接入本地素材';return `<section class="local-import-card"><div class="local-import-head"><div><strong>${escapeHtml(state)}</strong><div>${escapeHtml(j.root_path||'')}</div></div><span>${pct}%</span></div><div class="upload-progress-track"><div class="upload-progress-bar" style="width:${pct}%"></div></div><div class="local-import-stats"><span>总数 ${total}</span><span>已扫描 ${done}</span><span>已入库 ${Number(j.imported||0)}</span><span>重复 ${Number(j.duplicated||0)}</span><span>跳过 ${Number(j.skipped||0)}</span><span>失败 ${Number(j.failed||0)}</span><span>已分析 ${analyzed}</span></div><div class="local-import-current">${j.current_file?`当前：${escapeHtml(j.current_file)}`:'当前没有正在处理的文件'}</div>${active&&j.status!=='cancel_requested'?'<button class="btn btn-secondary btn-sm" onclick="cancelLocalImport()">取消导入</button>':''}${['failed','interrupted','canceled','offline'].includes(j.status)?'<button class="btn btn-primary btn-sm" onclick="startLocalImport()">重新开始</button>':''}</section>`;}

  // #endregion

  // #region agent log

  const scrollPos=captureLibraryScroll();

  document.getElementById('app').innerHTML=`${renderSidebar(PAGE_ID)}<main class="main-content"><div class="page-header asset-page-header"><div class="asset-page-heading"><h1 class="page-title">内容资产</h1><p style="font-size:13px;color:var(--text-muted);margin-top:4px;">管理 Buffalo 自有或已明确授权、可长期复用的视频与图片</p></div><div class="asset-page-actions">${admin?'<button class="btn btn-secondary" onclick="startLocalImport()">接入桌面素材</button>':''}<details class="asset-more-menu"><summary class="btn btn-secondary">更多操作</summary><div class="asset-more-panel">${admin?'<button type="button" onclick="processPendingAssets()">分析存量素材</button>':''}<button type="button" onclick="importDirectory()">扫描项目导入目录</button></div></details><label class="btn btn-primary" style="cursor:pointer;">上传素材<input type="file" multiple accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm" hidden onchange="uploadFiles(this.files);this.value=''"/></label></div></div><div class="page-body"><nav class="asset-view-tabs" aria-label="资产视图"><button class="asset-view-tab active" type="button">原本素材库</button><button class="asset-view-tab" type="button" onclick="viewMode='hotspot';hotspotSubView='media';render()">热点素材库</button></nav><div id="uploadProgress" class="upload-progress" hidden><div class="upload-progress-head"><strong id="uploadProgressTitle">准备上传</strong><span id="uploadProgressPercent">0%</span></div><div class="upload-progress-track"><div id="uploadProgressBar" class="upload-progress-bar"></div></div><div id="uploadProgressDetail" class="upload-progress-detail"></div></div>${localImportPanel()}

function hotspotHasCuratedHooks(item){const detail=String(item.progress_detail||'');return item.processing_status==='ready'&&/筛出\s*\d+\s*条/.test(detail);}
function hotspotStatusLabel(item){if(item.authorization_status==='blocked')return '不可处理';if(['pending','downloading'].includes(item.download_status))return '下载中';if(item.processing_status==='processing')return '分析中';if(item.processing_status==='ready'){const detail=String(item.progress_detail||'');if(detail.includes('未筛出'))return '已分析无 Hook';if(hotspotHasCuratedHooks(item))return 'Hook 已分析';return '已分析';}if(item.download_status==='download_failed'||item.processing_status==='processing_failed')return '处理失败';if(item.authorization_status==='pending_review')return '待确认授权';return '仅链接';}
function hotspotMediaProgress(item){
  if(item.download_status==='download_failed'||item.processing_status==='processing_failed')return {pct:100,label:'处理失败',detail:item.error_message||'可稍后重试'};
  if(item.processing_status==='ready')return {pct:100,label:'已完成',detail:item.progress_detail||'已进入原本素材库，可用于成片'};
  if(item.processing_status==='processing')return {pct:75,label:'正在分析镜头',detail:'提取画面、语音和语义标签'};
  if(item.download_status==='downloaded')return {pct:60,label:'下载完成，准备分析',detail:'本地文件已保存'};
  if(item.download_status==='downloading')return {pct:Number(item.download_progress||35),label:'正在下载媒体',detail:item.progress_detail||'远端速度可能影响耗时'};
  if(item.download_status==='pending')return {pct:10,label:'正在连接来源',detail:'任务已进入下载队列'};
  return null;
}
function scheduleHotspotMediaPoll(){clearInterval(hotspotMediaPollTimer);const activeItems=hotspotMedia.filter(item=>['pending','downloading'].includes(item.download_status)||item.processing_status==='processing');const active=activeItems.length>0;
  // #region agent log
  agentDebugLog('B','assets.html:scheduleHotspotMediaPoll','schedule poll',{active,activeCount:activeItems.length,activeItems:activeItems.slice(0,8).map(i=>({id:i.id,download:i.download_status,processing:i.processing_status})),totalMedia:hotspotMedia.length});

async function pollHotspotMedia(){if(hotspotMediaPolling)return;hotspotMediaPolling=true;try{
  const scrollBefore=captureLibraryScroll();
  // #region agent log
  agentDebugLog('B','assets.html:pollHotspotMedia','poll tick before load',{scroll:scrollBefore,mediaCount:hotspotMedia.length,fingerprint:hotspotMediaFingerprint});
  // #endregion
  await loadHotspotMedia();hotspotMediaPollFailures=0;
  const nextStructure=mediaStructureFingerprint(hotspotMedia);
  const nextFingerprint=mediaStatusFingerprint(hotspotMedia);
  const structureChanged=nextStructure!==(window.__hotspotMediaStructureFingerprint||'');
  const changed=nextFingerprint!==hotspotMediaFingerprint;
  window.__hotspotMediaStructureFingerprint=nextStructure;
  hotspotMediaFingerprint=nextFingerprint;
  let mode='noop';
  if(structureChanged){mode='full-render';render('pollHotspotMedia-structure');}
  else if(changed){mode='in-place';updateHotspotMediaProgressInPlace();}
  // #region agent log
  agentDebugLog('B','assets.html:pollHotspotMedia:decision','poll render decision',{mode,structureChanged,changed,active:hotspotMedia.some(item=>['pending','downloading'].includes(item.download_status)||item.processing_status==='processing'),scrollBefore,scrollAfter:captureLibraryScroll()});
  // #endregion
  if(!hotspotMedia.some(item=>['pending','downloading'].includes(item.download_status)||item.processing_status==='processing'))scheduleHotspotMediaPoll();}catch(e){hotspotMediaPollFailures++;}finally{hotspotMediaPolling=false;}}

async function discoverHotspotMedia(){if(!selectedHotspotId)return;try{const r=await apiFetch(`/api/hotspots/${selectedHotspotId}/media/discover`,{method:'POST'});const data=await r.json();await loadHotspotMedia();render();const skipped=Number(data.skipped_unavailable||0);showToast(`发现 ${data.items.length} 条媒体，新增 ${data.created} 条${skipped?`，跳过 ${skipped} 条不可用图片`:''}`);}catch(e){showToast(e.message,'error');}}
async function materializeHotspotMedia(id){if(hotspotMediaBusy.has(id))return;const item=hotspotMedia.find(value=>value.id===id);if(!item)return showToast('素材不存在','error');if(item.authorization_status==='blocked')return showToast('该素材当前不可处理','error');hotspotMediaBusy.add(id);render();try{await apiFetch(`/api/hotspot-media/${id}/materialize`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirmed:true})});await loadHotspotMedia();showToast(item.media_kind==='image'?'已提交图片下载与分析':'已提交视频下载与分析');scheduleHotspotMediaPoll();}catch(e){showToast(e.message,'error');}finally{hotspotMediaBusy.delete(id);render();}}
async function deleteHotspotEvent(eventId){if(!confirm('确定只删除这一个热点 Hook 吗？母片和同一母片的其他 Hook 会保留。'))return;try{const r=await apiFetch(`/api/hotspot-events/${eventId}`,{method:'DELETE'});const d=await r.json();await Promise.all([loadAssets(),loadHotspotMedia()]);render();showToast(`已删除 1 条热点 Hook`);}catch(e){showToast(e.message,'error');}}
async function cleanupIneligibleHooks(){if(!confirm('将删除所有缺少明确画面事实、Hook 原因、物流切入或本地预览的旧 Hook。热点母片与合格 Hook 不会删除，确定继续？'))return;try{const r=await apiFetch('/api/hotspot-events/cleanup-ineligible',{method:'POST'});const d=await r.json();await Promise.all([loadAssets(),loadHotspotMedia()]);render();showToast(`已清理 ${d.event_clip_count||0} 条不合格 Hook`);}catch(e){showToast(e.message,'error');}}
async function deleteHotspotEventAsset(assetId){if(!confirm('确定删除整条热点母片吗？同一母片生成的全部 Hook、分析索引和本地文件都会一并删除。'))return;try{const r=await apiFetch(`/api/hotspot-event-assets/${assetId}`,{method:'DELETE'});const d=await r.json();await Promise.all([loadAssets(),loadHotspotMedia()]);render();showToast(`已删除热点母片及 ${d.event_clip_count} 条 Hook`);}catch(e){showToast(e.message,'error');}}
async function deleteHotspotMedia(id){const item=hotspotMedia.find(value=>value.id===id);if(!item)return;const name=(hotspots.find(value=>value.id===item.hotspot_id)||{}).title_zh||(hotspots.find(value=>value.id===item.hotspot_id)||{}).title||'该热点素材';if(!confirm(`确定删除“${name}”的这条素材吗？已下载的源文件、事件片段和分析索引也会一并移除。`))return;try{const r=await apiFetch(`/api/hotspot-media/${id}`,{method:'DELETE'});const d=await r.json();await Promise.all([loadAssets(),loadHotspotMedia()]);render();showToast(`已删除 1 条热点素材${d.local_file_count?`，清理 ${d.local_file_count} 个本地文件`:''}`);}catch(e){showToast(e.message,'error');}}
async function clearHotspotLibrary(){try{const previewResponse=await apiFetch('/api/hotspot-library/cleanup-preview');const preview=await previewResponse.json();if(preview.active_media_count){showToast(`有 ${preview.active_media_count} 条热点素材正在下载或分析，请等待完成后再清空`,'error');return;}const summary=`将删除 ${preview.media_count} 条热点媒体、${preview.asset_count} 个已下载源素材、${preview.event_clip_count} 个事件片段和 ${preview.segment_count} 条分析镜头，预计释放 ${formatSize(Number(preview.estimated_bytes||0))}。\n\n不会删除 Buffalo 原有素材、热点事实/信源、RAG 知识库或项目记录；旧项目若引用这些热点素材，之后需重新选材才能渲染。`;if(!confirm(summary+'\n\n确定继续？'))return;const confirmation=prompt('请输入“清空热点素材库”确认：');if(confirmation!=='清空热点素材库')return showToast('未输入正确确认文字，未执行删除','error');const r=await apiFetch('/api/hotspot-library',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirmation})});const d=await r.json();await Promise.all([loadAssets(),loadHotspotMedia()]);render();showToast(`热点素材库已清空：${d.media_count} 条媒体，${d.local_file_count} 个本地文件`);}catch(e){showToast(e.message,'error');}}
function inspirationCard(item,admin){const materialized=item.materialization_status==='materialized';const sourceNames={youtube:'YouTube',tiktok:'TikTok',official_news:'官方新闻',secondary_discovery:'二级热点发现',licensed_media:'开放许可媒体',other_link:'外部链接'};return `<article class="card inspiration-card"><div class="inspiration-thumb">${item.thumbnail_url?`<img src="${escapeHtml(item.thumbnail_url)}" alt=""/>`:'<svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor" aria-hidden="true"><path d="M3.9 12a5 5 0 017.1-7.1l1.4 1.4-1.4 1.4-1.4-1.4a3 3 0 00-4.2 4.2l2.1 2.1a3 3 0 004.2 0l1.4 1.4a5 5 0 01-7.1 0L3.9 12zm6.9-2a5 5 0 017.1 0l2.1 2a5 5 0 01-7.1 7.1l-1.4-1.4 1.4-1.4 1.4 1.4a3 3 0 004.2-4.2l-2.1-2.1a3 3 0 00-4.2 0L10.8 10z"/></svg>'}</div><div class="inspiration-content"><div class="candidate-row"><strong>${escapeHtml(item.title)}</strong><span class="source-pill">${escapeHtml(sourceNames[item.source_type]||item.source_type)}</span></div><p>${escapeHtml(item.summary||'暂无摘要')}</p><div class="rights-line">版权：${item.rights_status==='licensed'?'开放许可':item.rights_status==='confirmed'?'已确认授权':item.rights_status==='restricted'?'受限，仅可作发现链接':item.rights_status==='rejected'?'禁止使用':'未确认'} · ${materialized?'已进入素材库':'仅灵感参考'}</div><div class="asset-actions"><a class="btn btn-secondary btn-sm" href="${escapeHtml(item.canonical_url)}" target="_blank" rel="noopener noreferrer">打开原链接</a>${admin?`<button class="btn btn-ghost btn-sm" onclick="confirmRights(${item.id})">登记授权</button>${!materialized?`<button class="btn btn-primary btn-sm" onclick="materialize(${item.id})" ${!['confirmed','licensed'].includes(item.rights_status)?'disabled':''}>确认后下载</button>`:''}`:''}</div></div></article>`;}
async function addInspirationBatch(){const rows=document.getElementById('inspirationUrls').value.split('\n').map(value=>value.trim()).filter(Boolean);if(!rows.length){showToast('请至少填写一个链接','error');return;}const items=rows.map(row=>{const parts=row.split('|');return {url:parts.shift().trim(),title:parts.join('|').trim()};});try{const r=await apiFetch('/api/inspirations/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items})});const d=await r.json();showToast(`已保存 ${d.items.length} 条${d.errors.length?`，失败 ${d.errors.length} 条`:''}`,d.errors.length?'error':'success');await loadInspirations();render();}catch(e){showToast(e.message,'error');}}
async function confirmRights(id){const license_name=prompt('授权/许可证名称（必填）');if(!license_name)return;const attribution=prompt('署名信息（必填）');if(!attribution)return;const rights_evidence_url=prompt('授权证据 HTTPS 链接（必填）');if(!rights_evidence_url)return;try{await apiFetch(`/api/inspirations/${id}/rights`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({rights_status:'confirmed',license_name,attribution,rights_evidence_url})});showToast('授权证据已登记');await loadInspirations();render();}catch(e){showToast(e.message,'error');}}
async function materialize(id){if(!confirm('请确认：你已核实此内容允许下载、编辑并用于商业发布。系统不会使用登录 Cookie，也不会绕过平台限制。'))return;try{await apiFetch(`/api/inspirations/${id}/materialize`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirmed:true})});showToast('已提交下载与素材分析任务');await loadInspirations();render();}catch(e){showToast(e.message,'error');}}
async function processAsset(id){try{await apiFetch(`/api/assets/${id}/process`,{method:'POST'});showToast('已提交重新分析');setTimeout(refresh,800);}catch(e){showToast(e.message,'error');}}
async function processPendingAssets(){try{const r=await apiFetch('/api/assets/process-pending',{method:'POST'});const d=await r.json();showToast(d.count?`已提交 ${d.count} 条存量素材分析`:'没有待处理素材');setTimeout(refresh,1000);}catch(e){showToast(e.message,'error');}}
async function loadLocalImport(){try{const r=await apiFetch('/api/assets/local-imports/active');const items=await r.json();if(items.length)localImportJob=items[0];localImportFailures=0;}catch(e){localImportFailures++;}}
function scheduleLocalImportPoll(){clearTimeout(localImportTimer);if(localImportJob&&['pending','scanning','importing','processing','cancel_requested'].includes(localImportJob.status))localImportTimer=setTimeout(pollLocalImport,1500);}
async function startLocalImport(){clearTimeout(localImportTimer);try{const r=await apiFetch('/api/assets/local-imports',{method:'POST'});const d=await r.json();localImportJob=d.job;localImportFailures=0;render();scheduleLocalImportPoll();showToast(d.created?'已开始接入桌面素材':'已有导入任务正在运行');}catch(e){showToast(e.message,'error');}}
async function pollLocalImport(){if(!localImportJob)return;try{const r=await apiFetch(`/api/assets/local-imports/${localImportJob.id}`);localImportJob=await r.json();localImportFailures=0;
  // #region agent log
  agentDebugLog('C','assets.html:pollLocalImport','local import poll render',{status:localImportJob.status,scroll:captureLibraryScroll(),viewMode});
  // #endregion
  const terminal=['succeeded','failed','canceled','interrupted'].includes(localImportJob.status);
  if(terminal)await loadAssets();
  const panel=document.querySelector('.local-import-card');
  const html=localImportPanel();
  if(!terminal&&panel&&html&&viewMode==='materials'){panel.outerHTML=html;}
  else{render('pollLocalImport');}
  scheduleLocalImportPoll();}catch(e){localImportFailures++;if(localImportFailures>=3){clearTimeout(localImportTimer);localImportJob={...localImportJob,status:'offline',current_file:''};render('pollLocalImport-offline');return;}localImportTimer=setTimeout(pollLocalImport,1500);}}
async function cancelLocalImport(){if(!localImportJob)return;try{const r=await apiFetch(`/api/assets/local-imports/${localImportJob.id}/cancel`,{method:'POST'});localImportJob=await r.json();render();scheduleLocalImportPoll();}catch(e){showToast(e.message,'error');}}
function useHotspotEvent(eventId){const event=(window.hotspotEventCache||{})[eventId];if(!event)return showToast('事件片段已失效，请刷新后重试','error');localStorage.setItem('selectedHotspotEventClip',JSON.stringify({event_clip_id:event.id,asset_id:event.asset_id,start_ms:event.start_ms,end_ms:event.end_ms,title_zh:event.title_zh,title_en:event.title_en,virtual_asset:event.virtual_asset}));location.href=`/video-followup.html?event_clip_id=${encodeURIComponent(event.id)}`;}
async function viewHotspotEvents(assetId){try{const r=await apiFetch(`/api/hotspot-events?asset_id=${assetId}`,{cache:'no-store'});const events=await r.json();window.hotspotEventCache=Object.fromEntries(events.map(event=>[event.id,event]));document.getElementById('assetDetailContent').innerHTML=events.length?`<p class="asset-detail-help">每张卡都是内置模型从母片中筛出的独立 Hook；只有带“画面发生”和物流切入问题的片段才可匹配。原始母片不会直接进入成片。</p>`+events.map(event=>{const e=event.evidence||{};return `<article class="asset-detail-item"><strong>${escapeHtml(event.title_zh)}</strong><div>${escapeHtml(event.title_en)} · ${(event.start_ms/1000).toFixed(1)}–${(event.end_ms/1000).toFixed(1)} 秒 · ${((event.duration_ms||event.end_ms-event.start_ms)/1000).toFixed(1)} 秒片段</div><p><b>画面发生：</b>${escapeHtml(e.what_happened||'无可核验画面事实')}</p><p><b>为什么可作 Hook：</b>${escapeHtml(e.hook_reason||'无')}</p><p><b>物流切入：</b>${escapeHtml(e.logistics_question||'无')}</p><div><strong>Buffalo 原有素材候选</strong>：${(event.matches?.owned_candidates||[]).map(item=>escapeHtml(item.description||'素材')).join('、')||escapeHtml(event.matches?.owned_match_reason||'暂无可靠匹配')}</div><button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="useHotspotEvent(${event.id})">加入视频跟进</button></article>`;}).join(''):'<div class="empty-state">暂无通过内置模型策展的 Hook，请先下载并完成母片镜头分析。</div>';document.getElementById('assetDetailModal').hidden=false;}catch(e){showToast(e.message,'error');}}
async function viewSegments(assetId){try{const r=await apiFetch(`/api/asset-segments?asset_id=${assetId}`);const items=await r.json();const admin=getCurrentUser().role==='admin';const keepActive=segmentEditAssetId===assetId?segmentActiveId:null;segmentEditAssetId=assetId;segmentEditCache={};segmentMetaCache={};segmentEditOrder=[];items.forEach(segment=>{segmentMetaCache[segment.id]=segment;segmentEditOrder.push(segment.id);segmentEditCache[segment.id]={primary_category:segment.primary_category||'other',tags:(segment.tags||[]).map(tag=>({dimension:tag.dimension,value:tag.value}))};});segmentActiveId=keepActive&&segmentEditOrder.includes(keepActive)?keepActive:(segmentEditOrder[0]||null);const title=document.getElementById('assetDetailTitle');if(title)title.textContent=admin?`镜头标签 · 逐镜精修（${items.length} 镜）`:'镜头标签';if(!items.length){document.getElementById('assetDetailContent').innerHTML='<div class="empty-state">素材仍在分析或尚未生成镜头</div>';}else if(admin){renderSegmentTaggingWorkbench();}else{document.getElementById('assetDetailContent').innerHTML=items.map((segment,index)=>renderSegmentReadonly(segment,index)).join('');}document.getElementById('assetDetailModal').hidden=false;}catch(e){showToast(e.message,'error');}}
function segmentConfirmedCount(){return segmentEditOrder.filter(id=>segmentMetaCache[id]?.primary_category_source==='manual').length;}
function syncActiveCategoryFromDom(){if(!segmentActiveId)return;const select=document.querySelector(`.segment-editor[data-segment-id="${segmentActiveId}"] .segment-category-select`);if(select&&segmentEditCache[segmentActiveId])segmentEditCache[segmentActiveId].primary_category=select.value;}
function focusSegmentShot(segmentId){syncActiveCategoryFromDom();segmentActiveId=Number(segmentId);renderSegmentTaggingWorkbench();}
function focusNextSegmentShot(preferUnconfirmed){const start=Math.max(0,segmentEditOrder.indexOf(Number(segmentActiveId)));for(let step=1;step<=segmentEditOrder.length;step++){const id=segmentEditOrder[(start+step)%segmentEditOrder.length];if(!preferUnconfirmed||segmentMetaCache[id]?.primary_category_source!=='manual'){segmentActiveId=id;return;}} }
function renderSegmentTaggingWorkbench(){const total=segmentEditOrder.length,confirmed=segmentConfirmedCount();const activeId=segmentActiveId||segmentEditOrder[0];segmentActiveId=activeId;const index=Math.max(0,segmentEditOrder.indexOf(Number(activeId)));const meta=segmentMetaCache[activeId];const draft=segmentEditCache[activeId]||{primary_category:'other',tags:[]};const batchOptions=Object.entries(categoryNames).map(([k,v])=>`<option value="${k}" ${draft.primary_category===k?'selected':''}>${v}</option>`).join('');const nav=segmentEditOrder.map((id,i)=>{const item=segmentMetaCache[id]||{},d=segmentEditCache[id]||{};const done=item.primary_category_source==='manual';return `<button type="button" class="shot-nav-item${id===activeId?' active':''}${done?' done':''}" onclick="focusSegmentShot(${id})"><span class="shot-nav-index">镜头 ${i+1}</span><span class="shot-nav-time">${((item.start_ms||0)/1000).toFixed(0)}–${((item.end_ms||0)/1000).toFixed(0)}s</span><span class="shot-nav-cat">${escapeHtml(categoryNames[d.primary_category]||d.primary_category||'待定')}</span><span class="shot-nav-state">${done?'已确认':'待确认'}</span></button>`;}).join('');const oneClickHint=segmentEditAssetId?`<button type="button" class="btn btn-secondary btn-sm" onclick="closeAssetDetail();openOneClickTag(${segmentEditAssetId})">一键打标</button>`:'';document.getElementById('assetDetailContent').innerHTML=`<p class="asset-detail-help">${escapeHtml(CATEGORY_MATCH_HINT)} 长视频优先用「一键打标」统一主场景；此处为逐镜精修。批量只改主场景，保留各镜已有细标签。</p><div class="shot-tag-toolbar"><strong>进度 ${confirmed}/${total}</strong>${oneClickHint}<label class="shot-batch-label">批量主场景<select id="batchPrimaryCategory" class="select">${batchOptions}</select></label><button type="button" class="btn btn-secondary btn-sm" onclick="batchApplyPrimaryCategory(false)" ${segmentBatchBusy?'disabled':''}>应用到未确认</button><button type="button" class="btn btn-ghost btn-sm" onclick="batchApplyPrimaryCategory(true)" ${segmentBatchBusy?'disabled':''}>应用到全部</button></div><div class="shot-tag-layout"><nav class="shot-nav" aria-label="镜头列表">${nav}</nav><div class="shot-editor-pane">${meta?renderSegmentEditor({...meta,primary_category:draft.primary_category,tags:draft.tags},index):'<div class="empty-state">请选择镜头</div>'}</div></div>`;}
function renderSegmentReadonly(segment,index){const groups={scene:[],object:[],action:[],other:[]};(segment.tags||[]).forEach(tag=>(groups[tag.dimension]||groups.other).push(tag.value));const label=[['场景',groups.scene],['对象',groups.object],['动作',groups.action],['其他',groups.other]].filter(([,values])=>values.length).map(([name,values])=>`${name}：${values.map(escapeHtml).join('、')}`).join(' · ')||'无';const source=segment.primary_category_source==='manual'?'人工确认':(segment.primary_category_source||'自动');return `<article class="asset-detail-item"><strong>镜头 ${index+1} · ${(segment.start_ms/1000).toFixed(1)}–${(segment.end_ms/1000).toFixed(1)} 秒</strong><p>${escapeHtml(segment.description||'暂无识别描述')}</p><div>主场景：${escapeHtml(categoryNames[segment.primary_category]||segment.primary_category||'待复核')} · 来源：${escapeHtml(source)} · ${label}</div></article>`;}
function renderSegmentEditor(segment,index){const draft=segmentEditCache[segment.id]||{primary_category:'other',tags:[]};const tagsByDim=Object.fromEntries(TAG_DIMENSIONS.map(([dim])=>[dim,[]]));(draft.tags||[]).forEach(tag=>{if(tagsByDim[tag.dimension])tagsByDim[tag.dimension].push(tag.value);else tagsByDim.object.push(tag.value);});const categoryOptions=Object.entries(categoryNames).map(([k,v])=>`<option value="${k}" ${draft.primary_category===k?'selected':''}>${v}</option>`).join('');const sourceBadge=segment.primary_category_source==='manual'?'<span class="tag-source-badge manual">已人工确认</span>':'<span class="tag-source-badge auto">待人工确认 / 自动识别</span>';const dimBlocks=TAG_DIMENSIONS.map(([dim,label])=>{const values=tagsByDim[dim]||[];const chips=values.map(value=>`<button type="button" class="tag-chip active" onclick="removeSegmentTag(${segment.id},'${dim}',${JSON.stringify(value)})">${escapeHtml(value)} ×</button>`).join('');const presets=(TAG_PRESETS[dim]||[]).filter(value=>!values.includes(value)).map(value=>`<button type="button" class="tag-chip preset" onclick="addSegmentTag(${segment.id},'${dim}',${JSON.stringify(value)})">+ ${escapeHtml(value)}</button>`).join('');return `<div class="tag-dim-row"><div class="tag-dim-label">${label}</div><div class="tag-chip-row">${chips||'<span class="tag-empty">暂无</span>'}${presets}<span class="tag-add-inline"><input class="input tag-add-input" id="tag-add-${segment.id}-${dim}" placeholder="自定义" onkeydown="if(event.key==='Enter'){event.preventDefault();commitCustomTag(${segment.id},'${dim}');}"/><button type="button" class="btn btn-ghost btn-sm" onclick="commitCustomTag(${segment.id},'${dim}')">添加</button></span></div></div>`;}).join('');const hasNext=segmentEditOrder.length>1;return `<article class="asset-detail-item segment-editor" data-segment-id="${segment.id}"><div class="segment-editor-head"><strong>镜头 ${index+1} / ${segmentEditOrder.length} · ${(segment.start_ms/1000).toFixed(1)}–${(segment.end_ms/1000).toFixed(1)} 秒</strong>${sourceBadge}</div><p>${escapeHtml(segment.description||'暂无识别描述')}</p><label class="field-label">主场景（粗分类，只做节点门禁；细匹配看下方标签）</label><select class="select segment-category-select" onchange="segmentEditCache[${segment.id}].primary_category=this.value">${categoryOptions}</select><div class="tag-editor-block">${dimBlocks}</div><div class="segment-editor-actions"><button class="btn btn-primary btn-sm" onclick="saveSegmentClassification(${segment.id})">保存此镜头标签</button>${hasNext?`<button class="btn btn-secondary btn-sm" onclick="saveSegmentClassification(${segment.id},{goNext:true})">保存并下一镜</button>`:''}</div></article>`;}
function addSegmentTag(segmentId,dimension,value){const draft=segmentEditCache[segmentId];if(!draft)return;const clean=String(value||'').trim();if(!clean)return;if(!(draft.tags||[]).some(tag=>tag.dimension===dimension&&tag.value===clean))draft.tags.push({dimension,value:clean});rerenderSegmentEditor(segmentId);}
function removeSegmentTag(segmentId,dimension,value){const draft=segmentEditCache[segmentId];if(!draft)return;draft.tags=(draft.tags||[]).filter(tag=>!(tag.dimension===dimension&&tag.value===value));rerenderSegmentEditor(segmentId);}
function commitCustomTag(segmentId,dimension){const input=document.getElementById(`tag-add-${segmentId}-${dimension}`);if(!input)return;const value=input.value.trim();if(!value)return;addSegmentTag(segmentId,dimension,value);}
function rerenderSegmentEditor(segmentId){segmentActiveId=Number(segmentId);renderSegmentTaggingWorkbench();}
function patchAssetCardCategory(assetId,category){const item=assets.find(a=>a.id===assetId);if(item){item.category=category;item.primary_category=category;item.primary_category_source='manual';}const label=categoryNames[category]||category;const card=document.querySelector(`.asset-card[data-asset-id="${assetId}"]`);if(!card)return;const meta=card.querySelector('.asset-info>div:nth-child(2)');if(!meta)return;const source=item?(item.library_origin==='hotspot'?'热点原始母片':(item.source_label||'Buffalo 原有素材')):'Buffalo 原有素材';const shotCount=Number(item?.segment_count||0);const shotMeta=shotCount>1?`${shotCount}镜 · `:'';const duration=item?.duration?`${Math.round(item.duration)}秒 · `:'';const size=item?formatSize(item.size):'';meta.textContent=`${source} · ${label} · ${shotMeta}${duration}${size}`;}
async function saveSegmentClassification(segmentId,opts={}){const draft=segmentEditCache[segmentId];if(!draft)return false;syncActiveCategoryFromDom();const primary_category=draft.primary_category||'other';if(!categoryNames[primary_category]){showToast('主场景无效','error');return false;}try{const r=await apiFetch(`/api/asset-segments/${segmentId}/classification`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({primary_category,tags:draft.tags||[]})});const saved=await r.json();segmentMetaCache[segmentId]=saved;segmentEditCache[segmentId]={primary_category:saved.primary_category,tags:(saved.tags||[]).map(tag=>({dimension:tag.dimension,value:tag.value}))};if(segmentEditAssetId)patchAssetCardCategory(segmentEditAssetId,saved.primary_category);if(!opts.silent)showToast(`镜头标签已保存为「${categoryNames[saved.primary_category]||saved.primary_category}」`);if(opts.goNext)focusNextSegmentShot(true);renderSegmentTaggingWorkbench();if(!opts.skipAssetReload){await loadAssets();patchAssetCardCategory(segmentEditAssetId,saved.primary_category);}return true;}catch(e){showToast(e.message,'error');return false;}}
async function batchApplyPrimaryCategory(applyAll){if(segmentBatchBusy||!segmentEditOrder.length)return;const select=document.getElementById('batchPrimaryCategory');const category=select?select.value:(segmentEditCache[segmentActiveId]?.primary_category||'other');if(!categoryNames[category]){showToast('主场景无效','error');return;}const targets=segmentEditOrder.filter(id=>applyAll||segmentMetaCache[id]?.primary_category_source!=='manual');if(!targets.length){showToast('没有需要批量更新的镜头');return;}if(!confirm(`将把主场景设为「${categoryNames[category]}」并保存 ${targets.length} 个镜头？细标签保留不变。`))return;segmentBatchBusy=true;renderSegmentTaggingWorkbench();let ok=0,fail=0;try{for(const id of targets){if(segmentEditCache[id])segmentEditCache[id].primary_category=category;const saved=await saveSegmentClassification(id,{silent:true,skipAssetReload:true});if(saved)ok++;else fail++;}await loadAssets();if(segmentEditAssetId)patchAssetCardCategory(segmentEditAssetId,category);showToast(`批量保存完成：成功 ${ok}${fail?`，失败 ${fail}`:''}`,fail?'error':'success');}finally{segmentBatchBusy=false;renderSegmentTaggingWorkbench();}}
async function resolveAssetSegmentCount(asset){let count=Number(asset?.segment_count);if(Number.isFinite(count)&&count>0)return count;try{const r=await apiFetch(`/api/asset-segments?asset_id=${asset.id}`);const items=await r.json();count=Array.isArray(items)?items.length:0;if(asset)asset.segment_count=count;return count;}catch{return 0;}}

async function openOneClickTag(assetId){const asset=assets.find(a=>a.id===assetId);if(!asset){showToast('素材不存在','error');return;}oneClickAssetId=assetId;oneClickSelected=new Set(['buffalo']);const help=document.getElementById('oneClickTagHelp');if(help)help.textContent=oneClickHelpText(asset.name,Number(asset.segment_count)||0);const select=document.getElementById('oneClickPrimaryCategory');select.innerHTML=Object.entries(categoryNames).map(([k,v])=>`<option value="${k}" ${(asset.primary_category||asset.category)===k?'selected':''}>${v}</option>`).join('');const replace=document.getElementById('oneClickReplaceTags');if(replace)replace.checked=false;renderOneClickPresets();const applyBtn=document.getElementById('oneClickApplyBtn');if(applyBtn){applyBtn.disabled=false;applyBtn.textContent='应用到全部镜头';}document.getElementById('oneClickTagModal').hidden=false;const count=await resolveAssetSegmentCount(asset);if(oneClickAssetId!==assetId)return;if(help)help.textContent=oneClickHelpText(asset.name,count);}
function renderOneClickPresets(){const host=document.getElementById('oneClickTagPresets');if(!host)return;host.innerHTML=QUICK_TAG_PRESETS.map(preset=>{const on=oneClickSelected.has(preset.id);return `<button type="button" class="tag-chip${on?' active':''}" onclick="toggleOneClickPreset('${preset.id}')">${escapeHtml(preset.label)}</button>`;}).join('');}

async function applyOneClickViaSegments(assetId,primary,tags,replaceTags){const list=await apiFetch(`/api/asset-segments?asset_id=${assetId}`);const items=await list.json();if(!Array.isArray(items)||!items.length)throw new Error('素材尚无镜头');let updated=0;for(const seg of items){const existing=(seg.tags||[]).map(tag=>({dimension:tag.dimension,value:tag.value}));let finalTags;if(replaceTags){finalTags=tags.map(tag=>({dimension:tag.dimension,value:tag.value}));}else{finalTags=existing.slice();tags.forEach(tag=>{if(!finalTags.some(item=>item.dimension===tag.dimension&&item.value===tag.value))finalTags.push({dimension:tag.dimension,value:tag.value});});}await apiFetch(`/api/asset-segments/${seg.id}/classification`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({primary_category:primary,tags:finalTags})});updated++;}return{updated,total:updated,asset_id:assetId};}
async function submitOneClickTag(){if(oneClickBusy||!oneClickAssetId)return;const primary=document.getElementById('oneClickPrimaryCategory')?.value||'other';if(!categoryNames[primary]){showToast('主场景无效','error');return;}const tags=[];QUICK_TAG_PRESETS.forEach(preset=>{if(!oneClickSelected.has(preset.id))return;preset.tags.forEach(tag=>{if(!tags.some(item=>item.dimension===tag.dimension&&item.value===tag.value))tags.push({dimension:tag.dimension,value:tag.value});});});const replaceTags=!!document.getElementById('oneClickReplaceTags')?.checked;oneClickBusy=true;const applyBtn=document.getElementById('oneClickApplyBtn');if(applyBtn){applyBtn.disabled=true;applyBtn.textContent='打标中…';}try{let result;try{const r=await apiFetch(`/api/assets/${oneClickAssetId}/classify-all`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({primary_category:primary,tags,replace_tags:replaceTags})});result=await r.json();}catch(e){const msg=String(e.message||'');if(msg==='Not Found'||/not found/i.test(msg)){result=await applyOneClickViaSegments(oneClickAssetId,primary,tags,replaceTags);}else{throw e;}}const updated=Number(result.updated||0),total=Number(result.total||updated);patchAssetCardCategory(oneClickAssetId,primary);const item=assets.find(a=>a.id===oneClickAssetId);if(item)item.segment_count=total;showToast(`已打标 ${updated}/${total}`,'success');const taggedId=result.asset_id||oneClickAssetId;closeOneClickTag();await loadAssets();patchAssetCardCategory(taggedId,primary);}catch(e){const msg=String(e.message||'');showToast(msg==='Not Found'||/not found/i.test(msg)?'一键打标接口未加载，请重启 8080 后再试':msg,'error');if(applyBtn){applyBtn.disabled=false;applyBtn.textContent='应用到全部镜头';}oneClickBusy=false;}}
function closeAssetDetail(){document.getElementById('assetDetailModal').hidden=true;const title=document.getElementById('assetDetailTitle');if(title)title.textContent='素材详情';segmentEditCache={};segmentMetaCache={};segmentEditOrder=[];segmentEditAssetId=null;segmentActiveId=null;segmentBatchBusy=false;}
async function openRetentionPreview(){const modal=document.getElementById('retentionModal'),content=document.getElementById('retentionPreviewContent');modal.hidden=false;content.innerHTML='<p class="retention-help">正在计算可安全释放的空间…</p>';try{const r=await apiFetch('/api/media-retention/preview');const d=await r.json();const candidates=[...(d.candidates||[]),...(d.output_candidates||[])];content.innerHTML=`<div class="retention-summary"><div><strong>${Number(d.candidate_count||0)+Number(d.output_candidate_count||0)}</strong><span>待清理文件</span></div><div><strong>${formatSize(Number(d.estimated_bytes||0))}</strong><span>预计释放</span></div><div><strong>${Number(d.archived_count||0)}</strong><span>本次归档候选</span></div></div><p class="retention-help">当前为安全预览，不会删除文件。热点源文件保留 7 天，最终成片保留 30 天。</p><div class="retention-list">${candidates.map(item=>`<article><strong>${escapeHtml(item.name||item.job_id||'媒体文件')}</strong><span>${formatSize(Number(item.size_bytes||0))} · ${escapeHtml(item.reason||'')}</span></article>`).join('')||'<p>当前没有到期文件。</p>'}</div>`;}catch(e){content.innerHTML=`<p class="hotspot-media-error">${escapeHtml(e.message)}</p>`;}}

function toggleSelect(id,e){e&&e.stopPropagation();if(selected.has(id))selected.delete(id);else selected.add(id);const card=document.querySelector(`.asset-card[data-asset-id="${id}"]`);if(card){card.classList.toggle('selected',selected.has(id));const cb=card.querySelector('.asset-check');if(cb)cb.checked=selected.has(id);syncSelectionChrome();return;}render('toggleSelect-fallback');}
function toggleSelectAll(check){const visible=visibleMaterialAssets();if(check)visible.forEach(a=>selected.add(a.id));else visible.forEach(a=>selected.delete(a.id));let patched=0;visible.forEach(a=>{const card=document.querySelector(`.asset-card[data-asset-id="${a.id}"]`);if(!card)return;patched+=1;card.classList.toggle('selected',selected.has(a.id));const cb=card.querySelector('.asset-check');if(cb)cb.checked=selected.has(a.id);});if(patched===visible.length){syncSelectionChrome(visible);return;}render('toggleSelectAll-fallback');}
async function deleteSelected(){if(!selected.size)return;if(!confirm(`确定删除选中的 ${selected.size} 个素材？已被视频任务引用的素材只会停用。`))return;let deleted=0,inactive=0,failed=0;for(const id of [...selected]){try{const r=await apiFetch(`/api/assets/${id}`,{method:'DELETE'});const d=await r.json();if(d.status==='inactive')inactive++;else deleted++;}catch(e){failed++;}}selected.clear();showToast(`已删除 ${deleted} 个，停用 ${inactive} 个${failed?`，失败 ${failed} 个`:''}`,failed?'error':'success');await refresh();}
function uploadOne(file,onProgress){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST','/api/assets/upload?category='+encodeURIComponent(categoryFilter||'auto'));const token=localStorage.getItem('token');if(token)xhr.setRequestHeader('Authorization','Bearer '+token);xhr.upload.onprogress=e=>{if(e.lengthComputable)onProgress(e.loaded,e.total);};xhr.onload=()=>{let data={};try{data=JSON.parse(xhr.responseText||'{}');}catch{}if(xhr.status===401){localStorage.removeItem('token');localStorage.removeItem('user');location.href='/login.html';return reject(new Error('登录已过期'));}if(xhr.status<200||xhr.status>=300)return reject(new Error(data.detail||`请求失败 (${xhr.status})`));resolve(data);};xhr.onerror=()=>reject(new Error('网络中断，请重试'));const fd=new FormData();fd.append('file',file);xhr.send(fd);});}
async function uploadFiles(files){const list=Array.from(files||[]);if(!list.length)return;const panel=document.getElementById('uploadProgress'),title=document.getElementById('uploadProgressTitle'),percent=document.getElementById('uploadProgressPercent'),bar=document.getElementById('uploadProgressBar'),detail=document.getElementById('uploadProgressDetail');panel.hidden=false;let dup=0,ok=0,fail=0,react=0;for(let i=0;i<list.length;i++){const file=list[i],isVideo=file.type.startsWith('video/')||/\.(mp4|mov|webm)$/i.test(file.name),limit=isVideo?MAX_VIDEO_UPLOAD:MAX_IMAGE_UPLOAD;title.textContent=`上传 ${i+1}/${list.length}：${file.name}`;if(file.size>limit){fail++;percent.textContent='失败';bar.style.width='0%';detail.textContent=`文件 ${(file.size/1048576).toFixed(1)} MB，超过${isVideo?'2 GB':'15 MB'}限制`;continue;}try{const d=await uploadOne(file,(loaded,total)=>{const p=Math.min(100,Math.round(loaded/total*100));percent.textContent=p+'%';bar.style.width=p+'%';detail.textContent=`${(loaded/1048576).toFixed(1)} / ${(total/1048576).toFixed(1)} MB`;});if(d.reactivated)react++;else if(d.duplicated)dup++;else ok++;percent.textContent='100%';bar.style.width='100%';detail.textContent='已完成';}catch(e){fail++;percent.textContent='失败';detail.textContent=e.message;}}title.textContent='上传完成';detail.textContent=`新增 ${ok}，重新启用 ${react}，重复 ${dup}，失败 ${fail}`;showToast(detail.textContent,fail?'error':'success');await refresh();}
async function importDirectory(){try{const r=await apiFetch('/api/assets/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:'auto'})});const d=await r.json();const cats={};d.imported.forEach(a=>{cats[categoryNames[a.category]||a.category]=(cats[categoryNames[a.category]||a.category]||0)+1;});const stat=Object.entries(cats).map(([k,v])=>`${k}:${v}`).join('，');showToast(`导入 ${d.imported.length} 个，失败 ${d.errors.length} 个${stat?'（'+stat+'）':''}`,d.errors.length?'error':'success');await refresh();}catch(e){showToast(e.message,'error');}}

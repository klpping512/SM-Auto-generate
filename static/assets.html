<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>素材库 - SA-LogiFlow</title><script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="/static/design-system.css?v=6"/></head><body>
<div class="app-layout" id="app"></div><div id="toastContainer" class="toast-container"></div>
<div id="mediaModal" class="media-modal" hidden><div class="media-modal-card"><button class="media-close" aria-label="关闭" onclick="closePreview()">×</button><div id="mediaPreview"></div></div></div>
<div id="editModal" class="media-modal" hidden><div class="edit-card"><button class="media-close" aria-label="关闭" onclick="closeEdit()">×</button><h3 style="margin:0 0 16px;font-size:18px;">编辑素材</h3><label class="field-label">名称</label><input id="editName" class="input" style="width:100%;margin-bottom:14px"/><label class="field-label">分类</label><select id="editCategory" class="select" style="width:100%;margin-bottom:14px"></select><label class="field-label">状态</label><select id="editStatus" class="select" style="width:100%;margin-bottom:20px"><option value="active">启用</option><option value="inactive">停用</option></select><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost" onclick="closeEdit()">取消</button><button class="btn btn-primary" onclick="saveEdit()">保存</button></div></div></div>
<script src="/static/common.js?v=6"></script><script>
const PAGE_ID='assets';let assets=[],typeFilter='',categoryFilter='',query='',selected=new Set();
const categoryNames={warehouse:'海外仓',delivery:'配送',customs:'清关',brand:'品牌',staff:'工作人员',facility:'设备设施',customer:'客户案例',other:'其他'};
async function init(){await loadAssets();render();}
async function loadAssets(){const p=new URLSearchParams();if(typeFilter)p.set('type',typeFilter);if(categoryFilter)p.set('category',categoryFilter);if(query)p.set('query',query);const r=await apiFetch('/api/assets?'+p);assets=await r.json();}
function formatSize(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.ceil(n/1024)+' KB';}
function render(){document.getElementById('app').innerHTML=`${renderSidebar(PAGE_ID)}<main class="main-content"><div class="page-header"><div><h1 class="page-title">素材库</h1><p style="font-size:13px;color:var(--text-muted);margin-top:4px;">统一管理可用于小红书和抖音的真实图片、视频素材</p></div><div style="display:flex;gap:8px;"><button class="btn btn-secondary" onclick="importDirectory()">扫描导入目录</button><label class="btn btn-primary" style="cursor:pointer;">上传素材<input type="file" multiple accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm" hidden onchange="uploadFiles(this.files);this.value=''"/></label></div></div><div class="page-body">
<div class="card" style="padding:16px 20px;margin-bottom:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;"><label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none;"><input type="checkbox" id="selectAllCheck" onchange="toggleSelectAll(this.checked)"/><span>全选</span></label><button class="btn btn-sm" style="display:${selected.size?'inline-flex':'none'};color:#dc2626;border:1px solid var(--border)" onclick="deleteSelected()">删除选中(<span id="selectedCount">${selected.size}</span>)</button><input class="input" style="max-width:260px" placeholder="搜索素材名称" value="${escapeHtml(query)}" onkeydown="if(event.key==='Enter'){query=this.value;refresh();}"/><select class="select" onchange="typeFilter=this.value;refresh()"><option value="">全部类型</option><option value="image" ${typeFilter==='image'?'selected':''}>图片</option><option value="video" ${typeFilter==='video'?'selected':''}>视频</option></select><select class="select" onchange="categoryFilter=this.value;refresh()"><option value="">全部分类</option>${Object.entries(categoryNames).map(([k,v])=>`<option value="${k}" ${categoryFilter===k?'selected':''}>${v}</option>`).join('')}</select><span style="margin-left:auto;font-size:12px;color:var(--text-muted)">${assets.length} 个素材</span></div>
${assets.length?`<div class="asset-grid">${assets.map(assetCard).join('')}</div>`:`<div class="card empty-state"><iconify-icon icon="mdi:image-multiple-outline" width="50"></iconify-icon><p>暂无素材。可上传文件，或将素材放入 static/assets/import 后扫描。</p></div>`}
</div></main>`;const sc=document.getElementById('selectAllCheck');if(sc){const all=assets.length>0&&selected.size>=assets.length;sc.checked=all;sc.indeterminate=selected.size>0&&!all;}}
function assetCard(a){const media=a.file_type==='video'?`<video src="${escapeHtml(a.url)}" muted preload="metadata"></video>`:`<img src="${escapeHtml(a.thumbnail_url||a.url)}" alt="${escapeHtml(a.name)}"/>`;return `<article class="asset-card${selected.has(a.id)?' selected':''}"><input type="checkbox" class="asset-check" ${selected.has(a.id)?'checked':''} onclick="toggleSelect(${a.id},event)"/><button class="asset-media" onclick="openPreview(${a.id})">${media}<span class="asset-type">${a.file_type==='video'?'视频':'图片'}</span></button><div class="asset-info"><strong>${escapeHtml(a.name)}</strong><div>${categoryNames[a.category]||a.category} · ${a.duration?Math.round(a.duration)+'秒 · ':''}${formatSize(a.size)}</div><div class="asset-actions"><button class="btn btn-primary btn-sm" onclick="useAsset(${a.id})">使用此素材</button><button class="btn btn-ghost btn-sm" onclick="editAsset(${a.id})">编辑</button><button class="btn btn-ghost btn-sm" onclick="deleteAsset(${a.id})">删除</button></div></div></article>`;}
async function refresh(){await loadAssets();render();}
function toggleSelect(id,e){e&&e.stopPropagation();if(selected.has(id))selected.delete(id);else selected.add(id);render();}
function toggleSelectAll(check){if(check){assets.forEach(a=>selected.add(a.id));}else{selected.clear();}render();}
async function deleteSelected(){if(!selected.size)return;if(!confirm(`确定删除选中的 ${selected.size} 个素材？已被视频任务引用的素材只会停用。`))return;let deleted=0,inactive=0,failed=0;for(const id of [...selected]){try{const r=await apiFetch(`/api/assets/${id}`,{method:'DELETE'});const d=await r.json();if(d.status==='inactive')inactive++;else deleted++;}catch(e){failed++;}}selected.clear();showToast(`已删除 ${deleted} 个，停用 ${inactive} 个${failed?`，失败 ${failed} 个`:''}`,failed?'error':'success');await refresh();}
async function uploadFiles(files){const list=Array.from(files||[]);let dup=0,ok=0,fail=0,react=0;for(const file of list){const fd=new FormData();fd.append('file',file);try{const r=await apiFetch('/api/assets/upload?category='+encodeURIComponent(categoryFilter||'auto'),{method:'POST',body:fd});const d=await r.json();if(d.reactivated){react++;showToast(file.name+'：素材曾停用，已重新启用');}else if(d.duplicated){dup++;showToast(file.name+'：素材已存在，跳过','error');}else{ok++;showToast('已上传 '+file.name);}}catch(e){fail++;showToast(file.name+'：'+e.message,'error');}}if(list.length>1)showToast(`共 ${list.length} 个：新增 ${ok}，重新启用 ${react}，重复 ${dup}${fail?`，失败 ${fail}`:''}`,fail?'error':'success');await refresh();}
async function importDirectory(){try{const r=await apiFetch('/api/assets/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:'auto'})});const d=await r.json();const cats={};d.imported.forEach(a=>{cats[categoryNames[a.category]||a.category]=(cats[categoryNames[a.category]||a.category]||0)+1;});const stat=Object.entries(cats).map(([k,v])=>`${k}:${v}`).join('，');showToast(`导入 ${d.imported.length} 个，失败 ${d.errors.length} 个${stat?'（'+stat+'）':''}`,d.errors.length?'error':'success');await refresh();}catch(e){showToast(e.message,'error');}}
function openPreview(id){const a=assets.find(x=>x.id===id);if(!a)return;document.getElementById('mediaPreview').innerHTML=a.file_type==='video'?`<video src="${escapeHtml(a.url)}" controls autoplay style="max-width:82vw;max-height:82vh"></video>`:`<img src="${escapeHtml(a.url)}" alt="${escapeHtml(a.name)}" style="max-width:82vw;max-height:82vh"/>`;document.getElementById('mediaModal').hidden=false;document.body.style.overflow='hidden';}
function closePreview(){document.getElementById('mediaModal').hidden=true;document.getElementById('mediaPreview').innerHTML='';document.body.style.overflow='';}
function useAsset(id){const selected=JSON.parse(localStorage.getItem('selectedMediaAssets')||'[]');if(!selected.includes(id))selected.push(id);localStorage.setItem('selectedMediaAssets',JSON.stringify(selected));showToast('已关联到内容编辑器');setTimeout(()=>location.href='/editor.html',350);}
async function editAsset(id){const a=assets.find(x=>x.id===id);if(!a)return;const sel=document.getElementById('editCategory');sel.innerHTML=Object.entries(categoryNames).map(([k,v])=>`<option value="${k}" ${a.category===k?'selected':''}>${v}</option>`).join('');document.getElementById('editName').value=a.name;document.getElementById('editStatus').value=a.status;document.getElementById('editModal').dataset.id=id;document.getElementById('editModal').hidden=false;}
function closeEdit(){document.getElementById('editModal').hidden=true;}
async function saveEdit(){const id=document.getElementById('editModal').dataset.id;const name=document.getElementById('editName').value.trim();const category=document.getElementById('editCategory').value;const status=document.getElementById('editStatus').value;if(!name){showToast('名称不能为空','error');return;}try{await apiFetch(`/api/assets/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,category,status})});closeEdit();await refresh();}catch(e){showToast(e.message,'error');}}
async function deleteAsset(id){if(!confirm('确定删除？已被视频任务引用的素材只会停用。'))return;try{const r=await apiFetch(`/api/assets/${id}`,{method:'DELETE'});const d=await r.json();selected.delete(id);showToast(d.status==='inactive'?'素材已被引用，已停用':'已删除');await refresh();}catch(e){showToast(e.message,'error');}}
document.getElementById('mediaModal').addEventListener('click',e=>{if(e.target.id==='mediaModal')closePreview();});document.getElementById('editModal').addEventListener('click',e=>{if(e.target.id==='editModal')closeEdit();});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePreview();closeEdit();}});init();
</script><style>
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.asset-card{position:relative;background:white;border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm)}.asset-card.selected{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.25),var(--shadow-sm)}.asset-check{position:absolute;left:10px;top:10px;z-index:3;width:20px;height:20px;cursor:pointer;accent-color:#2563eb}.asset-media{position:relative;width:100%;height:180px;border:0;padding:0;background:#eee;cursor:pointer}.asset-media img,.asset-media video{width:100%;height:100%;object-fit:cover}.asset-type{position:absolute;left:10px;top:10px;background:#0009;color:white;padding:3px 8px;border-radius:99px;font-size:10px}.asset-info{padding:14px}.asset-info strong{display:block;font-size:14px}.asset-info>div:nth-child(2){font-size:11px;color:var(--text-muted);margin:5px 0 12px}.asset-actions{display:flex;gap:5px}.media-modal{position:fixed;inset:0;background:#000c;z-index:10000;display:flex;align-items:center;justify-content:center}.media-modal[hidden]{display:none}.media-modal-card{position:relative}.edit-card{position:relative;background:white;border-radius:16px;padding:24px;width:360px;max-width:92vw;box-shadow:var(--shadow-lg)}.edit-card .media-close{position:absolute;right:12px;top:10px;color:var(--text-muted);font-size:24px}.field-label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px}.media-close{position:absolute;right:0;top:-44px;border:0;background:none;color:white;font-size:34px;cursor:pointer}
</style></body></html>

<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>素材库 - SA-LogiFlow</title><script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

<div id="editModal" class="media-modal" hidden><div class="edit-card"><button class="media-close" aria-label="关闭" onclick="closeEdit()">×</button><h3 style="margin:0 0 16px;font-size:18px;">编辑素材</h3><label class="field-label">名称</label><input id="editName" class="input" style="width:100%;margin-bottom:14px"/><label class="field-label">分类</label><select id="editCategory" class="select" style="width:100%;margin-bottom:14px"></select><label class="field-label">状态</label><select id="editStatus" class="select" style="width:100%;margin-bottom:20px"><option value="active">启用</option><option value="inactive">停用</option></select><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost" onclick="closeEdit()">取消</button><button class="btn btn-primary" onclick="saveEdit()">保存</button></div></div></div>
<div id="assetDetailModal" class="media-modal" hidden><div class="asset-detail-panel"><button class="media-close" aria-label="关闭" onclick="closeAssetDetail()">×</button><h3>素材详情</h3><div id="assetDetailContent"></div></div></div>
<div id="retentionModal" class="media-modal" hidden><div class="asset-detail-panel"><button class="media-close" aria-label="关闭" onclick="closeRetentionPreview()">×</button><h3>存储清理预览</h3><div id="retentionPreviewContent"></div></div></div>
<script src="/static/common.js?v=8"></script><script>
const PAGE_ID='assets';let assets=[],hotspotEvents=[],inspirations=[],hotspotMedia=[],hotspots=[],viewMode='materials',hotspotSubView='media',typeFilter='',categoryFilter='',query='',selected=new Set();
let selectedHotspotId='',hotspotMediaKind='',hotspotFreshness='30d';
const hotspotMediaBusy=new Set();
let hotspotMediaPollTimer=null,hotspotMediaPollFailures=0,hotspotMediaPolling=false;
let localImportJob=null,localImportTimer=null,localImportFailures=0;
const MAX_VIDEO_UPLOAD=2147483648,MAX_IMAGE_UPLOAD=15728640;
const categoryNames={warehouse:'海外仓',delivery:'配送',customs:'清关',brand:'品牌',staff:'工作人员',facility:'设备设施',customer:'客户案例',other:'其他'};
async function init(){const params=new URLSearchParams(location.search);selectedHotspotId=params.get('hotspot_id')||'';hotspotFreshness=params.get('freshness')||'30d';if(params.get('library')==='hotspot')viewMode='hotspot';await Promise.all([loadAssets(),loadInspirations(),loadHotspots(),loadHotspotMedia(),loadLocalImport()]);render();scheduleHotspotMediaPoll();if(localImportJob)scheduleLocalImportPoll();}
async function loadAssets(){const p=new URLSearchParams();if(typeFilter)p.set('type',typeFilter);if(categoryFilter)p.set('category',categoryFilter);if(query)p.set('query',query);const [assetResponse,eventResponse]=await Promise.all([apiFetch('/api/assets?'+p),apiFetch('/api/hotspot-events')]);const allAssets=await assetResponse.json();assets=allAssets.filter(asset=>asset.library_origin!=='hotspot'&&!asset.hotspot_id);hotspotEvents=await eventResponse.json();window.hotspotEventCache=Object.fromEntries(hotspotEvents.map(event=>[event.id,event]));}
async function loadInspirations(){const r=await apiFetch('/api/inspirations');inspirations=await r.json();}
async function loadHotspots(){const r=await apiFetch('/api/hotspots?limit=200');hotspots=await r.json();if(!selectedHotspotId&&hotspots.length)selectedHotspotId=String(hotspots[0].id);}
async function loadHotspotMedia(){const p=new URLSearchParams();if(selectedHotspotId)p.set('hotspot_id',selectedHotspotId);if(hotspotMediaKind)p.set('media_kind',hotspotMediaKind);p.set('_ts',Date.now());const r=await apiFetch('/api/hotspot-media?'+p,{cache:'no-store'});hotspotMedia=await r.json();}
function formatSize(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.ceil(n/1024)+' KB';}
function formatHotspotDate(value){if(!value)return '未记录';const date=new Date(value);return Number.isNaN(date.getTime())?String(value):date.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function hotspotAgeLabel(item){const value=item.published_at||item.created_at;if(!value)return '时效未知';const time=new Date(value).getTime();if(!time)return '时效未知';const days=Math.max(0,Math.floor((Date.now()-time)/86400000));if(days===0)return '今天';if(days<30)return `${days} 天前`;return '已超过 30 天';}
function filteredHotspotMedia(){return hotspotMedia.filter(item=>{const archived=item.lifecycle_status==='archived';if(hotspotFreshness==='archived')return archived;if(archived)return false;if(hotspotFreshness==='all')return true;const value=item.published_at||item.created_at;if(!value)return false;const time=new Date(value).getTime();if(!time)return false;const days={"24h":1,"3d":3,"7d":7,"30d":30}[hotspotFreshness]||30;return Date.now()-time<=days*86400000;});}
function localImportPanel(){if(!localImportJob)return '';const j=localImportJob,total=Number(j.total||0),done=Number(j.scanned||0),pct=total?Math.min(100,Math.round(done/total*100)):0,active=['pending','scanning','importing','processing','cancel_requested'].includes(j.status),analyzed=assets.filter(a=>['ready','review_required'].includes(a.processing_status)).length;const state=j.status==='offline'?'本地服务已断开，请重启 8080 后刷新':j.status==='succeeded'?'本地素材接入完成，语义分析正在后台排队':j.status==='canceled'?'导入已取消':j.status==='failed'?'导入失败':j.status==='interrupted'?'服务重启导致任务中断，可重新开始':j.status==='cancel_requested'?'正在完成当前文件后取消':'正在接入本地素材';return `<section class="local-import-card"><div class="local-import-head"><div><strong>${escapeHtml(state)}</strong><div>${escapeHtml(j.root_path||'')}</div></div><span>${pct}%</span></div><div class="upload-progress-track"><div class="upload-progress-bar" style="width:${pct}%"></div></div><div class="local-import-stats"><span>总数 ${total}</span><span>已扫描 ${done}</span><span>已入库 ${Number(j.imported||0)}</span><span>重复 ${Number(j.duplicated||0)}</span><span>跳过 ${Number(j.skipped||0)}</span><span>失败 ${Number(j.failed||0)}</span><span>已分析 ${analyzed}</span></div><div class="local-import-current">${j.current_file?`当前：${escapeHtml(j.current_file)}`:'当前没有正在处理的文件'}</div>${active&&j.status!=='cancel_requested'?'<button class="btn btn-secondary btn-sm" onclick="cancelLocalImport()">取消导入</button>':''}${['failed','interrupted','canceled','offline'].includes(j.status)?'<button class="btn btn-primary btn-sm" onclick="startLocalImport()">重新开始</button>':''}</section>`;}
function render(){if(viewMode==='hotspot'){renderHotspotLibrary();return;}const admin=getCurrentUser().role==='admin';document.getElementById('app').innerHTML=`${renderSidebar(PAGE_ID)}<main class="main-content"><div class="page-header asset-page-header"><div class="asset-page-heading"><h1 class="page-title">内容资产</h1><p style="font-size:13px;color:var(--text-muted);margin-top:4px;">管理 Buffalo 自有或已明确授权、可长期复用的视频与图片</p></div><div class="asset-page-actions">${admin?'<button class="btn btn-secondary" onclick="startLocalImport()">接入桌面素材</button>':''}<details class="asset-more-menu"><summary class="btn btn-secondary">更多操作</summary><div class="asset-more-panel">${admin?'<button type="button" onclick="processPendingAssets()">分析存量素材</button>':''}<button type="button" onclick="importDirectory()">扫描项目导入目录</button></div></details><label class="btn btn-primary" style="cursor:pointer;">上传素材<input type="file" multiple accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm" hidden onchange="uploadFiles(this.files);this.value=''"/></label></div></div><div class="page-body"><nav class="asset-view-tabs" aria-label="资产视图"><button class="asset-view-tab active" type="button">原本素材库</button><button class="asset-view-tab" type="button" onclick="viewMode='hotspot';hotspotSubView='media';render()">热点素材库</button></nav><div id="uploadProgress" class="upload-progress" hidden><div class="upload-progress-head"><strong id="uploadProgressTitle">准备上传</strong><span id="uploadProgressPercent">0%</span></div><div class="upload-progress-track"><div id="uploadProgressBar" class="upload-progress-bar"></div></div><div id="uploadProgressDetail" class="upload-progress-detail"></div></div>${localImportPanel()}
<div class="card" style="padding:16px 20px;margin-bottom:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;"><label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none;"><input type="checkbox" id="selectAllCheck" onchange="toggleSelectAll(this.checked)"/><span>全选</span></label><button class="btn btn-sm" style="display:${selected.size?'inline-flex':'none'};color:#dc2626;border:1px solid var(--border)" onclick="deleteSelected()">删除选中(<span id="selectedCount">${selected.size}</span>)</button><input class="input" style="max-width:260px" placeholder="搜索素材名称" value="${escapeHtml(query)}" onkeydown="if(event.key==='Enter'){query=this.value;refresh();}"/><select class="select" onchange="typeFilter=this.value;refresh()"><option value="">全部类型</option><option value="image" ${typeFilter==='image'?'selected':''}>图片</option><option value="video" ${typeFilter==='video'?'selected':''}>视频</option></select><select class="select" onchange="categoryFilter=this.value;refresh()"><option value="">全部分类</option>${Object.entries(categoryNames).map(([k,v])=>`<option value="${k}" ${categoryFilter===k?'selected':''}>${v}</option>`).join('')}</select><span style="margin-left:auto;font-size:12px;color:var(--text-muted)">${assets.length} 个素材</span></div>
${assets.length?`<section><h2 style="font-size:15px;margin:18px 0 10px">Buffalo 原有素材</h2><div class="asset-grid">${assets.map(assetCard).join('')}</div></section>`:`<div class="card empty-state"><iconify-icon icon="mdi:image-multiple-outline" width="50"></iconify-icon><p>暂无素材。可上传文件，或将素材放入 static/assets/import 后扫描。</p></div>`}
</div></main>`;const sc=document.getElementById('selectAllCheck');if(sc){const all=assets.length>0&&selected.size>=assets.length;sc.checked=all;sc.indeterminate=selected.size>0&&!all;}}
function virtualEventCard(event){const admin=getCurrentUser().role==='admin';const va=event.virtual_asset||{},evidence=event.evidence||{};const poster=va.thumbnail_url;const preview=va.preview_url?`<video src="${escapeHtml(va.preview_url)}#t=${Number(va.preview_start_second||0)},${Number(va.preview_end_second||0)}" ${poster?`poster="${escapeHtml(poster)}"`:''} controls preload="metadata" playsinline></video>`:(poster?`<img src="${escapeHtml(poster)}" alt="${escapeHtml(event.title_zh)}"/>`:'<div class="asset-preview-missing">暂无预览</div>');const happened=escapeHtml(evidence.what_happened||'');const question=escapeHtml(evidence.logistics_question||'');return `<article class="asset-card virtual-event-card"><div class="asset-media">${preview}<span class="asset-type">热点 Hook</span></div><div class="asset-info"><strong>${escapeHtml(event.title_zh)}</strong><div>${escapeHtml(event.title_en)} · ${((event.duration_ms||event.end_ms-event.start_ms)/1000).toFixed(1)} 秒</div><p class="hook-fact"><b>画面发生：</b>${happened}</p><p class="hook-question"><b>物流切入：</b>${question}</p><div class="processing-state ready">可匹配</div><div class="asset-actions"><button class="btn btn-primary btn-sm" onclick="useHotspotEvent(${event.id})">加入视频跟进</button><button class="btn btn-ghost btn-sm" onclick="viewHotspotEvents(${event.asset_id})">查看母片 Hook</button>${admin?`<button class="btn btn-ghost btn-sm" style="color:#b91c1c" onclick="deleteHotspotEvent(${event.id})">删除此 Hook</button><button class="btn btn-ghost btn-sm" style="color:#b91c1c" onclick="deleteHotspotEventAsset(${event.asset_id})">删除整条母片</button>`:''}</div></div></article>`;}
function assetCard(a){const admin=getCurrentUser().role==='admin';const media=`<img src="${escapeHtml(a.thumbnail_url||a.url)}" alt="${escapeHtml(a.name)}"/>`;const provenance=a.license?`<div class="asset-provenance">许可：${escapeHtml(a.license)} · ${escapeHtml(a.attribution||'来源署名见原页')} ${a.source_url?`<a href="${escapeHtml(a.source_url)}" target="_blank" rel="noopener noreferrer">查看来源</a>`:''}</div>`:'';const state=a.processing_status||'pending';const isHotspot=a.library_origin==='hotspot';const sourceLabel=isHotspot?'热点原始母片':(a.source_label||'Buffalo 原有素材');const eventButton=isHotspot?`<button class="btn btn-primary btn-sm" onclick="viewHotspotEvents(${a.id})">查看事件素材</button>`:'';const useButton=isHotspot?'':`<button class="btn btn-primary btn-sm" onclick="useAsset(${a.id})">使用</button>`;return `<article class="asset-card${selected.has(a.id)?' selected':''}"><input type="checkbox" class="asset-check" ${selected.has(a.id)?'checked':''} onclick="toggleSelect(${a.id},event)"/><button class="asset-media" onclick="openPreview(${a.id})">${media}<span class="asset-type">${a.file_type==='video'?'视频':'图片'}</span></button><div class="asset-info"><strong>${escapeHtml(a.name)}</strong><div>${escapeHtml(sourceLabel)} · ${categoryNames[a.primary_category||a.category]||a.primary_category||a.category} · ${a.duration?Math.round(a.duration)+'秒 · ':''}${formatSize(a.size)}</div><div class="processing-state ${escapeHtml(state)}">${state==='ready'?'可匹配':state==='review_required'?'待复核':state==='failed'?'处理失败':'处理中'}</div>${provenance}<div class="asset-actions">${useButton}${eventButton}<button class="btn btn-ghost btn-sm" onclick="viewSegments(${a.id})">镜头标签</button>${admin?`<button class="btn btn-ghost btn-sm" onclick="processAsset(${a.id})">重新分析</button>`:''}<button class="btn btn-ghost btn-sm" onclick="editAsset(${a.id})">编辑</button><button class="btn btn-ghost btn-sm" onclick="deleteAsset(${a.id})">删除</button></div></div></article>`;}
async function refresh(){await loadAssets();render();}
function renderHotspotLibrary(){
  const admin=getCurrentUser().role==='admin';
  const visibleMedia=filteredHotspotMedia();
  const hotspotOptions=hotspots.map(item=>`<option value="${item.id}" ${String(item.id)===String(selectedHotspotId)?'selected':''}>${escapeHtml(item.title_zh||item.title)}</option>`).join('');
  const inspirationBody=`<section class="card inspiration-add"><label class="field-label">批量添加链接（每行一个，可写“链接 | 标题”）</label><textarea class="input" id="inspirationUrls" rows="4" placeholder="https://www.youtube.com/watch?v=... | 德班港现场\nhttps://www.tiktok.com/@.../video/..."></textarea><button class="btn btn-primary" onclick="addInspirationBatch()">加入团队灵感池</button></section><div class="inspiration-grid">${inspirations.map(item=>inspirationCard(item,admin)).join('')||'<div class="card empty-state"><p>暂无灵感链接</p></div>'}</div>`;
  const freshnessOptions=[['24h','24 小时'],['3d','3 天'],['7d','7 天'],['30d','30 天'],['all','全部时间'],['archived','已归档']].map(([value,label])=>`<option value="${value}" ${hotspotFreshness===value?'selected':''}>${label}</option>`).join('');
  const visibleEvents=hotspotEvents.filter(item=>!selectedHotspotId||String(item.hotspot_id)===String(selectedHotspotId));
  const eventBody=visibleEvents.length?`<section class="virtual-event-library"><div class="virtual-event-library-head"><div><h2>热点 Hook 素材</h2><p>每条均由内置模型从已分析母片中筛出的精华片段，包含“发生了什么”和物流切入问题；母片只用于回溯，不直接进入成片。</p></div><span>${visibleEvents.length} 条 Hook 片段</span></div><div class="asset-grid">${visibleEvents.map(virtualEventCard).join('')}</div></section>`:'<section class="virtual-event-library"><div class="virtual-event-library-head"><div><h2>热点 Hook 素材</h2><p>当前没有通过内置模型策展的 Hook。下载母片后会先完成镜头分析，再只保留有明确画面事实的精华片段。</p></div></div></section>';
  const mediaBody=`${admin?`<section class="card hotspot-media-add"><div><strong>添加视频链接</strong><p>绑定到具体热点。频道或播放列表不能直接加入，请填写单条 YouTube、TikTok 或新闻视频链接。</p></div><select class="select" id="attachHotspotId"><option value="">选择热点</option>${hotspotOptions}</select><input class="input" id="hotspotVideoUrl" type="url" placeholder="https://www.youtube.com/watch?v=..."/><button class="btn btn-primary" onclick="attachHotspotVideo()">添加视频链接</button></section>`:''}${eventBody}<div class="card hotspot-media-toolbar"><select class="select" aria-label="全部热点" onchange="changeHotspotFilter('hotspot',this.value)"><option value="">全部热点</option>${hotspotOptions}</select><select class="select" id="hotspotMediaKind" onchange="changeHotspotFilter('kind',this.value)"><option value="">全部媒体</option><option value="image" ${hotspotMediaKind==='image'?'selected':''}>图片</option><option value="video_link" ${hotspotMediaKind==='video_link'?'selected':''}>视频链接</option><option value="video_file" ${hotspotMediaKind==='video_file'?'selected':''}>已下载视频</option></select><select class="select" id="hotspotFreshness" aria-label="筛选热点时效" onchange="changeHotspotFilter('freshness',this.value)">${freshnessOptions}</select>${admin&&selectedHotspotId?'<button class="btn btn-secondary" onclick="discoverHotspotMedia()">检查原文媒体</button>':''}<button class="btn btn-secondary" onclick="refreshHotspotMediaStatus()">立即刷新状态</button><span>${visibleMedia.length} 条候选</span></div><div class="hotspot-media-grid">${visibleMedia.map(item=>hotspotMediaCard(item,admin)).join('')||'<div class="card empty-state"><p>当前筛选下没有热点媒体。可调整时效范围，或先在热点选题页抓取热点。</p></div>'}</div>`;
  const returnLink=selectedHotspotId?`<a class="btn btn-secondary" href="/hotspots.html?hotspot_id=${encodeURIComponent(selectedHotspotId)}">返回当前热点</a>`:'';
  const retentionButton=admin?'<button class="btn btn-secondary" type="button" onclick="openRetentionPreview()">存储清理预览</button>':'';
  const cleanupHooksButton=admin?'<button class="btn btn-secondary" type="button" onclick="cleanupIneligibleHooks()">清理不合格 Hook</button>':'';
  const clearButton=admin?'<button class="btn btn-ghost" type="button" style="color:#b91c1c;border-color:#fecaca" onclick="clearHotspotLibrary()">清空热点素材库</button>':'';
  document.getElementById('app').innerHTML=`${renderSidebar(PAGE_ID)}<main class="main-content"><div class="page-header asset-page-header"><div class="asset-page-heading"><h1 class="page-title">内容资产</h1><p style="font-size:13px;color:var(--text-muted);margin-top:4px">热点母片会先下载、分析，再由内置模型仅保留可复用的精华 Hook；系统每三天补库，保留十天并始终保护最近三天。</p></div><div class="asset-page-actions">${returnLink}${retentionButton}${cleanupHooksButton}${clearButton}</div></div><div class="page-body"><nav class="asset-view-tabs" aria-label="资产视图"><button class="asset-view-tab" type="button" onclick="viewMode='materials';render()">原本素材库</button><button class="asset-view-tab active" type="button">热点素材库</button></nav><nav class="hotspot-subtabs" aria-label="热点素材视图"><button class="${hotspotSubView==='media'?'active':''}" onclick="hotspotSubView='media';render()">Hook 入库任务</button><button class="${hotspotSubView==='inspirations'?'active':''}" onclick="hotspotSubView='inspirations';render()">灵感链接</button></nav>${hotspotSubView==='media'?mediaBody:inspirationBody}</div></main>`;
}
function renderInspirations(){viewMode='hotspot';hotspotSubView='inspirations';renderHotspotLibrary();}
function hotspotStatusLabel(item){if(item.authorization_status==='blocked')return '不可处理';if(['pending','downloading'].includes(item.download_status))return '下载中';if(item.processing_status==='processing')return '分析中';if(item.processing_status==='ready')return 'Hook 已分析';if(item.download_status==='download_failed'||item.processing_status==='processing_failed')return '处理失败';if(item.authorization_status==='pending_review')return '待确认授权';return '仅链接';}
function hotspotMediaProgress(item){
  if(item.download_status==='download_failed'||item.processing_status==='processing_failed')return {pct:100,label:'处理失败',detail:item.error_message||'可稍后重试'};
  if(item.processing_status==='ready')return {pct:100,label:'已完成',detail:item.progress_detail||'已进入原本素材库，可用于成片'};
  if(item.processing_status==='processing')return {pct:75,label:'正在分析镜头',detail:'提取画面、语音和语义标签'};
  if(item.download_status==='downloaded')return {pct:60,label:'下载完成，准备分析',detail:'本地文件已保存'};
  if(item.download_status==='downloading')return {pct:Number(item.download_progress||35),label:'正在下载媒体',detail:item.progress_detail||'远端速度可能影响耗时'};
  if(item.download_status==='pending')return {pct:10,label:'正在连接来源',detail:'任务已进入下载队列'};
  return null;
}
function scheduleHotspotMediaPoll(){clearInterval(hotspotMediaPollTimer);const active=hotspotMedia.some(item=>['pending','downloading'].includes(item.download_status)||item.processing_status==='processing');if(active)hotspotMediaPollTimer=setInterval(pollHotspotMedia,1500);}
async function pollHotspotMedia(){if(hotspotMediaPolling)return;hotspotMediaPolling=true;try{await loadHotspotMedia();hotspotMediaPollFailures=0;render();if(!hotspotMedia.some(item=>['pending','downloading'].includes(item.download_status)||item.processing_status==='processing'))scheduleHotspotMediaPoll();}catch(e){hotspotMediaPollFailures++;}finally{hotspotMediaPolling=false;}}
async function refreshHotspotMediaStatus(){await pollHotspotMedia();scheduleHotspotMediaPoll();}
function formatHotspotDuration(value){const seconds=Number(value||0);if(!seconds)return '时长未知';const minutes=Math.floor(seconds/60),rest=Math.round(seconds%60);return minutes?`${minutes}分${rest}秒`:`${rest}秒`;}
function handleHotspotImageError(image){image.hidden=true;const fallback=image.nextElementSibling;if(fallback&&fallback.classList.contains('hotspot-media-fallback'))fallback.hidden=false;}
function hotspotMediaCard(item,admin){
  const hotspot=hotspots.find(value=>value.id===item.hotspot_id)||{};
  const isVideo=item.media_kind==='video_link'||item.media_kind==='video_file';
  const previewUrl=item.preview_url||item.thumbnail_url;
  const fallback=`<div class="hotspot-media-fallback" ${previewUrl?'hidden':''}><svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 14 3-3 3 3 2-2 3 3"/><circle cx="8" cy="8" r="1"/></svg><small>预览暂不可用</small></div>`;
  const thumb=previewUrl?`<img src="${escapeHtml(previewUrl)}" alt="" onerror="handleHotspotImageError(this)"/>${fallback}`:fallback;

}

function inspirationCard(item,admin){const materialized=item.materialization_status==='materialized';const sourceNames={youtube:'YouTube',tiktok:'TikTok',official_news:'官方新闻',secondary_discovery:'二级热点发现',licensed_media:'开放许可媒体',other_link:'外部链接'};return `<article class="card inspiration-card"><div class="inspiration-thumb">${item.thumbnail_url?`<img src="${escapeHtml(item.thumbnail_url)}" alt=""/>`:'<svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor" aria-hidden="true"><path d="M3.9 12a5 5 0 017.1-7.1l1.4 1.4-1.4 1.4-1.4-1.4a3 3 0 00-4.2 4.2l2.1 2.1a3 3 0 004.2 0l1.4 1.4a5 5 0 01-7.1 0L3.9 12zm6.9-2a5 5 0 017.1 0l2.1 2a5 5 0 01-7.1 7.1l-1.4-1.4 1.4-1.4 1.4 1.4a3 3 0 004.2-4.2l-2.1-2.1a3 3 0 00-4.2 0L10.8 10z"/></svg>'}</div><div class="inspiration-content"><div class="candidate-row"><strong>${escapeHtml(item.title)}</strong><span class="source-pill">${escapeHtml(sourceNames[item.source_type]||item.source_type)}</span></div><p>${escapeHtml(item.summary||'暂无摘要')}</p><div class="rights-line">版权：${item.rights_status==='licensed'?'开放许可':item.rights_status==='confirmed'?'已确认授权':item.rights_status==='restricted'?'受限，仅可作发现链接':item.rights_status==='rejected'?'禁止使用':'未确认'} · ${materialized?'已进入素材库':'仅灵感参考'}</div><div class="asset-actions"><a class="btn btn-secondary btn-sm" href="${escapeHtml(item.canonical_url)}" target="_blank" rel="noopener noreferrer">打开原链接</a>${admin?`<button class="btn btn-ghost btn-sm" onclick="confirmRights(${item.id})">登记授权</button>${!materialized?`<button class="btn btn-primary btn-sm" onclick="materialize(${item.id})" ${!['confirmed','licensed'].includes(item.rights_status)?'disabled':''}>确认后下载</button>`:''}`:''}</div></div></article>`;}

function uploadOne(file,onProgress){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST','/api/assets/upload?category='+encodeURIComponent(categoryFilter||'auto'));const token=localStorage.getItem('token');if(token)xhr.setRequestHeader('Authorization','Bearer '+token);xhr.upload.onprogress=e=>{if(e.lengthComputable)onProgress(e.loaded,e.total);};xhr.onload=()=>{let data={};try{data=JSON.parse(xhr.responseText||'{}');}catch{}if(xhr.status===401){localStorage.removeItem('token');localStorage.removeItem('user');location.href='/login.html';return reject(new Error('登录已过期'));}if(xhr.status<200||xhr.status>=300)return reject(new Error(data.detail||`请求失败 (${xhr.status})`));resolve(data);};xhr.onerror=()=>reject(new Error('网络中断，请重试'));const fd=new FormData();fd.append('file',file);xhr.send(fd);});}
async function uploadFiles(files){const list=Array.from(files||[]);if(!list.length)return;const panel=document.getElementById('uploadProgress'),title=document.getElementById('uploadProgressTitle'),percent=document.getElementById('uploadProgressPercent'),bar=document.getElementById('uploadProgressBar'),detail=document.getElementById('uploadProgressDetail');panel.hidden=false;let dup=0,ok=0,fail=0,react=0;for(let i=0;i<list.length;i++){const file=list[i],isVideo=file.type.startsWith('video/')||/\.(mp4|mov|webm)$/i.test(file.name),limit=isVideo?MAX_VIDEO_UPLOAD:MAX_IMAGE_UPLOAD;title.textContent=`上传 ${i+1}/${list.length}：${file.name}`;if(file.size>limit){fail++;percent.textContent='失败';bar.style.width='0%';detail.textContent=`文件 ${(file.size/1048576).toFixed(1)} MB，超过${isVideo?'2 GB':'15 MB'}限制`;continue;}try{const d=await uploadOne(file,(loaded,total)=>{const p=Math.min(100,Math.round(loaded/total*100));percent.textContent=p+'%';bar.style.width=p+'%';detail.textContent=`${(loaded/1048576).toFixed(1)} / ${(total/1048576).toFixed(1)} MB`;});if(d.reactivated)react++;else if(d.duplicated)dup++;else ok++;percent.textContent='100%';bar.style.width='100%';detail.textContent='已完成';}catch(e){fail++;percent.textContent='失败';detail.textContent=e.message;}}title.textContent='上传完成';detail.textContent=`新增 ${ok}，重新启用 ${react}，重复 ${dup}，失败 ${fail}`;showToast(detail.textContent,fail?'error':'success');await refresh();}
async function importDirectory(){try{const r=await apiFetch('/api/assets/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:'auto'})});const d=await r.json();const cats={};d.imported.forEach(a=>{cats[categoryNames[a.category]||a.category]=(cats[categoryNames[a.category]||a.category]||0)+1;});const stat=Object.entries(cats).map(([k,v])=>`${k}:${v}`).join('，');showToast(`导入 ${d.imported.length} 个，失败 ${d.errors.length} 个${stat?'（'+stat+'）':''}`,d.errors.length?'error':'success');await refresh();}catch(e){showToast(e.message,'error');}}
function openPreview(id){const a=assets.find(x=>x.id===id);if(!a)return;document.getElementById('mediaPreview').innerHTML=a.file_type==='video'?`<video src="${escapeHtml(a.url)}" controls autoplay style="max-width:82vw;max-height:82vh"></video>`:`<img src="${escapeHtml(a.url)}" alt="${escapeHtml(a.name)}" style="max-width:82vw;max-height:82vh"/>`;document.getElementById('mediaModal').hidden=false;document.body.style.overflow='hidden';}
function closePreview(){document.getElementById('mediaModal').hidden=true;document.getElementById('mediaPreview').innerHTML='';document.body.style.overflow='';}
function useAsset(id){const selected=JSON.parse(localStorage.getItem('selectedMediaAssets')||'[]');if(!selected.includes(id))selected.push(id);localStorage.setItem('selectedMediaAssets',JSON.stringify(selected));showToast('已关联到内容编辑器');setTimeout(()=>location.href='/editor.html',350);}
async function editAsset(id){const a=assets.find(x=>x.id===id);if(!a)return;const sel=document.getElementById('editCategory');sel.innerHTML=Object.entries(categoryNames).map(([k,v])=>`<option value="${k}" ${a.category===k?'selected':''}>${v}</option>`).join('');document.getElementById('editName').value=a.name;document.getElementById('editStatus').value=a.status;document.getElementById('editModal').dataset.id=id;document.getElementById('editModal').hidden=false;}
function closeEdit(){document.getElementById('editModal').hidden=true;}
async function saveEdit(){const id=document.getElementById('editModal').dataset.id;const name=document.getElementById('editName').value.trim();const category=document.getElementById('editCategory').value;const status=document.getElementById('editStatus').value;if(!name){showToast('名称不能为空','error');return;}try{await apiFetch(`/api/assets/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,category,status})});closeEdit();await refresh();}catch(e){showToast(e.message,'error');}}
async function deleteAsset(id){if(!confirm('确定删除？已被视频任务引用的素材只会停用。'))return;try{const r=await apiFetch(`/api/assets/${id}`,{method:'DELETE'});const d=await r.json();selected.delete(id);showToast(d.status==='inactive'?'素材已被引用，已停用':'已删除');await refresh();}catch(e){showToast(e.message,'error');}}
document.getElementById('mediaModal').addEventListener('click',e=>{if(e.target.id==='mediaModal')closePreview();});document.getElementById('editModal').addEventListener('click',e=>{if(e.target.id==='editModal')closeEdit();});document.getElementById('assetDetailModal').addEventListener('click',e=>{if(e.target.id==='assetDetailModal')closeAssetDetail();});document.getElementById('retentionModal').addEventListener('click',e=>{if(e.target.id==='retentionModal')closeRetentionPreview();});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePreview();closeEdit();closeAssetDetail();closeRetentionPreview();}});init();
function enhanceBrandAssetUi(){
  const panel=document.querySelector('.asset-more-panel');
  if(panel&&!panel.querySelector('[data-brand-taxonomy-tools]')&&getCurrentUser().role==='admin'){
    panel.insertAdjacentHTML('afterbegin','<span data-brand-taxonomy-tools style="display:contents"><button type="button" onclick="backfillBuffaloBrandTags()">补全 Buffalo 品牌标签</button><button type="button" onclick="rebuildAssetTaxonomy()">重建视觉与物流标签</button></span>');
  }
  const cards=[...document.querySelectorAll('.asset-grid .asset-card')];
  cards.forEach((card,index)=>{
    const item=assets[index],tags=Array.isArray(item?.brand_tags)?item.brand_tags:[];
    if(!tags.length||card.querySelector('[data-brand-badge]'))return;
    const info=card.querySelector('.asset-info');
    if(info)info.insertAdjacentHTML('beforeend',`<div data-brand-badge style="margin:7px 0;font-size:10px;color:#8a5914;background:#fff7e6;border-radius:999px;padding:4px 7px;width:max-content;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">品牌露出：${tags.map(escapeHtml).join('、')}</div>`);
  });
}
async function backfillBuffaloBrandTags(){try{const r=await apiFetch('/api/assets/backfill-buffalo-brand-tags',{method:'POST'});const d=await r.json();showToast(`已补全 ${d.affected_assets||0} 个素材的 Buffalo 品牌标签`);await refresh();}catch(e){showToast(e.message,'error');}}
async function rebuildAssetTaxonomy(){if(!confirm('将使用当前内部视觉模型重建最多 30 条存量素材的主场景、物流对象和 Buffalo 品牌露出标签。确认继续？'))return;try{const r=await apiFetch('/api/assets/rebuild-taxonomy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({limit:30})});const d=await r.json();showToast(d.count?`已提交 ${d.count} 条素材重建`:'没有需要重建的素材');setTimeout(refresh,1000);}catch(e){showToast(e.message,'error');}}
setInterval(enhanceBrandAssetUi,300);

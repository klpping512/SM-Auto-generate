<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg?v=5"/>
<link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico?v=5"/>
<link rel="apple-touch-icon" href="/static/icons/icon-180.png?v=5"/>
<link rel="manifest" href="/static/manifest.json?v=5"/>
<meta name="theme-color" content="#B98A4C"/>
<title>AI 对话 - SA-LogiFlow</title>
<link rel="stylesheet" href="/static/design-system.css?v=5"/>
<style>
.chat-main{position:relative}.chat-page-header{min-height:46px;padding:0 0 10px}.chat-page-header .page-title{font-size:22px}.chat-title{display:flex;align-items:baseline;gap:10px;min-width:0}.current-chat-title{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}.header-actions{display:flex;gap:7px}
.chat-shell{flex:1;min-height:0;display:flex;flex-direction:column;max-width:980px;width:100%;margin:0 auto;padding-top:10px}
.chat-stage{flex:1;min-height:180px;overflow-y:auto;padding:4px 4px 18px;scroll-behavior:smooth}
.chat-shell.is-empty .chat-stage{flex:0 0 auto;min-height:0;overflow:visible;padding-bottom:10px}
.chat-welcome{min-height:52px;padding:10px 15px;border:1px solid var(--border);background:#fff;color:var(--text-primary);border-radius:var(--radius-lg);position:relative;display:flex;align-items:center;gap:12px}.welcome-mark{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;background:var(--primary-light);color:var(--primary-hover);font-weight:900}.chat-welcome h2{font-size:13px;font-weight:900}.chat-welcome p{font-size:11px;color:var(--text-muted);margin-top:2px}
.chat-row{display:flex;gap:10px;margin:16px 0;align-items:flex-start}.chat-row.user{justify-content:flex-end}
.chat-avatar{width:34px;height:34px;display:grid;place-items:center;background:#171717;color:#fff;border-radius:50%;font-size:12px;font-weight:900;flex-shrink:0}.chat-row.user .chat-avatar{background:var(--primary);order:2}
.chat-bubble{max-width:min(720px,82%);padding:12px 15px;border:1px solid var(--border);background:#fff;border-radius:4px 12px 12px 12px;font-size:14px;line-height:1.75;white-space:pre-wrap;box-shadow:var(--shadow-sm)}
.chat-row.user .chat-bubble{background:#171717;color:#fff;border-color:#171717;border-radius:12px 4px 12px 12px}
.result-card{margin-top:10px;border:1px solid rgba(185,138,76,.4);background:#fcfaf6;border-radius:7px;white-space:normal;overflow:hidden}.result-tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--border-light);background:#fff;overflow-x:auto}.result-tab{border:1px solid var(--border);background:#fff;padding:5px 9px;border-radius:5px;font-size:11px;cursor:pointer;white-space:nowrap}.result-tab.active{background:#211f1c;border-color:#211f1c;color:#fff}.result-panel{display:none;padding:14px 16px}.result-panel.active{display:block}.result-title{font-weight:900;font-size:15px;margin-bottom:8px}.result-body{font-size:13px;color:var(--text-secondary);white-space:pre-wrap;max-height:280px;overflow:auto}.result-tags{font-size:11px;color:var(--primary-hover);margin-top:9px}.result-warning{margin-top:9px;padding:7px 9px;border-radius:5px;background:#fff3dc;color:#9a5b00;font-size:11px}.result-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.result-state-card{padding:12px 14px;border-bottom:1px solid var(--border-light);background:#fff}.result-state-card strong{display:block;font-size:13px;margin-bottom:8px}.result-state-meta{display:grid;gap:6px;margin:0}.result-state-meta>div{display:grid;grid-template-columns:72px 1fr;gap:8px}.result-state-meta dt{margin:0;font-size:11px;color:var(--text-muted)}.result-state-meta dd{margin:0;font-size:12px;color:var(--text-secondary)}.result-state-details{margin-top:8px;font-size:11px;color:var(--text-muted)}.result-state-details ul{margin:6px 0 0;padding-left:18px}
.result-note{margin-top:9px;padding:7px 9px;border-radius:5px;background:#edf7f1;color:#2e6b48;font-size:11px}.result-note p{margin:4px 0 0}
.composer{flex-shrink:0;background:#fff;border:1px solid var(--border);border-top:3px solid var(--primary);border-radius:var(--radius-lg);box-shadow:0 10px 30px rgba(48,40,28,.07);padding:0 14px 10px}
.topic-picker{border-bottom:1px solid var(--border-light)}.topic-picker summary{height:42px;display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-size:12px;font-weight:800;color:var(--text-secondary)}.topic-picker summary::-webkit-details-marker{display:none}.topic-picker summary:after{content:'⌄';margin-left:auto;color:var(--text-muted);transition:transform .2s}.topic-picker[open] summary:after{transform:rotate(180deg)}.topic-count{font-weight:500;color:var(--text-muted)}.selected-topic-label{display:none;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--primary-light);color:var(--primary-hover);border-radius:999px;padding:4px 9px;font-weight:700}.selected-topic-label.show{display:inline-block}
.topic-panel{padding:0 0 12px}.topic-categories{display:flex;gap:6px;overflow-x:auto;padding:1px 0 9px;scrollbar-width:none}.topic-categories::-webkit-scrollbar{display:none}.topic-category{white-space:nowrap;border:1px solid var(--border);background:var(--bg-subcard);padding:6px 10px;border-radius:5px;font-size:11px;color:var(--text-secondary);cursor:pointer}.topic-category.active{background:#211f1c;color:#fff;border-color:#211f1c}.topic-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.quick-topic{border:1px solid var(--border-light);background:#fff;padding:8px 10px;border-radius:5px;font-size:11px;text-align:left;color:var(--text-secondary);cursor:pointer;transition:.16s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.quick-topic:hover,.quick-topic.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary-hover)}
.params-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 0 1px}.params-bar .select{width:auto;min-width:98px;min-height:30px;padding:4px 30px 4px 9px;font-size:11px}.params-divider{width:1px;height:18px;background:var(--border-light);margin:0 2px}.platform-chip{border:1px solid var(--border);background:#fff;padding:4px 8px;border-radius:4px;font-size:11px;cursor:pointer}.platform-chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.chat-input-row{display:flex;gap:8px;align-items:flex-end;padding:8px 0 2px}.chat-input-row textarea{min-height:42px;height:42px;max-height:112px;resize:none;padding-top:10px;padding-bottom:10px}.send-btn{width:42px;height:42px;flex-shrink:0;padding:0}.composer-hint{font-size:10px;color:var(--text-muted);padding:5px 2px 0}.composer-hint strong{color:var(--primary-hover)}
.quick-commands{display:flex;gap:3px;align-items:center;flex-wrap:wrap;padding-top:6px}.command-btn{background:transparent;border:none;color:var(--text-muted);font-size:10px;cursor:pointer;padding:3px 5px}.command-btn:hover{color:var(--primary-hover)}
.history-backdrop{position:absolute;inset:0;background:rgba(20,18,15,.18);z-index:20;opacity:0;pointer-events:none;transition:opacity .18s}.history-backdrop.open{opacity:1;pointer-events:auto}.history-drawer{position:absolute;z-index:21;right:0;top:0;height:100%;width:min(330px,88vw);background:#fff;border-left:1px solid var(--border);box-shadow:-16px 0 40px rgba(33,29,24,.13);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}.history-drawer.open{transform:translateX(0)}.history-head{height:62px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-light)}.history-head h2{font-size:15px}.history-list{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:5px}.history-empty{font-size:12px;color:var(--text-muted);text-align:center;padding:36px 10px}.history-item{display:flex;align-items:center;border:1px solid transparent;border-radius:7px;background:transparent}.history-item:hover{background:var(--bg-subcard)}.history-item.active{border-color:rgba(185,138,76,.35);background:var(--primary-light)}.history-select{min-width:0;flex:1;border:0;background:transparent;text-align:left;padding:9px 10px;cursor:pointer}.history-title{display:block;font-size:12px;font-weight:800;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-meta{display:block;font-size:10px;color:var(--text-muted);margin-top:3px}.history-delete{width:28px;height:28px;border:0;background:transparent;color:var(--text-muted);cursor:pointer;border-radius:5px}.history-delete:hover{background:#fff;color:#c33}
.history-backdrop{background:rgba(246,244,240,.9)}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;background:var(--primary);border-radius:50%;animation:typing 1s infinite alternate}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes typing{to{transform:translateY(-5px);opacity:.45}}
@media(max-width:760px){.chat-page-header{min-height:42px}.current-chat-title{display:none}.chat-shell{padding-top:8px}.chat-welcome{padding:9px 12px}.welcome-mark{display:none}.chat-stage{padding-bottom:12px}.composer{padding:0 10px 9px}.topic-list{grid-template-columns:repeat(2,minmax(0,1fr))}.params-bar .select{flex:1}.params-divider,.platform-label{display:none}.chat-bubble{max-width:88%}}

/* 抖音成片相关样式 */
.douyin-scenes{margin-top:12px;padding:12px;background:#f8f6f2;border-radius:8px;border:1px solid var(--border-light)}
.scenes-header{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--text-primary)}
.scene-card{padding:10px;margin-bottom:8px;background:#fff;border:1px solid var(--border-light);border-radius:6px}
.scene-card:last-child{margin-bottom:0}
.scene-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:6px}
.scene-visual,.scene-voiceover,.scene-text{font-size:12px;margin-bottom:4px;line-height:1.5}
.scene-visual strong,.scene-voiceover strong,.scene-text strong{color:var(--text-primary)}
.render-panel{margin-top:12px;padding:12px;background:#fff;border-radius:8px;border:1px solid var(--border-light);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.render-voice-select{display:flex;align-items:center;gap:8px}
.render-voice-select label{font-size:12px;color:var(--text-secondary)}
.render-voice-select select{min-width:80px;padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px}
.render-status{width:100%;margin-top:8px}
.render-progress{height:6px;background:var(--border-light);border-radius:3px;overflow:hidden}
.render-progress i{display:block;height:100%;background:var(--primary);transition:width .3s}
.render-status-text{font-size:11px;color:var(--text-muted);margin-top:4px}
.render-success{padding:8px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px}
.render-success video{display:block;margin:8px 0}
.render-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.render-error{padding:8px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;color:#dc2626;font-size:12px}
.render-review-summary{display:grid;gap:6px;margin-top:6px;font-size:12px;line-height:1.55}
.render-review-summary details{color:var(--text-secondary)}
.typing-status{margin-left:8px;color:var(--text-muted);font-size:12px;vertical-align:middle}

</style>
</head>
<body>
<div class="app-layout" id="app"></div>
<div id="toastContainer" class="toast-container"></div>
<script src="/static/common.js?v=9"></script>
<script src="/static/editor-transfer.js?v=3"></script>
<script>
const PAGE_ID='chat';
const platformNames={wechat_mp:'微信公众号',xiaohongshu:'小红书',douyin:'抖音',facebook:'Facebook',twitter:'Twitter',reddit:'Reddit'};
// 用户从“帮我生成视频”进入时，不应先被迫理解平台设置；默认以本产品的
// 短视频主路径抖音承接，用户仍可一键改选或增加其他平台。
const selectedPlatforms=new Set(['douyin']);
const CHAT_SESSIONS_KEY='logiflowChatSessionsV2';
const CURRENT_SESSION_KEY='logiflowCurrentChatSession';
let chatSessions=[];
let currentSessionId='';
let chatHistory=[];
let lastResult=null;
let topicCategories=[];
let selectedTopic='';
let isSending=false;
const resultStore=new Map();

function welcomeMarkup(){return '<div class="chat-welcome"><div class="welcome-mark">✦</div><div><h2>把物流经验，变成好内容</h2><p>选一个方向，或直接输入需求；生成前都可以继续补充细节。</p></div></div>';}

async function init(){
  loadChatSessions();
  await ensureMediaCapabilities();
  document.getElementById('app').innerHTML=`${renderSidebar(PAGE_ID)}
  <main class="main-content chat-main">
    <header class="page-header chat-page-header"><div class="chat-title"><h1 class="page-title">AI 对话</h1><span class="current-chat-title" id="currentChatTitle"></span></div><div class="header-actions"><button id="historyBtn" class="btn btn-secondary btn-sm" onclick="openHistory()">历史对话</button><button id="newChatBtn" class="btn btn-primary btn-sm" onclick="startNewChat()">＋ 新对话</button></div></header>
    ${getPlatformContext() === 'wechat_mp' ? `<div class="card" style="border-left:4px solid #07C160;margin:0 24px 12px;"><div class="card-body" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;">当前生产平台：<b>微信公众号</b> —— 图文长文请在<a href="/articles.html" style="color:#2563EB;font-weight:600;">「公众号图文」工作台</a>生产</div></div>` : ''}
    <section class="chat-shell is-empty" id="chatShell">
      <div id="chatMessages" class="chat-stage">
        ${welcomeMarkup()}
      </div>
      <div class="composer">
        <details class="topic-picker" id="topicPicker">
          <summary><span>快捷选题</span><span class="topic-count" id="topicCount">按分类浏览</span><span class="selected-topic-label" id="selectedTopicLabel"></span></summary>
          <div class="topic-panel"><div class="topic-categories" id="topicCategories"></div><div class="topic-list" id="quickTopics"></div></div>
        </details>
        <div class="params-bar">
          <select id="toneSelect" class="select"><option value="professional">专业严谨</option><option value="friendly">亲切自然</option><option value="urgent">紧急通知</option></select>
          <select id="lengthSelect" class="select"><option value="short">短文案</option><option value="medium" selected>中文案</option><option value="long">长文案</option></select>
          <span class="params-divider"></span><span class="platform-label" style="font-size:11px;color:var(--text-muted);font-weight:700;">目标平台</span>
          ${Object.entries(platformNames).map(([k,v])=>`<button class="platform-chip ${selectedPlatforms.has(k)?'active':''}" data-platform="${k}" onclick="togglePlatform('${k}',this)">${v}</button>`).join('')}
        </div>
        <div class="chat-input-row"><textarea id="chatInput" class="input input-glow" placeholder="描述你想写什么，或先从上方选择主题…" oninput="autoResize(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea><button id="sendBtn" class="btn btn-primary btn-glow send-btn" onclick="sendMessage()" aria-label="发送"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg></button></div>
        <div class="composer-hint" id="composerHint">Enter 发送 · Shift + Enter 换行</div>
        <div class="quick-commands"><span style="font-size:11px;color:var(--text-muted);">快捷指令</span>${[['/optimize','优化'],['/shorten','缩写'],['/expand','扩写'],['/translate','翻译'],['/hashtags','标签']].map(([c,n])=>`<button class="command-btn" onclick="sendCommand('${c}')">${c} ${n}</button>`).join('')}</div>
      </div>
    </section>
    <button class="history-backdrop" id="historyBackdrop" onclick="closeHistory()" aria-label="关闭历史对话"></button>
    <aside class="history-drawer" id="historyDrawer" aria-label="历史对话"><div class="history-head"><h2>历史对话</h2><button class="btn btn-ghost btn-sm" onclick="closeHistory()" aria-label="关闭">✕</button></div><div class="history-list" id="historyList"></div></aside>
  </main>`;
  await loadQuickTopics();
  restoreHistory();
  renderHistoryList();
}

async function loadQuickTopics(){
  const fallbacks=[{id:'customs',name_zh:'清关税务',topics:['PAT注册流程详解','进口关税计算方法','海关查验处理指南']},{id:'port',name_zh:'港口运价',topics:['德班港拥堵实时预警','开普敦航线时效分析','集装箱运价走势预测']}];
  topicCategories=fallbacks;
  try{const r=await apiFetch('/api/topics');const cats=await r.json();if(Array.isArray(cats)&&cats.length)topicCategories=cats;}catch(e){}
  document.getElementById('topicCount').textContent=`${topicCategories.length} 类 · ${topicCategories.reduce((n,c)=>n+(c.topics?.length||0),0)} 个选题`;
  document.getElementById('topicCategories').innerHTML=topicCategories.map((c,i)=>`<button class="topic-category ${i===0?'active':''}" data-index="${i}">${escapeHtml(c.name_zh)}</button>`).join('');
  document.getElementById('topicCategories').addEventListener('click',e=>{const btn=e.target.closest('.topic-category');if(!btn)return;document.querySelectorAll('.topic-category').forEach(b=>b.classList.toggle('active',b===btn));renderTopicList(Number(btn.dataset.index));});
  document.getElementById('quickTopics').addEventListener('click',e=>{const btn=e.target.closest('.quick-topic');if(btn)quickTopic(btn.dataset.topic,btn);});
  renderTopicList(0);
}

function renderTopicList(index){const topics=topicCategories[index]?.topics||[];document.getElementById('quickTopics').innerHTML=topics.map(t=>`<button class="quick-topic" data-topic="${escapeHtml(t)}" title="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('');}

function sessionId(){return `chat_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;}
function createSession(messages=[]){const now=Date.now();return{id:sessionId(),title:'新对话',createdAt:now,updatedAt:now,messages};}
function loadChatSessions(){
  try{chatSessions=JSON.parse(localStorage.getItem(CHAT_SESSIONS_KEY)||'[]');if(!Array.isArray(chatSessions))chatSessions=[];}catch(e){chatSessions=[];}
  if(!chatSessions.length){
    let legacy=[];try{legacy=JSON.parse(localStorage.getItem('logiflowChatHistory')||'[]');if(!Array.isArray(legacy))legacy=[];}catch(e){}
    chatSessions=[createSession(legacy)];localStorage.removeItem('logiflowChatHistory');
  }
  currentSessionId=localStorage.getItem(CURRENT_SESSION_KEY)||chatSessions[0].id;
  if(!chatSessions.some(s=>s.id===currentSessionId))currentSessionId=chatSessions[0].id;
  chatHistory=currentSession().messages||[];
}
function currentSession(){return chatSessions.find(s=>s.id===currentSessionId)||chatSessions[0];}
function deriveTitle(messages){const first=messages.find(m=>m.role==='user')?.content?.trim();return first?(first.length>24?first.slice(0,24)+'…':first):'新对话';}
function saveSessions(){
  const session=currentSession();if(session){session.messages=chatHistory.slice(-40);session.title=deriveTitle(session.messages);session.updatedAt=Date.now();}
  chatSessions.sort((a,b)=>b.updatedAt-a.updatedAt);localStorage.setItem(CHAT_SESSIONS_KEY,JSON.stringify(chatSessions.slice(0,30)));localStorage.setItem(CURRENT_SESSION_KEY,currentSessionId);renderHistoryList();updateCurrentTitle();
}
function restoreHistory(){
  const box=document.getElementById('chatMessages');box.innerHTML=chatHistory.length?'':welcomeMarkup();
  chatHistory.forEach(m=>appendMessage(m.role,m.content,m.result||null,false));
  document.getElementById('chatShell').classList.toggle('is-empty',chatHistory.length===0);
  lastResult=[...chatHistory].reverse().find(m=>m.role==='assistant'&&m.result)?.result||null;updateCurrentTitle();
}
function updateCurrentTitle(){const el=document.getElementById('currentChatTitle');if(el)el.textContent=currentSession()?.title||'新对话';}
function formatSessionTime(value){const d=new Date(value);const today=new Date();return d.toDateString()===today.toDateString()?d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'});}
function renderHistoryList(){
  const box=document.getElementById('historyList');if(!box)return;
  const visible=chatSessions.filter(s=>s.messages?.length||s.id===currentSessionId);
  box.innerHTML=visible.length?visible.map(s=>`<div class="history-item ${s.id===currentSessionId?'active':''}"><button class="history-select" onclick="switchSession('${s.id}')"><span class="history-title">${escapeHtml(s.title||'新对话')}</span><span class="history-meta">${s.messages?.length||0} 条消息 · ${formatSessionTime(s.updatedAt)}</span></button><button class="history-delete" onclick="deleteSession('${s.id}')" aria-label="删除 ${escapeHtml(s.title||'新对话')}">×</button></div>`).join(''):'<div class="history-empty">还没有历史对话</div>';
}
function resetComposer(){selectedTopic='';document.getElementById('selectedTopicLabel')?.classList.remove('show');const input=document.getElementById('chatInput');if(input){input.value='';autoResize(input);}const hint=document.getElementById('composerHint');if(hint)hint.textContent='Enter 发送 · Shift + Enter 换行';}
function startNewChat(){
  if(isSending){showToast('请等待当前回复完成','error');return;}
  const existing=currentSession();if(existing&&!existing.messages.length){closeHistory();document.getElementById('chatInput')?.focus();return;}
  const session=createSession();chatSessions.unshift(session);currentSessionId=session.id;chatHistory=session.messages;lastResult=null;resetComposer();restoreHistory();saveSessions();closeHistory();document.getElementById('chatInput')?.focus();
}
function switchSession(id){if(isSending){showToast('请等待当前回复完成','error');return;}const session=chatSessions.find(s=>s.id===id);if(!session)return;currentSessionId=id;chatHistory=session.messages||[];resetComposer();restoreHistory();saveSessions();closeHistory();}
function deleteSession(id){
  if(isSending){showToast('请等待当前回复完成','error');return;}
  chatSessions=chatSessions.filter(s=>s.id!==id);
  if(!chatSessions.length)chatSessions=[createSession()];
  if(currentSessionId===id)currentSessionId=chatSessions[0].id;
  chatHistory=currentSession().messages||[];restoreHistory();saveSessions();
}
function openHistory(){renderHistoryList();document.getElementById('historyDrawer').classList.add('open');document.getElementById('historyBackdrop').classList.add('open');}
function closeHistory(){document.getElementById('historyDrawer')?.classList.remove('open');document.getElementById('historyBackdrop')?.classList.remove('open');}

function hotspotRetrievalMarkup(result, resultId){
  const retrieval=result?.hotspot_retrieval;
  if(!retrieval)return '';
  if(retrieval.status==='matched'){
    const hooks=(retrieval.hooks||[]).map(h=>`<li>${escapeHtml(h.title||'热点 Hook')}：${escapeHtml(h.description||'已确认现场片段')}</li>`).join('');
    const readiness=retrieval.video?.delivery_readiness;
    const readinessText=readiness?.message?`<p>${escapeHtml(readiness.message)}</p>`:'';
    const swap=producibleTopicsMarkup(result?.producible_topics||retrieval.producible_topics||[], resultId, true);
    return `<div class="result-warning"><strong>热点 Hook 已自动锁定</strong><p>${escapeHtml(retrieval.relevance?.reason||retrieval.message||'')}</p><ul>${hooks}</ul>${readinessText}<p>保留你的原主题叙事；可更换 Hook，或直接创建 60 秒视频项目。</p>${swap}<a class="btn btn-secondary btn-sm" href="/assets.html?library=hotspot">查看已确认 Hook</a></div>`;
  }
  if(retrieval.status==='not_requested')return '';
  if(retrieval.failure_class==='no_event_anchor'||result?.result_state==='topic_needs_event_anchor'||result?.result_state==='hook_selection_required')return '';
  return `<div class="result-warning" data-discovery-request="${escapeHtml(String(retrieval.request_id||''))}"><strong>文案草稿已生成 · 视频素材补采中</strong><p>${escapeHtml(retrieval.message||'已进入定向采集队列。')}</p><p>视频按钮会在 Hook 就绪后自动开放；可展开详情查看进度。</p></div>`;
}

function funnelDetailsMarkup(funnel){
  if(!funnel||typeof funnel!=='object')return '';
  const items=[
    ['扫描',funnel.scanned],
    ['场景不匹配',funnel.scene_mismatch],
    ['相关度不足',funnel.relevance_low],
    ['不可播放/未确认',funnel.not_playable],
    ['种类过滤',funnel.kind_filtered],
    ['会话复用降权',funnel.duplicate_or_recent],
    ['进入候选',funnel.passed],
    ['最终锁定',funnel.selected],
  ];
  return `<li>漏斗：${items.map(([k,v])=>`${k} ${Number(v||0)}`).join(' · ')}</li>`;
}

function producibleTopicsMarkup(topics, resultId, asSwap){
  if(!Array.isArray(topics)||!topics.length)return '';
  const buttons=topics.slice(0,5).map((item)=>{
    const label=escapeHtml(item.hook_title||item.topic||'可用 Hook');
    const reason=escapeHtml(item.reason||item.scene_label||'');
    const eventId=Number(item.hook_event_id||0);
    if(!eventId||!resultId)return '';
    return `<button type="button" class="btn btn-secondary btn-sm" style="min-height:44px;margin:0 8px 8px 0" data-hook-event-id="${eventId}" data-hook-title="${label}" onclick="bindHookToOriginalTopic('${resultId}',${eventId},this)">${label}</button><div class="muted" style="font-size:11px;margin:0 0 8px">${reason}</div>`;
  }).join('');
  if(!buttons)return '';
  const title=asSwap?'更换开场 Hook':'选择开场 Hook（绑定到你的原主题）';
  const hint=asSwap
    ?'点选后立即换绑，无需改写输入框或重新发送。'
    :'点选库内 Hook 绑定到当前主题后，即可创建视频项目；不会改写你的原 prompt。';
  return `<div class="producible-topics" style="margin-top:10px"><strong>${title}</strong><p style="font-size:12px;margin:4px 0 8px">${hint}</p>${buttons}</div>`;
}

function bindHookToOriginalTopic(resultId, eventId, btn){
  const result=resultStore.get(resultId);
  if(!result||!eventId)return;
  const title=btn?.getAttribute('data-hook-title')||'已选 Hook';
  const originalTopic=result.hotspot_retrieval?.topic||result.topic||'';
  result.hotspot_retrieval={
    ...(result.hotspot_retrieval||{}),
    status:'matched',
    failure_class:null,
    message:`已绑定 Hook「${title}」到原主题，可直接创建视频项目。`,
    hooks:[{event_clip_id:eventId,title,description:'用户点选绑定的开场 Hook'}],
    video:{
      status:'ready',
      hotspot_event_ids:[Number(eventId)],
      delivery_readiness:{delivery_ready:true,status:'delivery_ready',message:'已绑定可用 Hook，可创建项目。'},
    },
    topic:originalTopic,
  };
  result.result_state='formal_content';
  result.failure_class=null;
  resultStore.set(resultId,result);
  const card=document.getElementById(`result-${resultId}`);
  if(card)card.outerHTML=resultCardMarkup(result,resultId);
  showToast('已绑定 Hook 到原主题，可创建视频项目','success');
}

function resultStateCard(result,id){
  const state=result?.result_state||'formal_content';
  const map={
    formal_content:{title:'平台内容已生成',hint:'可发送到编辑器继续修订；抖音视频请创建 60 秒视频项目。'},
    framework_pending_evidence:{title:'对比框架已生成 · 待补资料',hint:'请补充候选服务商、价格/时效来源与测试日期后再生成正式评测。'},
    hotspot_retrieval_pending:{title:'文案草稿已生成 · 视频素材补采中',hint:'等待热点 Hook 就绪后，本卡片会开放「创建60秒视频项目」。'},
    hook_coverage_gap:{title:'库未覆盖该时效事件',hint:'可等待定向补采，或点选下方 Hook 绑定到原主题。'},
    hook_gate_blocked:{title:'有候选但未过质量门禁',hint:'请点选下方已通过门禁的 Hook 绑定到原主题。'},
    hook_selection_required:{title:'请选择开场 Hook',hint:'系统未自动命中；点选下方 Hook 绑定到你的原主题即可开拍，无需改写输入框。'},
    topic_needs_event_anchor:{title:'暂无可用 Hook',hint:'库内暂无可用开场；请补充具体口岸/港口/道路事件，或稍后再试。'},
    brand_assets_insufficient:{title:'热点已就绪 · 将按库存自适应出片',hint:'Buffalo 自有动态不足理想数量时，系统会降级规划并继续创建项目；补充素材仅为可选增强。'},
    authenticity_blocked:{title:'内容暂不可使用 · 请补充证据',hint:'补充带来源的资料后重新生成。'},
    generation_unavailable:{title:'文案模型暂不可用',hint:'请检查内容模型配置或稍后重试。'},
  };
  const card=map[state]||map.formal_content;
  const details=[];
  if(result?.content_mode)details.push(`意图：${result.content_mode}`);
  if(result?.failure_class||result?.hotspot_retrieval?.failure_class)details.push(`失败类：${result.failure_class||result.hotspot_retrieval.failure_class}`);
  if(result?.event_anchor)details.push(`事件锚点：${result.event_anchor.has_event_anchor?'有':'无'}；场景：${(result.event_anchor.logistics_scenes||[]).join(',')||'无'}`);
  if(result?.evidence_state)details.push(`证据：${result.evidence_state.evidence_state||'unknown'}`);
  if(result?.hotspot_retrieval?.request_id)details.push(`补采请求 #${result.hotspot_retrieval.request_id}`);
  if(result?.hotspot_retrieval?.message)details.push(result.hotspot_retrieval.message);
  const adaptation=result?.hotspot_retrieval?.video?.delivery_readiness?.adaptation;
  if(adaptation?.adapted)details.push(`自适应：${adaptation.message||(adaptation.strategies||[]).join('、')||'按现有库存降级'}`);
  const funnelHtml=funnelDetailsMarkup(result?.hotspot_retrieval?.funnel);
  const topics=result?.producible_topics||result?.hotspot_retrieval?.producible_topics||[];
  const frameworkActions=state==='framework_pending_evidence'||state==='authenticity_blocked'
    ?`<div class="result-actions" style="margin-top:8px"><button class="btn btn-secondary btn-sm" onclick="promptComparisonEvidence()">补充评测资料</button><button class="btn btn-primary btn-sm" onclick="sendToEditor('${id}',0)">编辑对比框架</button><button class="btn btn-secondary btn-sm" onclick="copyResult('${id}',0)">复制框架</button></div>`
    :'';
  const topicActions=(state==='hook_selection_required'||state==='topic_needs_event_anchor'||state==='hook_coverage_gap'||state==='hook_gate_blocked'||state==='hotspot_retrieval_pending')
    ?producibleTopicsMarkup(topics,id,false):'';
  const fixLink=(card.fix&&state!=='brand_assets_insufficient')
    ?`<a class="btn btn-secondary btn-sm" href="${escapeHtml(card.fix)}" style="margin-top:8px;display:inline-flex;min-height:44px;align-items:center">前往修复</a>`
    :(state==='brand_assets_insufficient'
      ?`<a class="btn btn-secondary btn-sm" href="/assets.html" style="margin-top:8px;display:inline-flex;min-height:44px;align-items:center">可选：补充 Buffalo 素材</a>`
      :'');
  return `<div class="result-state-card" data-result-state="${escapeHtml(state)}"><strong>${escapeHtml(card.title)}</strong><p class="result-state-hint" style="margin:8px 0 0;font-size:13px;line-height:1.55;color:var(--text-secondary)">${escapeHtml(card.hint)}</p>${fixLink}${frameworkActions}${topicActions}${details.length||funnelHtml?`<details class="result-state-details"><summary>查看详情</summary><ul>${details.map(item=>`<li>${escapeHtml(item)}</li>`).join('')}${funnelHtml}</ul></details>`:''}</div>`;
}

function assistantBubbleText(result){
  const state=result?.result_state;
  if(state==='framework_pending_evidence')return '对比框架已生成 · 待补资料';
  if(state==='authenticity_blocked')return '内容暂不可使用 · 请补充证据';
  if(state==='generation_unavailable')return '文案模型暂不可用 · 未生成正式内容';
  if(state==='hook_selection_required')return '请选择开场 Hook · 绑定后可直接建项';
  if(state==='topic_needs_event_anchor')return '暂无可用 Hook';
  if(state==='hook_coverage_gap')return '库未覆盖该时效事件';
  if(state==='hook_gate_blocked')return '有候选但未过质量门禁';
  if(state==='hotspot_retrieval_pending')return '文案草稿已生成 · 视频素材补采中';
  if(state==='brand_assets_insufficient')return '脚本已生成 · 将按库存自适应出片';
  if(result?.outputs?.length>1)return `已按 ${result.outputs.length} 个平台分别生成内容。`;
  return '平台内容已生成';
}

  const outputs=result.outputs?.length?result.outputs:[{platform:Array.from(selectedPlatforms)[0]||'xiaohongshu',title:result.title,body:result.body||result.content,hashtags:result.hashtags||[]}];

  const showHotspotBanner=result?.result_state==='hotspot_retrieval_pending'||result?.hotspot_retrieval?.status==='matched'||result?.result_state==='brand_assets_insufficient'||result?.result_state==='hook_selection_required';
  const tabs=outputs.map((o,i)=>`<button class="result-tab ${i===0?'active':''}" onclick="selectResultTab('${id}',${i},this)">${escapeHtml(platformNames[o.platform]||o.platform)}</button>`).join('');
  const panels=outputs.map((o,i)=>{const tags=Array.isArray(o.hashtags)?o.hashtags:[];const warnings=Array.isArray(o.quality_warnings)?o.quality_warnings:[];const isDouyin=o.platform==='douyin';const douyinCta=isDouyin?douyinVideoEntryMarkup(o,id,i,result.hotspot_retrieval,result):'';const editorLabel=(result.result_state==='framework_pending_evidence'||result.result_state==='authenticity_blocked')?'编辑对比框架':'发送到编辑器';const actions=isDouyin
    ?`${douyinCta}<div class="result-actions" style="margin-top:8px"><button class="btn btn-secondary btn-sm" onclick="copyResult('${id}',${i})">复制摘要</button></div>`
    :`<div class="result-actions"><button class="btn btn-primary btn-sm" onclick="sendToEditor('${id}',${i})">${editorLabel}</button><button class="btn btn-secondary btn-sm" onclick="copyResult('${id}',${i})">复制</button></div>`;
  const bodyText=isDouyin?((o.body||o.content||'').slice(0,220)+((o.body||o.content||'').length>220?'…':'')):(o.body||o.content||'');
  return `<div class="result-panel ${i===0?'active':''}" data-index="${i}"><div class="result-title">${escapeHtml(o.title||'AI 生成内容')}</div><div class="result-body">${escapeHtml(bodyText)}</div>${tags.length?`<div class="result-tags">${tags.map(t=>'#'+escapeHtml(String(t).replace(/^#/,''))).join(' ')}</div>`:''}${warnings.length?`<div class="result-warning">提示：${warnings.map(escapeHtml).join('；')}</div>`:''}${actions}</div>`}).join('');

// 抖音：需求入口 → 创建项目后跳转视频工作台（不在聊天内生产）
let mediaCapabilities = {};
const discoveryPollers = {};

async function ensureMediaCapabilities() {
  if (mediaCapabilities && Object.keys(mediaCapabilities).length) return mediaCapabilities;
  try {
    const response = await apiFetch('/api/media/capabilities');
    mediaCapabilities = await response.json();
  } catch (error) {
    mediaCapabilities = {};
  }
  return mediaCapabilities;
}

function douyinVideoEntryMarkup(output, resultId, index, hotspotRetrieval, result) {
  if (result?.content_mode === 'comparison_research' && result?.result_state !== 'formal_content') {
    return `<div class="douyin-video-entry"><p class="result-state-hint">对比框架证据不足，暂不可创建视频项目。</p></div>`;
  }
  const deliveryReadiness=hotspotRetrieval?.video?.delivery_readiness;
  const videoReady=hotspotRetrieval?.status==='matched'&&hotspotRetrieval?.video?.status==='ready'&&(deliveryReadiness?.delivery_ready??true);
  const adapted=Boolean(deliveryReadiness?.adaptation?.adapted);
  const scriptState=classifyDouyinScriptState({
    durationTarget: output.duration_target,
    scenes: output.scenes||[],
    videoWorkflow: {
      status: videoReady ? 'ready' : 'blocked',
      block_reason: deliveryReadiness?.message || (hotspotRetrieval?.status==='matched'?'热点 Hook 规划未通过':'等待热点 Hook'),
      target_duration_ms: 60000,
    },
    importedFromChat: true,
  });
  if (scriptState.mode === 'legacy') {
    return `<div class="douyin-video-entry"><p class="result-state-hint">${escapeHtml(scriptState.blockReason)}</p>
      <a class="btn btn-secondary btn-sm" style="min-height:44px;display:inline-flex;align-items:center" href="/video-migrate.html?from=chat&result=${encodeURIComponent(resultId)}&index=${index}">打开历史草稿迁移</a></div>`;
  }
  if (!videoReady || !scriptState.canProduce) {
    const reason=deliveryReadiness?.message || scriptState.blockReason || (hotspotRetrieval?.status==='matched'?'热点 Hook 规划未通过，暂不可创建':'等待热点 Hook 就绪后再创建视频项目');
    return `<div class="douyin-video-entry"><p class="result-state-hint">${escapeHtml(reason)}</p></div>`;
  }
  const adaptHint=adapted
    ? (deliveryReadiness?.adaptation?.message || deliveryReadiness?.message || '将按现有库存自适应规划并继续出片')
    : '主题结论已生成 · 热点 Hook 已就绪 · 正式成片将在视频工作台按 60 秒双素材规划';
  const optionalAssets=adapted
    ? `<a class="btn btn-secondary btn-sm" style="min-height:44px;display:inline-flex;align-items:center;margin-left:8px" href="/assets.html">可选：补充素材</a>`
    : '';
  return `<div class="douyin-video-entry">
    <p class="result-state-hint">${escapeHtml(adaptHint)}</p>
    <button class="btn btn-primary" style="min-height:44px;margin-top:8px" id="generate-video-${resultId}-${index}" onclick="createSixtySecondVideoProject('${resultId}', ${index})">创建60秒视频项目</button>${optionalAssets}
    <div id="render-status-${resultId}-${index}" class="render-status" style="display:none;margin-top:8px;font-size:12px;color:var(--text-muted)"></div>
  </div>`;
}

async function scheduleDiscoveryPoll(resultId, requestId){
  if(!requestId||discoveryPollers[resultId])return;
  let failures=0;
  discoveryPollers[resultId]=window.setInterval(async()=>{
    try{
      const response=await apiFetch(`/api/hotspot-discovery-requests/${requestId}`,{cache:'no-store'});
      const payload=await response.json();
      failures=0;
      const result=resultStore.get(resultId);
      if(!result){clearInterval(discoveryPollers[resultId]);delete discoveryPollers[resultId];return;}
      if(payload.status==='matched'&&payload.hooks?.length){
        result.hotspot_retrieval={
          ...(result.hotspot_retrieval||{}),
          status:'matched',
          hooks:payload.hooks,
          message:'补采完成，已确认 Hook 可用。',
          video:{status:'ready',hotspot_event_ids:payload.hooks.map(item=>item.event_clip_id),delivery_readiness:{delivery_ready:true}},
        };
        result.result_state='formal_content';
        resultStore.set(resultId,result);
        const card=document.getElementById(`result-${resultId}`);
        if(card)card.outerHTML=resultCardMarkup(result,resultId);
        clearInterval(discoveryPollers[resultId]);delete discoveryPollers[resultId];
        showToast('热点 Hook 已就绪，可创建视频项目','success');
        return;
      }
      if(['unmatched','failed','cancelled_misrouted'].includes(payload.status)){
        result.hotspot_retrieval={...(result.hotspot_retrieval||{}),status:payload.status,message:payload.error_message||payload.recovery||'补采未完成'};
        result.result_state=payload.status==='cancelled_misrouted'?'framework_pending_evidence':'hotspot_retrieval_pending';
        resultStore.set(resultId,result);
        const card=document.getElementById(`result-${resultId}`);
        if(card)card.outerHTML=resultCardMarkup(result,resultId);
        clearInterval(discoveryPollers[resultId]);delete discoveryPollers[resultId];
      }
    }catch(e){
      failures+=1;
      if(failures>=5){clearInterval(discoveryPollers[resultId]);delete discoveryPollers[resultId];}
    }
  },4000);
}

async function createSixtySecondVideoProject(resultId, index) {
  const statusDiv = document.getElementById(`render-status-${resultId}-${index}`);
  const result = resultStore.get(resultId);
  const hotspotRetrieval = result?.hotspot_retrieval;
  const dualLibraryVideo = hotspotRetrieval?.video;
  const output = outputById(resultId, index);
  if (!output) {
    showToast('没有可创建的抖音内容', 'error');
    return;
  }
  if (hotspotRetrieval?.status !== 'matched' || dualLibraryVideo?.status !== 'ready') {
    showToast('正在补采相关热点素材；至少一段相关、已确认 Hook 入库后才能创建视频项目', 'error');
    return;
  }
  if (dualLibraryVideo.delivery_readiness && !dualLibraryVideo.delivery_readiness.delivery_ready) {
    showToast(dualLibraryVideo.delivery_readiness.message || '当前 Buffalo 自有素材不足以形成正式成片', 'error');
    return;
  }

  await ensureMediaCapabilities();
  const selection = parseVoiceSelection(voiceOptionValue((mediaCapabilities.voice_options || defaultVoiceOptions())[0]));

  if (statusDiv) {
    statusDiv.style.display = 'block';
    statusDiv.textContent = '正在创建视频项目…';
  }

  try {
    if (output.video_project_id) {
      location.href = `/video-project.html?id=${encodeURIComponent(output.video_project_id)}&stage=brief`;
      return;
    }
    const taskResponse = await apiFetch('/api/ai/chat/dual-library-video', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        topic: hotspotRetrieval.topic || selectedTopic || output.title || '南非物流热点',
        hotspot_event_ids: dualLibraryVideo.hotspot_event_ids,
        platform: 'douyin',
        target_duration_ms: 60000,
        tts_provider: selection.tts_provider,
        voice: selection.voice,
        session_id: currentSessionId,
        idempotency_key: `chat-video-${currentSessionId}-${resultId}-${index}`,
      })
    });
    const taskResult = await taskResponse.json();
    if (!taskResult.job?.id || !taskResult.project?.id) throw new Error('未能创建视频项目');
    output.video_project_id = taskResult.project.id;
    output.video_generation_job_id = taskResult.job.id;
    saveSessions();
    refreshVideoTaskBadge();
    showToast(taskResult.created ? '视频项目已创建，正在进入工作台' : '已恢复视频项目，正在进入工作台', 'success');
    location.href = `/video-project.html?id=${encodeURIComponent(taskResult.project.id)}&stage=brief`;
  } catch (e) {
    if (statusDiv) statusDiv.textContent = e.message;
    showToast(e.message, 'error');
  }
}

async function startDouyinRender(resultId, index) {
  return createSixtySecondVideoProject(resultId, index);
}

function appendMessage(role,text,result=null,scroll=true){
  const shell=document.getElementById('chatShell');const box=document.getElementById('chatMessages');if(shell?.classList.contains('is-empty'))box.querySelector('.chat-welcome')?.remove();shell?.classList.remove('is-empty');const row=document.createElement('div');row.className=`chat-row ${role}`;
  const resultId=`r${Date.now()}${Math.random().toString(36).slice(2,6)}`;const card=result?resultCardMarkup(result,resultId):'';const displayText=result?assistantBubbleText(result):text;
  row.innerHTML=`<div class="chat-avatar">${role==='user'?'我':'AI'}</div><div class="chat-bubble">${escapeHtml(displayText)}${card}</div>`;box.appendChild(row);if(scroll)box.scrollTop=box.scrollHeight;
}
function addTyping(){const row=document.createElement('div');row.id='typingRow';row.className='chat-row assistant';row.innerHTML='<div class="chat-avatar">AI</div><div class="chat-bubble"><span class="typing"><i></i><i></i><i></i></span><span class="typing-status" id="typingStatus">正在识别内容意图并生成草稿…</span></div>';document.getElementById('chatMessages').appendChild(row);}
function setTypingStatus(message){const label=document.getElementById('typingStatus');if(label)label.textContent=message;}

async function sendMessage(topic=''){
  const input=document.getElementById('chatInput');const msg=input.value.trim();if(!msg)return;
  if(!selectedPlatforms.size){showToast('请先选择至少一个目标平台','error');return;}
  if(selectedPlatforms.has('wechat_mp')){
    if(selectedPlatforms.size===1){showToast('公众号图文走图文长文工作台，请进入「公众号图文」页投喂资料包生成','error');return;}
    showToast('公众号不会生成短文案，已忽略该平台','info');selectedPlatforms.delete('wechat_mp');
  }
  const chosenTopic=topic||selectedTopic;input.value='';autoResize(input);selectedTopic='';document.getElementById('selectedTopicLabel').classList.remove('show');document.getElementById('composerHint').textContent='Enter 发送 · Shift + Enter 换行';appendMessage('user',msg);chatHistory.push({role:'user',content:msg});saveSessions();addTyping();const typingTimers=[window.setTimeout(()=>setTypingStatus('正在生成内容，请稍候…'),8000),window.setTimeout(()=>setTypingStatus('仍在生成；完成后会显示框架或正式内容状态，无需重复提交。'),30000)];setSending(true);
  try{const r=await apiFetch('/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chatHistory.map(({role,content})=>({role,content})),context:'',command:null,tone:document.getElementById('toneSelect').value,length:document.getElementById('lengthSelect').value,platforms:Array.from(selectedPlatforms),topic:chosenTopic,session_id:currentSessionId})});const data=await r.json();lastResult=data;document.getElementById('typingRow')?.remove();appendMessage('assistant',data.content,data);chatHistory.push({role:'assistant',content:data.content,result:data});saveSessions();}
  catch(e){document.getElementById('typingRow')?.remove();appendMessage('assistant','请求失败：'+e.message);showToast('AI 请求失败','error');}finally{typingTimers.forEach(timer=>window.clearTimeout(timer));setSending(false);}
}
async function sendCommand(command){if(!lastResult?.body){showToast('请先生成一段内容','error');return;}if(!selectedPlatforms.size){showToast('请先选择至少一个目标平台','error');return;}
  if(selectedPlatforms.has('wechat_mp')){
    if(selectedPlatforms.size===1){showToast('公众号图文走图文长文工作台，请进入「公众号图文」页投喂资料包生成','error');return;}
    showToast('公众号不会生成短文案，已忽略该平台','info');selectedPlatforms.delete('wechat_mp');
  }
  appendMessage('user',command);chatHistory.push({role:'user',content:command});saveSessions();addTyping();setSending(true);try{const r=await apiFetch('/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chatHistory.map(({role,content})=>({role,content})),context:lastResult.content||lastResult.body,command,tone:document.getElementById('toneSelect').value,length:document.getElementById('lengthSelect').value,platforms:Array.from(selectedPlatforms),session_id:currentSessionId})});const data=await r.json();lastResult=data;document.getElementById('typingRow')?.remove();appendMessage('assistant',data.content,data);chatHistory.push({role:'assistant',content:data.content,result:data});saveSessions();}catch(e){document.getElementById('typingRow')?.remove();showToast(e.message,'error');}finally{setSending(false);}}
function outputById(id,index){const result=resultStore.get(id);return result?.outputs?.[index]||result;}
function sendToEditor(id,index=0){
  const draft=EditorTransfer.buildDraft(resultStore.get(id),index,Array.from(selectedPlatforms));if(!draft){showToast('没有可导入的内容','error');return;}
  localStorage.setItem('draft',JSON.stringify(draft));
  window.location.href='/editor.html';
}
async function copyResult(id,index=0){const output=outputById(id,index);if(!output)return;try{await navigator.clipboard.writeText(`${output.title||''}\n\n${output.body||output.content}`);showToast(`已复制${platformNames[output.platform]||''}版本`);}catch(e){showToast('复制失败','error');}}
function setSending(on){isSending=on;['sendBtn','historyBtn','newChatBtn'].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=on;});}
function clearChat(){if(isSending)return;chatHistory.length=0;lastResult=null;resetComposer();restoreHistory();saveSessions();}
init();
</script>
